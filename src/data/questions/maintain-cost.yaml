- id: maintain-cost-001
  domain: maintain
  services: [bigquery]
  type: multiple
  question: |
    ある企業のデータ基盤チームは、BigQuery の料金について社内勉強会の資料を作っています。オンデマンド料金と、エディションによる容量ベースの料金の違いを、利用者に正しく説明したいと考えています。

    BigQuery の料金に関する説明として正しいものはどれですか？
  choices:
    a: "オンデマンド料金ではクエリが処理したバイト数に、容量ベースの料金では確保したスロットの量と時間（スロット時間）に応じて課金される"
    b: "予約のベースライン スロットは使用の有無にかかわらず課金され、オートスケーリングで追加されたスロットはスケールアップしている間だけ課金される"
    c: "オンデマンド料金でクエリをバッチ優先度で実行すると、インタラクティブ優先度のクエリより低い単価で課金される"
    d: "月末だけ処理が増える場合は、Flex スロットを数日分だけ購入して既存の予約に追加するのが最も安い"
    e: "Standard エディションでも1年または3年の容量コミットメントを購入でき、従量課金より低い単価で使える"
  answer: [a, b]
  choiceNotes:
    a: "正解です。オンデマンド料金はクエリが処理したデータ量（バイト数）に、容量ベースの料金はクエリの量に関係なく確保したスロットの容量と時間に応じて課金されます。"
    b: "正解です。ベースライン スロットは予約が常に確保する下限なので、使わなくても課金されます。オートスケーリングのスロットは、ベースラインとアイドル スロットを使い切ったときに追加され、その間だけ課金されます。"
    c: "優先度はクエリの開始のしかたを変えるだけで、料金は変わりません。バッチ優先度でも処理したバイト数に対して同じ単価で課金されます。"
    d: "Flex スロットは旧来の定額料金とともに提供が終了しています。現在は、エディションの予約のオートスケーリングで一時的な増加に対応します。"
    e: "容量コミットメントを購入できるのは Enterprise エディションと Enterprise Plus エディションです。Standard エディションのスロットは、コミットメントの割引がない従量課金の単価で課金されます。"
  explanation: |
    BigQuery のコンピューティング料金は、次の2つのモデルから選びます。

    | モデル | 課金の単位 | 向いているワークロード |
    | --- | --- | --- |
    | オンデマンド料金 | クエリが処理したバイト数 | 量が少ない、または予測しにくい |
    | 容量ベース（エディション） | スロットの容量 × 時間 | 量が多く安定している、費用を予測したい |

    容量ベースの料金では、予約ごとに次の2つを設定します。

    - **ベースライン スロット**：常に確保される下限。使わなくても課金される。容量コミットメント（1年・3年）を購入すると割引単価になる（Enterprise / Enterprise Plus）
    - **最大予約サイズ**：ベースラインとの差がオートスケーリングの上限になる。追加されたスロットは従量課金

    2023年7月に旧来の **定額料金（flat-rate）** と **Flex スロット** は新規購入が終了し、エディションとオートスケーリングに置き換わりました。試験でこれらが選択肢に出たら、現在は使えない方法として除外します。
  references:
    - title: "BigQuery エディションについて"
      url: "https://docs.cloud.google.com/bigquery/docs/editions-intro"
    - title: "スロットの自動スケーリングの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/slots-autoscaling-intro"

- id: maintain-cost-002
  domain: maintain
  services: [bigquery]
  type: multiple
  question: |
    ある広告配信会社は、BigQuery をオンデマンド料金で利用しています。約50人のアナリストが、社内の分析ツールから各自のアカウントで API を呼び出し、数十 TB ある配信ログのテーブルにクエリを実行しています。先月、パーティションの条件を書き忘れたクエリ1回で高額な料金が発生しました。また、一部のアナリストが1日に大量のクエリを実行し、月の予算を圧迫しています。

    オンデマンド料金のまま、次の2つの要件を満たしたいと考えています。
    - 1回のクエリで処理するデータ量が一定を超える場合は、課金される前に失敗させる
    - アナリスト1人あたりの1日の処理量に上限を設ける

    どの対応を組み合わせるべきですか？
  choices:
    a: "分析ツールが送るすべてのクエリジョブに最大課金バイト数（maximumBytesBilled）を設定し、超える見込みのクエリを失敗させる"
    b: "プロジェクトにカスタム割り当て（custom quota）を設定し、ユーザーごとの1日あたりのクエリ使用量に上限を設ける"
    c: "すべてのクエリに LIMIT 句を付けるルールを定め、1回のクエリで読み取るデータ量を減らす"
    d: "Cloud Billing の予算アラートを設定し、費用がしきい値を超えたらアナリストにメールで通知する"
    e: "アナリストのクエリをすべてバッチ優先度で実行させ、処理したデータ量あたりの料金を下げる"
  answer: [a, b]
  choiceNotes:
    a: "正解です。最大課金バイト数を設定すると、実行前の見積もりが上限を超えるクエリは課金されずに失敗します。1回のクエリに対する上限になります。"
    b: "正解です。カスタム割り当てでは、プロジェクト全体またはユーザーごとに1日あたりのクエリ使用量（処理バイト数）の上限を設定でき、上限に達するとそれ以降のクエリは実行されません。"
    c: "LIMIT 句は返す行数を減らすだけで、テーブルをスキャンするデータ量は基本的に変わりません。料金を抑える効果はありません。"
    d: "予算アラートは費用が発生した後に通知するだけで、クエリの実行を止めません。課金される前に止めるという要件を満たしません。"
    e: "バッチ優先度はクエリの開始を遅らせるだけで、オンデマンド料金の単価は変わりません。"
  explanation: |
    オンデマンド料金で費用の上限を設ける方法は、**単位** の違いで使い分けます。

    | 方法 | 上限の単位 | 動作 |
    | --- | --- | --- |
    | 最大課金バイト数 | クエリ1回 | 見積もりが上限を超えるクエリを課金せずに失敗させる |
    | カスタム割り当て（ユーザーごと） | 1人あたり1日 | 上限に達したユーザーのクエリを止める |
    | カスタム割り当て（プロジェクト） | プロジェクト全体で1日 | プロジェクト内のすべてのクエリを止める |
    | 予算アラート | 請求額 | 通知だけ。クエリは止まらない |

    **データ例**: 最大課金バイト数を 1 TB、ユーザーごとの割り当てを1日 3 TB にした場合の、あるアナリストの1日

    | 時刻 | 処理量 | 結果 | 1日の累計 |
    | --- | --- | --- | --- |
    | 9時 | 0.5 TB | 実行 | 0.5 TB |
    | 10時 | 2 TB（条件の書き忘れ） | 失敗（最大課金バイト数）。課金なし | 0.5 TB |
    | 11〜15時 | 0.5 TB × 5件 | 実行 | 3 TB |
    | 16時 | 0.5 TB | 失敗（割り当て） | 3 TB |

    1回の大きなクエリは最大課金バイト数が、小さなクエリの積み重ねはカスタム割り当てが止めます。どちらか一方だけでは、もう一方の問題は防げません。

    ポイント
    - 最大課金バイト数は、コンソールのクエリ設定、`bq` コマンドの `--maximum_bytes_billed`、API の `maximumBytesBilled` で指定します。
    - カスタム割り当ては **オンデマンド料金だけ** に適用されます。容量ベースの料金では、スロット数で費用が決まるため使いません。
    - クラスタ化テーブルでは見積もりが実際の処理量より大きくなることがあるため、実際には上限内に収まるクエリでも失敗することがあります。
  references:
    - title: "費用の見積もりと管理"
      url: "https://docs.cloud.google.com/bigquery/docs/best-practices-costs"
    - title: "カスタムクエリ割り当てを作成する"
      url: "https://docs.cloud.google.com/bigquery/docs/custom-quotas"

- id: maintain-cost-003
  domain: maintain
  services: [dataflow]
  type: single
  question: |
    ある物流会社は、前日の配送記録（約5 TB）を集計する Dataflow のバッチ パイプラインを、毎日0時に起動しています。処理には通常1時間ほどかかり、集計結果は朝9時からの配送計画の会議で使います。パイプラインは Java の Apache Beam SDK で書かれています。

    経営層から Dataflow の費用を下げるよう求められました。開始時刻が数時間遅れても会議に間に合えば問題ありません。パイプラインのコードの変更を最小限に抑えて費用を下げるには、どうすればよいですか？
  choices:
    a: "ワーカーのマシンタイプを大きくして処理時間を短くし、ワーカーが課金される時間を減らす"
    b: "パイプラインを Spark に書き換え、スポット VM を使う Dataproc のクラスタで実行する"
    c: "ジョブの送信時に FlexRS（--flexRSGoal=COST_OPTIMIZED）を指定する"
    d: "起動オプションで最大ワーカー数（maxNumWorkers）を小さくし、同時に起動するワーカーの数を抑える"
  answer: [c]
  choiceNotes:
    a: "マシンタイプを大きくすると時間あたりの単価も上がり、処理全体に必要なリソース量はほとんど変わりません。費用を下げる方法として確実ではありません。"
    b: "コードの全面的な書き換えが必要になり、「コードの変更を最小限に」という要件に反します。"
    c: "正解です。FlexRS は、ジョブの開始を最大6時間遅らせる代わりに、プリエンプティブル VM と通常の VM を組み合わせて割引料金で実行します。起動オプションの指定だけで使えます。"
    d: "ワーカー数を減らしても、処理全体に必要なリソースの量は変わらず、単価も下がりません。処理時間が延びるだけです。"
  explanation: |
    **FlexRS（Flexible Resource Scheduling）** は、急ぎではない Dataflow のバッチジョブの費用を下げる機能です。

    - ジョブはキューに入り、作成から **6時間以内** に Dataflow が都合のよいタイミングで開始する
    - プリエンプティブル VM と通常の VM を組み合わせ、割引された単価で課金される
    - Dataflow Shuffle を使うため、VM が回収されても処理を続けやすい
    - 有効にする方法：Java は `--flexRSGoal=COST_OPTIMIZED`、Python は `--flexrs_goal=COST_OPTIMIZED`

    向いているのは、夜間の ETL や日次の集計など **開始時刻に余裕がある** バッチジョブです。終了時刻の SLA が厳しいジョブや、ストリーミング パイプラインには使いません。

    この問題では、0時に送信して最大6時間待っても、1時間の処理なら会議までに終わります。
  references:
    - title: "Flexible Resource Scheduling を使用する"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/flexrs"
    - title: "Dataflow の費用の最適化に関するベスト プラクティス"
      url: "https://docs.cloud.google.com/dataflow/docs/optimize-costs"

- id: maintain-cost-004
  domain: maintain
  services: [dataproc]
  type: single
  question: |
    ある製造業の企業は、工場のセンサーデータを処理する Spark ジョブを、複数のチームで共有する常時稼働の Dataproc クラスタで実行しています。クラスタは標準 VM のプライマリ ワーカー20台で構成されています。ジョブの入出力は Cloud Storage を使い、一部の中間データはクラスタの HDFS に置いています。ジョブは、タスクが途中で失敗しても再試行で完了できる設計です。

    処理能力を保ちつつ、クラスタのコンピューティング費用を下げたいと考えています。どうすればよいですか？
  choices:
    a: "プライマリ ワーカーは HDFS に必要な台数まで減らし、不足分をスポット VM のセカンダリ ワーカーで補う"
    b: "プライマリ ワーカーをすべて削除し、すべてのワーカーをスポット VM のセカンダリ ワーカーに置き換える"
    c: "非プリエンプティブル（標準 VM）のセカンダリ ワーカーを追加し、そのぶんプライマリ ワーカーの台数を減らす"
    d: "プライマリ ワーカーの台数を増やしてジョブを早く終わらせ、クラスタの稼働時間あたりの処理量を増やす"
  answer: [a]
  choiceNotes:
    a: "正解です。HDFS を持つプライマリ ワーカーは標準 VM のまま必要最小限にし、計算だけを担うセカンダリ ワーカーを割安なスポット VM にすると、処理能力を保ちながら費用を下げられます。"
    b: "HDFS のデータはプライマリ ワーカーにしか置けません。また、スポット VM はいつ回収されるかわからないため、すべてを置き換えるとジョブが進まなくなるおそれがあります。"
    c: "非プリエンプティブルのセカンダリ ワーカーは標準 VM と同じ料金です。台数の構成を変えるだけで、費用はほとんど下がりません。"
    d: "常時稼働のクラスタでワーカーを増やすと、その分の費用が増えます。費用を下げるという目的に反します。"
  explanation: |
    Dataproc のワーカーには2種類あり、役割が違います。

    | 種類 | HDFS | 主な VM | 用途 |
    | --- | --- | --- | --- |
    | プライマリ ワーカー | 持つ | 標準 VM | データの保存と処理 |
    | セカンダリ ワーカー | 持たない | プリエンプティブル VM（既定）、スポット VM、標準 VM（非プリエンプティブル） | 処理能力だけを追加 |

    ポイント
    - セカンダリ ワーカーは `--secondary-worker-type=spot` でスポット VM にできます。スポット VM には、従来のプリエンプティブル VM のような24時間の上限がありません。
    - スポット VM やプリエンプティブル VM は Google Cloud の都合で回収されるため、ワーカー全体に占める割合は半分未満にすることが推奨されています。
    - タスクの再試行で回復できる、または途中から再実行できるジョブに向いています。
  references:
    - title: "セカンダリ ワーカー"
      url: "https://docs.cloud.google.com/dataproc/docs/concepts/compute/secondary-vms"

- id: maintain-cost-005
  domain: maintain
  services: [bigquery]
  type: single
  question: |
    ある証券会社は、BigQuery の Enterprise エディションの予約を1つ作成し、本番の ETL 用プロジェクトとアドホック分析用プロジェクトの両方を割り当てています。朝の時間帯にアナリストの重いクエリが集中すると ETL のクエリに十分なスロットが回らず、7時までに ETL を終えるという SLA を守れない日が出ています。

    次の要件を満たしたいと考えています。
    - ETL は、アナリストの利用状況に左右されずに必要なスロットを確保する
    - ETL が使っていない時間帯の容量は、アドホック分析で有効に使う
    - 費用の増加はできるだけ抑える

    どうすればよいですか？
  choices:
    a: "既存の予約の最大予約サイズを大きくし、両方のプロジェクトがオートスケーリングでより多くのスロットを使えるようにする"
    b: "ワークロードごとに予約を分け、ETL 用の予約に SLA を満たせるベースライン スロットを設定する"
    c: "ETL 用のプロジェクトを予約の割り当てから外し、オンデマンド料金で実行して予約のスロットと競合しないようにする"
    d: "アドホック分析のクエリはバッチ優先度で実行するようアナリストに依頼し、ETL のクエリを先に実行させる"
  answer: [b]
  choiceNotes:
    a: "1つの予約を共有したままなので、アナリストのクエリが増えると ETL のスロットが不足する問題は残ります。オートスケーリングの上限を上げると費用も増えます。"
    b: "正解です。予約を分けると、ETL 用の予約のベースライン スロットは常に ETL のために確保されます。アイドル スロットの共有は既定で有効なので、ETL が使っていないスロットはアドホック分析用の予約が借り、ETL が必要になると返されます。"
    c: "オンデマンド料金のスロットは共有の容量から割り当てられ、一定の量が保証されるものではありません。費用も処理量に応じて変動し、予測しにくくなります。"
    d: "利用者の運用ルールに頼る方法で、確実ではありません。同じ予約の中では、実行が始まったバッチクエリも ETL とスロットを奪い合います。"
  explanation: |
    重要な処理に必要なリソースを確保するには、**ワークロードごとに予約を分け、予約の割り当て（assignment）でプロジェクトを結び付ける** のが基本です。

    | 予約 | 設定の例 | 目的 |
    | --- | --- | --- |
    | 本番 ETL | SLA に必要なベースライン スロット | 常に必要な容量を確保する |
    | アドホック分析 | 小さいベースライン＋オートスケーリング | 費用を抑えつつピークに対応する |

    **アイドル スロットの共有** は既定で有効です。ある予約で使われていないスロットは、ほかの予約が一時的に借りられます。元の予約が必要になるとスロットは戻されるため、本番の処理には影響しません。共有できるのは、同じ管理プロジェクトにある、同じエディション・同じリージョンの予約の間だけです。

    スロットの使われ方の順番は次のとおりです。
    1. 予約自身のベースライン スロット
    2. ほかの予約のアイドル スロット（共有が有効な場合）
    3. オートスケーリングで追加されるスロット（最大予約サイズまで）

    **データ例**: ETL 用の予約をベースライン 1,000 スロット、アドホック分析用の予約をベースライン 200 スロット・最大予約サイズ 500 スロットにして、アナリストのクエリが 500 スロットを必要とする場合

    | 時間帯 | ETL が使う | アナリストが使う |
    | --- | --- | --- |
    | 6時（ETL 実行中） | 自身の 1,000 | 自身の 200 ＋ オートスケーリング 300 |
    | 10時（ETL 終了後） | 0 | 自身の 200 ＋ ETL のアイドル 300 |

    ETL は、アナリストの需要に関係なく 1,000 スロットを使えます。ETL が使っていない時間帯は、アナリストが ETL のアイドル スロットを借りるため、オートスケーリングの費用もかかりません。
  diagram: |
    flowchart TD
      subgraph ADM["管理プロジェクト"]
        R1["予約: etl<br/>ベースライン スロット"]
        R2["予約: adhoc<br/>オートスケーリング"]
      end
      P1["本番 ETL<br/>プロジェクト"] -->|割り当て| R1
      P2["アドホック分析<br/>プロジェクト"] -->|割り当て| R2
      R1 -.->|アイドル スロットを貸す| R2
  references:
    - title: "予約について"
      url: "https://docs.cloud.google.com/bigquery/docs/reservations-workload-management"
    - title: "ワークロードの割り当てを管理する"
      url: "https://docs.cloud.google.com/bigquery/docs/reservations-assignments"
    - title: "スロットの自動スケーリングの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/slots-autoscaling-intro"

- id: maintain-cost-006
  domain: maintain
  services: [bigquery]
  type: single
  question: |
    あるゲーム会社は、プレイヤーの行動ログを集計する新しい夜間処理のために、BigQuery の容量コミットメントの購入を検討しています。必要なスロット数を見積もるため、性能検証チームは既存の予約と同じ管理プロジェクトに、ベースライン 300 スロットでオートスケーリングなしのテスト用予約 perf-test を作成しました。

    ところが、同じクエリを何度実行しても実行時間が大きくばらつきます。調べると、ほかの予約が使っていない時間帯には、そのアイドル スロットを perf-test のクエリが借りていました。perf-test 自身のスロットだけで処理した場合の実行時間を計測したいと考えています。

    どうすればよいですか？
  choices:
    a: "perf-test 予約の設定で「アイドル スロットを無視する」（ignore_idle_slots）を有効にし、自身のスロットだけを使わせる"
    b: "perf-test 予約の target_job_concurrency を 1 に設定し、同時に実行されるクエリを1つに限定して計測する"
    c: "テスト用プロジェクトの予約の割り当てを外し、オンデマンド料金で同じクエリを実行して実行時間を計測する"
    d: "テストのクエリをバッチ優先度で送信し、ほかの予約がスロットを使っていない時間帯にだけ実行させる"
  answer: [a]
  choiceNotes:
    a: "正解です。予約でアイドル スロットを無視する設定を有効にすると、その予約のクエリはほかの予約のアイドル スロットを借りず、自身のスロット容量だけで実行されます。"
    b: "同時実行数を制限しても、アイドル スロットの借用は止まりません。実行時間のばらつきの原因は残ります。"
    c: "オンデマンド料金では、予約とは別の共有の容量でクエリが実行されます。300 スロットの予約で処理した場合の実行時間は計測できません。"
    d: "バッチ優先度は開始のタイミングを変えるだけで、アイドル スロットの借用は止まりません。むしろ、借りられるスロットが多い時間帯に実行されやすくなります。"
  explanation: |
    BigQuery の予約は、既定で **アイドル スロットの共有** が有効です。ほかの予約で使われていないスロットを借りられるため、通常は容量を無駄なく使えます。

    一方で、借りられるスロットの量はほかの予約の状況で変わるため、次のような場合には **アイドル スロットを無視する**（`ignore_idle_slots`）設定を使います。

    - 購入するスロット数を決めるための性能検証など、予約自身の容量だけで性能を測りたい
    - 他部門の利用状況に左右されない、一定の性能にしたい

    | 設定 | 使えるスロット | 性能のばらつき |
    | --- | --- | --- |
    | アイドル スロットの共有（既定） | 自身のスロット＋ほかの予約のアイドル スロット | 大きい（借りられる量しだい） |
    | アイドル スロットを無視する | 自身のスロット（オートスケーリングを含む） | 小さい |

    なお、Standard エディションの予約はアイドル スロットの共有に対応していません。
  references:
    - title: "ワークロードの予約を管理する"
      url: "https://docs.cloud.google.com/bigquery/docs/reservations-tasks"
    - title: "予約について"
      url: "https://docs.cloud.google.com/bigquery/docs/reservations-workload-management"

- id: maintain-cost-007
  domain: maintain
  services: [dataproc, composer]
  type: single
  question: |
    医療機関向けの分析サービスを提供する企業は、レセプト（診療報酬明細）データを処理する Spark ジョブを、常時稼働の Dataproc クラスタで毎晩実行しています。ジョブは2時間ほどで終わり、それ以外の時間はクラスタが何もしていません。クラスタは初期化アクションで分析用のライブラリをインストールしており、この構成と Spark のコードはそのまま使いたいと考えています。

    次の要件を満たしたいと考えています。
    - クラスタのコンピューティング費用を最小限にする
    - 毎晩の実行は自動で行う
    - 新たに常時稼働するオーケストレーション環境は増やさない

    どうすればよいですか？
  choices:
    a: "既存のクラスタでオートスケーリングを有効にし、ジョブがない時間帯はワーカーを最小台数まで減らす"
    b: "マネージド クラスタを使うワークフロー テンプレートを作成し、Cloud Scheduler から毎晩実行する"
    c: "既存のクラスタにスポット VM のセカンダリ ワーカーを追加し、標準 VM のプライマリ ワーカーの台数を減らす"
    d: "Cloud Composer 環境を新たに作成し、クラスタの作成、ジョブの実行、クラスタの削除を DAG で順に実行する"
  answer: [b]
  choiceNotes:
    a: "オートスケーリングで減らせるのはワーカーだけで、マスターノードと最小台数のワーカーは1日中課金され続けます。2時間しか使わないクラスタには無駄が残ります。"
    b: "正解です。マネージド クラスタを使うワークフロー テンプレートは、テンプレートに含めたクラスタ構成（初期化アクションを含む）で実行のたびにクラスタを作成し、ジョブの終了後に削除します。Cloud Scheduler から定期的に実行すれば、ジョブを処理している間だけ費用がかかります。"
    c: "単価は下がりますが、クラスタは1日中稼働したままです。何もしていない22時間分の費用は残ります。"
    d: "エフェメラル クラスタにはなりますが、Cloud Composer 環境そのものが常時稼働し、費用と運用の手間が増えます。「常時稼働する環境を増やさない」という要件に反します。"
  explanation: |
    1日のうち短い時間しか使わないクラスタは、**ジョブ単位のクラスタ（エフェメラル クラスタ）** にするのが Google の推奨です。データは Cloud Storage に置き、クラスタは処理のときだけ作ります。

    | 方式 | 費用 | 向いているケース |
    | --- | --- | --- |
    | 永続クラスタ | 稼働している間ずっと課金 | 常に処理がある、対話的に使う |
    | エフェメラル クラスタ | ジョブの実行中だけ課金 | 定期バッチ、ジョブごとに構成が違う |

    **ワークフロー テンプレート** のクラスタの指定方法
    - **マネージド クラスタ**：実行時にクラスタを作成し、ジョブの終了後に削除する（クラスタ構成や初期化アクションをテンプレートに含める）
    - **クラスタ セレクタ**：ラベルで既存のクラスタを選んで実行し、終了後も削除しない

    ワークフロー テンプレートは、Cloud Scheduler から HTTP で実行（インスタンス化）できます。複雑な依存関係がなければ、オーケストレーションのための環境は不要です。

    なお、最近のドキュメントでは、Dataproc（Dataproc on Compute Engine）は Managed Service for Apache Spark のクラスタ デプロイという名称になっています。試験ガイドでは Dataproc の名称が使われています。
  diagram: |
    flowchart TD
      S["Cloud Scheduler<br/>毎晩"] -->|インスタンス化| W["ワークフロー テンプレート"]
      W --> C["クラスタを作成<br/>初期化アクション"]
      C --> J["Spark ジョブ"]
      J --> D["クラスタを削除"]
      J <-->|入出力| G["Cloud Storage"]
  references:
    - title: "ワークフロー テンプレートの概要"
      url: "https://docs.cloud.google.com/dataproc/docs/concepts/workflows/overview"
    - title: "Cloud Scheduler を使用したワークフロー"
      url: "https://docs.cloud.google.com/dataproc/docs/tutorials/workflow-scheduler"

- id: maintain-cost-008
  domain: maintain
  services: [dataproc]
  type: single
  question: |
    あるメディア企業では、編集部からの依頼に応じて、視聴ログを分析する PySpark のジョブを週に数回、不定期に実行しています。1回の処理は30分ほどです。データ分析チームは少人数で、クラスタのマシンタイプや台数の設計、Spark のバージョン管理などに時間をかけられません。

    既存の PySpark のコードを使い続けながら、処理を実行している間だけ費用がかかり、運用の手間も最小限になる方法はどれですか？
  choices:
    a: "Serverless for Apache Spark に PySpark のバッチ ワークロードを送信する"
    b: "オートスケーリングを有効にした常時稼働の Dataproc クラスタを用意し、依頼のたびにジョブを送信する"
    c: "マネージド クラスタを使うワークフロー テンプレートを作成し、編集部から依頼があるたびに実行する"
    d: "PySpark の処理を BigQuery の SQL に書き換え、依頼のたびに BigQuery でクエリを実行する"
  answer: [a]
  choiceNotes:
    a: "正解です。Serverless for Apache Spark では、クラスタを作成・管理せずに Spark のバッチ ワークロードを実行でき、リソースは処理に合わせて自動でスケーリングされます。課金はワークロードの実行中だけです。"
    b: "ジョブがない時間もクラスタの費用がかかり、クラスタの設計やバージョン管理も必要です。要件のどちらにも反します。"
    c: "実行中だけ費用はかかりますが、クラスタのマシンタイプや台数などの構成はチームが設計・管理する必要があります。運用の手間を最小限にするという要件に合いません。"
    d: "既存の PySpark のコードを書き換える必要があり、「コードを使い続ける」という要件に反します。"
  explanation: |
    Spark のジョブを実行する方法は、クラスタをだれが管理するかで選びます。

    | 方法 | クラスタの管理 | 課金 | 向いているケース |
    | --- | --- | --- | --- |
    | 永続クラスタ | 利用者 | 稼働中ずっと | 常に処理がある、細かい設定が必要 |
    | エフェメラル クラスタ | 利用者（ジョブごとに作成） | ジョブの実行中 | 定期バッチ、クラスタ構成を指定したい |
    | Serverless for Apache Spark | 不要 | ワークロードの実行中 | 不定期のジョブ、運用の手間を減らしたい |

    **Serverless for Apache Spark** のポイント
    - クラスタを作らずに、バッチ ワークロードを送信するだけで実行できる
    - Spark の動的リソース割り当てによって、エグゼキュータの数が自動でスケーリングされる
    - アイドル時の費用や、クラスタの起動・停止にかかる費用がない

    VM に SSH で接続したい、細かいクラスタ設定が必要などの場合は、クラスタでの実行を選びます。なお、最近のドキュメントでは、Serverless for Apache Spark（旧称 Dataproc Serverless）は Managed Service for Apache Spark のサーバーレス デプロイという名称になっています。
  references:
    - title: "Managed Service for Apache Spark のサーバーレスの概要"
      url: "https://docs.cloud.google.com/managed-spark/docs/overview"
    - title: "サーバーレスとクラスタのデプロイの比較"
      url: "https://docs.cloud.google.com/managed-spark/docs/concepts/compare"

- id: maintain-cost-009
  domain: maintain
  services: [composer, bigquery, cloud-storage]
  type: single
  question: |
    ある小売企業は、Cloud Composer の DAG で、毎日2時に前日分の POS データを Cloud Storage から BigQuery の日付パーティション分割テーブルに読み込んでいます。タスクの中では `datetime.today()` から1日引いて処理対象日を求め、WRITE_APPEND でテーブルに追記しています。

    最近、次の問題が起きています。
    - 読み込みの途中で失敗したタスクが再試行されると、同じ日のデータが重複する
    - 数日前に失敗した実行を後から再実行すると、本来の日ではなく再実行した日の前日のデータが読み込まれる

    DAG の構造を大きく変えずに、何度実行しても同じ結果になるようにしたいと考えています。どうすればよいですか？
  choices:
    a: "処理対象日を論理日付（{{ ds }}）から決め、その日のパーティションを WRITE_TRUNCATE で上書きする"
    b: "タスクの再試行回数を 0 にし、失敗したときは担当者が重複を確認してから手動で再実行する"
    c: "読み込みの後に SELECT DISTINCT で重複行を除くタスクを追加し、毎日テーブル全体を作り直す"
    d: "datetime.today() の代わりに BigQuery の CURRENT_DATE() 関数で前日の日付を求めるように変更する"
  answer: [a]
  choiceNotes:
    a: "正解です。DAG 実行の論理日付は再試行や再実行でも変わらないため、常に同じ日のデータを処理できます。対象のパーティションを上書きすれば、何度実行しても重複しません。"
    b: "重複は防げても、一時的なエラーからの自動回復ができなくなり、手作業が増えます。再実行で日付がずれる問題も解決しません。"
    c: "テーブル全体の作り直しは、データ量に応じて費用と時間がかかります。再実行で日付がずれる問題も残ります。"
    d: "実行した時点の日付から求める点は変わらないため、後から再実行すると対象日がずれます。追記による重複も解決しません。"
  explanation: |
    Airflow のタスクは **べき等**（何度実行しても同じ結果になる）に作るのが基本です。再試行、手動の再実行、バックフィルのどれでも安全に実行できるようになります。

    べき等にするためのポイント
    - **処理対象の期間は、実行時刻ではなく DAG 実行の論理日付（データ区間）から決める**。`{{ ds }}`、`{{ ds_nodash }}`、`{{ data_interval_start }}` などのテンプレート変数を、オペレーターの引数で使う
    - **書き込みは追記ではなく置き換えにする**。対象日のパーティション（`table$YYYYMMDD`）を WRITE_TRUNCATE で上書きする、MERGE を使う、など
    - DAG のコードで `datetime.now()` や `datetime.today()` を使わない

    **データ例**: 6月10日分の POS データ（10万行）を読み込む実行が、10万行を書き込んだ後に失敗して再試行され、さらに6月13日にこの実行を再実行した場合

    | 項目 | 今の DAG | 論理日付＋上書き |
    | --- | --- | --- |
    | 6月11日2時の実行で読む日 | 6月10日 | 6月10日 |
    | 再試行後の6月10日の行数 | 20万行（重複） | 10万行 |
    | 6月13日の再実行で読む日 | 6月12日 | 6月10日 |

    この問題では、読み込み元を `gs://pos-data/{{ ds_nodash }}/`、読み込み先を `sales${{ ds_nodash }}` のように論理日付から組み立てます。再試行しても、数日後に再実行しても、同じ日のパーティションが同じ内容で置き換わるだけになります。

    なお、毎日2時の実行で `{{ ds }}` が前日（データ区間の開始日）になるのは、Cloud Composer 3 の既定のバージョンである Airflow 2 の場合です。Airflow 3 では、cron で書いたスケジュールの既定が `CronTriggerTimetable` に変わり、論理日付が実行の予定時刻（当日）になります。Airflow 3 では、`schedule` に `CronDataIntervalTimetable` を指定するか、`{{ macros.ds_add(ds, -1) }}` のように論理日付から1日引いて処理対象日を求めます。
  references:
    - title: "Airflow DAG を作成する"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/write-dags"
    - title: "DAG のトラブルシューティング"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/troubleshooting-dags"

- id: maintain-cost-010
  domain: maintain
  services: [composer]
  type: multiple
  question: |
    ある保険会社は、保険金請求データを日次で集計する新しい DAG を Cloud Composer にデプロイしました。DAG の start_date は1年前の日付で、catchup が有効になっていました。DAG を有効にした直後に過去1年分の実行が大量に作成され、環境の負荷が急増しました。

    次の要件を満たしたいと考えています。
    - 今後の日次の実行では、最新の期間の分だけを処理する
    - 先月のうちデータを修正した特定の2週間分だけは、改めて処理し直す

    どの対応を組み合わせるべきですか？
  choices:
    a: "DAG の catchup を False に設定し、DAG を有効にしたときに過去の未実行の分が作成されないようにする"
    b: "Airflow のバックフィル機能で、データを修正した2週間の期間を指定して DAG を実行する"
    c: "start_date に datetime.now() を指定し、DAG の実行が常に現在の時刻から始まるようにする"
    d: "max_active_runs を 1 に設定し、過去の分の実行が1つずつ順番に処理されるようにする"
    e: "DAG のスケジュールを None にし、担当者が毎日手動で DAG を実行するように運用を変える"
  answer: [a, b]
  choiceNotes:
    a: "正解です。catchup を無効にすると、DAG を有効にしたときに過去の未実行の期間の分はまとめて作成されず、最新の期間から実行されます。"
    b: "正解です。過去の特定の期間だけを処理し直すには、期間を指定したバックフィルを使います。DAG のタスクがべき等であれば、何度処理し直しても結果は変わりません。"
    c: "start_date を動的に変えると、スケジュールの計算が不安定になり、実行が作成されないなどの問題が起きます。start_date は固定の日付にするのが原則です。"
    d: "同時実行は減りますが、過去1年分の実行はすべて作成されて順番に処理されます。最新の期間だけを処理するという要件に反します。"
    e: "定期実行の自動化をやめることになり、運用の手間が増えます。過去の期間の処理し直しにも対応していません。"
  explanation: |
    **catchup** と **バックフィル** は、過去の期間の実行を扱う2つの仕組みです。

    | 仕組み | 動作 | 使いどころ |
    | --- | --- | --- |
    | catchup | DAG を有効にしたとき、start_date 以降で未実行の期間の分をすべて自動で作成する | 過去の分を漏れなく処理したいとき |
    | バックフィル | 指定した期間の分だけを、必要なときに実行する | データの修正や、新しい DAG での過去分の作成 |

    ポイント
    - 通常の日次処理では `catchup=False` とし、過去の分が必要なときだけバックフィルで実行するのが扱いやすい設計です。
    - catchup の既定値は、Airflow 2 では有効、Airflow 3 では無効です。Airflow の構成（`scheduler.catchup_by_default`）でも変わるため、DAG で明示的に指定します。
    - start_date は固定の日付にします。
    - バックフィルや再実行を安全に行うには、タスクがべき等であることが前提です。
  references:
    - title: "Airflow DAG をスケジュールしてトリガーする"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/schedule-and-trigger-dags"
    - title: "Airflow DAG を作成する"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/write-dags"

- id: maintain-cost-011
  domain: maintain
  services: [composer, cloud-storage]
  type: single
  question: |
    ある通信会社は、Cloud Composer 3 の環境で数十の DAG を運用しています。多くの DAG は、提携先が Cloud Storage に置く CSV ファイルをセンサーで待ってから処理を始めます。ファイルの到着は数時間遅れることもあり、待機中のセンサーがワーカーのスロットを使い続けるため、ほかのタスクがキューで待たされています。ワーカーの自動スケーリングでワーカーが増え、費用も上がっています。

    DAG の構成（センサーでファイルを待つ流れ）は変えずに、待機中のセンサーがワーカーのリソースを使わないようにしたいと考えています。どうすればよいですか？
  choices:
    a: "センサーを遅延可能モード（deferrable=True）にし、待機中の確認をトリガラーに任せる"
    b: "ワーカーの最大数を増やし、待機中のセンサーがあってもほかのタスクを実行できるワーカーを確保する"
    c: "スケジューラの数を増やし、キューに入ったタスクがより早くワーカーに割り当てられるようにする"
    d: "センサーの poke_interval を短くし、ファイルの到着を早く検知してセンサーの待機時間を減らす"
  answer: [a]
  choiceNotes:
    a: "正解です。遅延可能モードのセンサーは、待機に入るとワーカーのスロットを解放し、条件の確認をトリガラーに任せます。条件を満たすとタスクが再開されます。"
    b: "待機中のセンサーがスロットを使い続ける状況は変わらず、ワーカーが増えた分だけ費用が上がります。"
    c: "タスクが待たされているのは、ワーカーのスロットがセンサーで埋まっているためです。スケジューラを増やしても実行できるスロットは増えません。"
    d: "ファイルの到着時刻はセンサーの設定では変わりません。確認の回数が増えて、ワーカーの負荷が上がるだけです。"
  explanation: |
    センサーが条件を待つ方法は3種類あり、ワーカーの使い方が違います。

    | 方法 | 待機中のワーカーのスロット | 特徴 |
    | --- | --- | --- |
    | poke モード（既定） | 使い続ける | 短時間の待機向け |
    | reschedule モード | 確認の合間は解放する | 確認のたびにワーカーで実行される |
    | 遅延可能モード（deferrable） | 解放する | 確認はトリガラーが非同期にまとめて行う |

    **遅延可能なオペレーター**（deferrable operators）を使うには、環境で **トリガラー**（triggerer）が1つ以上（高い復元力の環境では2つ以上）動いている必要があります。トリガラーの数は、環境の構成で変更できます。

    長時間の待機が多い DAG では、遅延可能モードにすると少ないワーカーで多くのタスクを実行でき、ワーカーの自動スケーリングによる費用の増加も抑えられます。
  diagram: |
    flowchart TD
      S["ワーカーで<br/>センサーを開始"] -->|延期| T["トリガラー<br/>ファイルの到着を確認"]
      S -.->|スロットを解放| O["ほかのタスクが<br/>スロットを使う"]
      T -->|ファイルが届いた| R["ワーカーで<br/>センサーを再開"]
  references:
    - title: "Airflow DAG で遅延可能なオペレーターを使用する"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/use-deferrable-operators"
    - title: "環境のスケーリングについて"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/environment-scaling"

- id: maintain-cost-012
  domain: maintain
  services: [composer, cloud-storage, bigquery]
  type: single
  question: |
    ある EC 事業者は、Cloud Composer の DAG で商品カタログを BigQuery に取り込んでいます。1つ目のタスクが商品カタログの API から全件を取得して戻り値として返し、2つ目のタスクが XCom からそのデータを受け取り、変換して BigQuery に読み込みます。

    商品数が増えて取得するデータが数 GB になってから、Airflow のデータベースが急速に大きくなり、スケジューラや Airflow UI の動作が遅くなりました。取得と読み込みは別々のタスクのままにして、失敗した工程だけを再実行できるようにしておきたいと考えています。

    この問題を解決するには、どうすればよいですか？
  choices:
    a: "取得したデータは Cloud Storage に書き込み、XCom ではオブジェクトのパスだけを次のタスクに渡す"
    b: "環境のサイズを大きくして Airflow データベースの性能を上げ、大きな XCom にも耐えられるようにする"
    c: "2つのタスクを1つの PythonOperator にまとめ、取得から読み込みまでを1つのタスクの中で処理する"
    d: "XCom の代わりに Airflow の Variables にデータを保存し、次のタスクでその値を読み出す"
  answer: [a]
  choiceNotes:
    a: "正解です。XCom は Airflow のデータベースに保存されるため、タスク間でやり取りするのはファイルのパスなどの小さな値だけにし、データ本体は Cloud Storage などの外部ストレージに置きます。"
    b: "症状を一時的に和らげるだけで、データが増えれば同じ問題が起きます。費用も上がります。"
    c: "XCom は使わなくなりますが、読み込みだけが失敗したときも API からの取得からやり直すことになり、「失敗した工程だけを再実行できる」という要件に反します。"
    d: "Variables も Airflow のデータベースに保存されるため、データベースの負荷の問題は解決しません。"
  explanation: |
    **XCom** は、タスク間で小さな値（ファイルのパス、件数、ジョブ ID など）を受け渡すための仕組みです。値は Airflow のメタデータ データベースに保存されるため、大きなデータを入れると次の問題が起きます。

    - データベースの容量と負荷が増える
    - スケジューラや Web サーバー（Airflow UI）の動作が遅くなる

    大きなデータは、次のように受け渡します。

    1. 前のタスクがデータを Cloud Storage などに書き込む
    2. XCom ではオブジェクトのパスだけを渡す
    3. 次のタスクはパスを受け取ってデータを読む

    BigQuery への読み込みでは、Cloud Storage のファイルを直接読み込むジョブを使えば、ワーカーのメモリにデータを載せる必要もなくなります。
  diagram: |
    flowchart TD
      A["タスク1<br/>API から取得"] -->|データを書き込む| G["Cloud Storage"]
      A -->|XCom: パスだけ| B["タスク2<br/>変換・読み込み"]
      G -->|データを読む| B
      B --> Q["BigQuery"]
  references:
    - title: "Airflow DAG を作成する"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/write-dags"
    - title: "DAG のトラブルシューティング"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/troubleshooting-dags"

- id: maintain-cost-013
  domain: maintain
  services: [composer]
  type: single
  question: |
    ある製薬会社は、化合物の解析パイプラインを Cloud Composer 3 で自動化しています。パイプラインの途中で、ベンダーが提供する C++ 製の解析ツールを実行する必要があります。このツールは特定の OS ライブラリに依存しており、pip ではインストールできません。

    Airflow の環境の安定性を損なわず、運用の手間も最小限にして、このツールを DAG のタスクとして実行したいと考えています。どうすればよいですか？
  choices:
    a: "ツールと必要なライブラリを含むコンテナ イメージを作成し、KubernetesPodOperator でタスクとして実行する"
    b: "環境の PyPI パッケージの設定にツールを追加し、Airflow のワーカーにインストールしてから実行する"
    c: "PythonVirtualenvOperator を使い、タスクの実行時に仮想環境を作成してツールをインストールする"
    d: "ツールをインストールした Compute Engine の VM を常時稼働させ、SSHOperator でコマンドを実行する"
  answer: [a]
  choiceNotes:
    a: "正解です。KubernetesPodOperator は、指定したコンテナ イメージを Pod として実行します。OS ライブラリを含む依存関係をイメージに閉じ込められ、Airflow の環境には影響しません。"
    b: "PyPI パッケージの設定でインストールできるのは pip で入る Python パッケージだけです。OS ライブラリに依存するツールはインストールできません。"
    c: "仮想環境に入れられるのも pip でインストールできる Python パッケージだけで、OS ライブラリは追加できません。"
    d: "動きますが、VM の常時稼働の費用と、OS の更新などの管理が必要になります。運用の手間を最小限にするという要件に合いません。"
  explanation: |
    Airflow のワーカーに入れられない依存関係があるタスクは、**コンテナ イメージにまとめて Pod として実行します**。

    | オペレーター | Pod を実行する場所 | 主な用途 |
    | --- | --- | --- |
    | KubernetesPodOperator | 環境のクラスタ | pip で入らない依存関係、Airflow と競合するライブラリ |
    | GKEStartPodOperator など GKE のオペレーター | 指定した別の GKE クラスタ | 特別なハードウェアや大きなリソースが必要な処理 |

    Cloud Composer 3 での KubernetesPodOperator のポイント
    - Pod は環境のクラスタ内の専用の名前空間（composer-user-workloads）で実行され、Airflow のコンポーネントとは別にスケーリングされる
    - Pod は環境のサービス アカウントで実行される

    Python パッケージだけで済む場合は、まず環境の PyPI パッケージの設定を使い、ほかの方法でうまくいかないときに Pod での実行を検討します。
  references:
    - title: "KubernetesPodOperator を使用する"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/use-kubernetes-pod-operator"
    - title: "Google Kubernetes Engine オペレーターを使用する"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/use-gke-operator"

- id: maintain-cost-014
  domain: maintain
  services: [composer]
  type: single
  question: |
    あるフィンテック企業は、Cloud Composer 3 の環境でワーカーの最小数を 1、最大数を 3 に設定しています。毎晩0時から1時の間に数百のタスクが一斉に始まり、多くのタスクが長い時間キューで待たされます。この時間帯はワーカーが3台まで増え、CPU 使用率も高くなっています。一方、ほかの時間帯はワーカー1台でほとんどアイドルです。スケジューラの CPU 使用率は低く、DAG の解析にも問題はありません。

    夜間のタスクの待ちを解消しつつ、ほかの時間帯の費用は抑えたいと考えています。どうすればよいですか？
  choices:
    a: "ワーカーの最大数を引き上げ、最小数は 1 のままにして自動スケーリングに任せる"
    b: "ワーカーの最小数を夜間のピークに必要な台数まで引き上げ、1日を通してその台数を稼働させる"
    c: "スケジューラの数を増やし、キューに入ったタスクがより早くワーカーに割り当てられるようにする"
    d: "環境のサイズを大きくし、Airflow データベースなどの管理コンポーネントの性能を上げる"
  answer: [a]
  choiceNotes:
    a: "正解です。ワーカーはキューのタスク数に応じて最小数と最大数の間で自動でスケーリングされます。最大数を上げればピーク時だけ増え、ほかの時間帯は最小数に戻ります。"
    b: "夜間の待ちは解消できますが、アイドルの時間帯にもピーク分のワーカーの費用がかかります。"
    c: "スケジューラには余裕があり、ボトルネックはタスクを実行するワーカーの不足です。スケジューラの数は自動ではスケーリングされず、増やしても待ちは解消しません。"
    d: "環境のサイズは Airflow データベースなどの管理インフラの性能を決める設定で、タスクを実行するワーカーの数は増えません。"
  explanation: |
    Cloud Composer の環境は、コンポーネントごとにスケーリングの方法が違います。

    | コンポーネント | スケーリング | 見直すタイミング |
    | --- | --- | --- |
    | ワーカー | 最小数〜最大数の間で自動 | タスクがキューで待たされる |
    | スケジューラ | 手動で台数を設定 | DAG の解析やスケジューリングが遅い |
    | トリガラー | 手動で台数を設定 | 遅延可能なオペレーターを使う |
    | 環境のサイズ | 手動 | Airflow データベースの負荷が高い |

    ワーカーの自動スケーリングは、キューで待っているタスクの数と、ワーカーの同時実行数（`celery.worker_concurrency`）をもとに必要なワーカー数を決めます。**最小数はアイドル時の費用、最大数はピーク時の処理能力** を決めると考えると設定しやすくなります。

    **データ例**: 夜間のピークにワーカーが6台必要な場合の、1日に稼働するワーカー

    | 設定 | 0〜1時 | ほかの23時間 | 1日の合計 |
    | --- | --- | --- | --- |
    | 最小1・最大6 | 6台 | 1台 | 29台・時間 |
    | 最小6・最大6 | 6台 | 6台 | 144台・時間 |

    ピーク時の処理能力は同じでも、最小数を上げると稼働するワーカーの量は約5倍になります。実際には台数の増減に時間がかかるため、合計は目安です。

    なお、Cloud Composer は2026年4月に Managed Service for Apache Airflow へ名称が変わりました（Cloud Composer 3 は Managed Airflow (Gen 3)）。試験ガイドでは Cloud Composer の名称が使われています。
  references:
    - title: "環境のスケーリングについて"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/environment-scaling"
    - title: "環境のパフォーマンスと費用を最適化する"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/optimize-environments"

- id: maintain-cost-015
  domain: maintain
  services: [composer, bigquery]
  type: multiple
  question: |
    ある旅行予約サイトは、Cloud Composer の DAG で提携先のデータを集計しています。DAG では、ホテル・航空券・レンタカーの3つの提携先 API からデータを取得するタスクが並列に動き、その後に BigQuery で集計するタスク、最後に作業用の一時テーブルを削除するタスクが続きます。

    次の要件を満たしたいと考えています。
    - 提携先 API のタイムアウトなど一時的なエラーは、人手を介さずに回復させる
    - 集計は、3つの取得タスクがすべて成功したときだけ実行する
    - 一時テーブルの削除は、集計が成功しても失敗しても必ず実行する

    どの設定を組み合わせるべきですか？
  choices:
    a: "取得タスクに retries と retry_delay を設定し、一時的なエラーのときは間隔を空けて自動で再試行させる"
    b: "一時テーブルを削除するタスクの trigger_rule を all_done にし、上流の結果にかかわらず実行させる"
    c: "集計タスクの trigger_rule を one_success にし、取得タスクのどれかが成功したら集計を始めさせる"
    d: "取得タスクの再試行回数を 0 にし、失敗したときはすぐに担当者へメールで通知して対応させる"
    e: "一時テーブルを削除するタスクに depends_on_past=True を設定し、前回の実行結果に応じて実行させる"
  answer: [a, b]
  choiceNotes:
    a: "正解です。retries で再試行の回数を、retry_delay で再試行までの間隔を指定できます。一時的なエラーなら、再試行で自動的に回復します。"
    b: "正解です。all_done は、上流のタスクが成功・失敗にかかわらずすべて終わった時点でタスクを実行します。後片付けのタスクに向いています。"
    c: "一部の取得タスクだけが成功した状態でも集計が始まり、「すべて成功したときだけ」という要件に反します。既定の all_success のままにします。"
    d: "一時的なエラーのたびに人手の対応が必要になり、「人手を介さずに回復させる」という要件に反します。"
    e: "depends_on_past は、前回の実行で同じタスクが成功していることを実行の条件にする設定です。今回の集計の結果にかかわらず実行するという要件とは関係がありません。"
  explanation: |
    Airflow の DAG では、失敗への備えをタスクごとの設定で表します。

    **再試行**
    - `retries`：再試行の回数
    - `retry_delay`：再試行までの間隔
    - `retry_exponential_backoff`：再試行のたびに間隔を延ばす

    再試行を安全に使うには、タスクがべき等である必要があります。

    **トリガールール**（`trigger_rule`）：上流のタスクの状態に応じて、タスクを実行するかを決めます。

    | ルール | 実行される条件 | 主な用途 |
    | --- | --- | --- |
    | all_success（既定） | 上流がすべて成功 | 通常の処理 |
    | all_done | 上流がすべて終了（成否は問わない） | 後片付け、一時リソースの削除 |
    | one_failed | 上流のどれかが失敗 | 失敗時の通知 |
    | one_success | 上流のどれかが成功 | 一部の結果だけで進めてよい処理 |
  diagram: |
    flowchart TD
      H["取得: ホテル<br/>retries"] --> A["BigQuery で集計<br/>all_success"]
      F["取得: 航空券<br/>retries"] --> A
      R["取得: レンタカー<br/>retries"] --> A
      A --> C["一時テーブルを削除<br/>all_done"]
  references:
    - title: "Airflow DAG を作成する"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/write-dags"
    - title: "DAG のトラブルシューティング"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/troubleshooting-dags"

- id: maintain-cost-016
  domain: maintain
  services: [bigquery, composer]
  type: single
  question: |
    あるオンライン学習サービスの企業は、BigQuery に蓄積した受講ログを、毎朝6時に前日分だけ集計してレポート用のテーブルに書き込みたいと考えています。処理は1本の SQL で完結し、ほかの処理との依存関係はありません。データチームは2人で、新しい基盤を運用する余裕はありません。

    運用の手間と費用を最小限に抑えて、この処理を毎日自動で実行するにはどうすればよいですか？
  choices:
    a: "BigQuery のスケジュールされたクエリを作成し、@run_date パラメータで前日分を集計して宛先テーブルに書き込む"
    b: "Cloud Composer 環境を作成し、BigQueryInsertJobOperator で SQL を実行する DAG を毎朝6時に動かす"
    c: "Cloud Scheduler から Cloud Run functions を呼び出し、関数の中で BigQuery API を使って SQL を実行する"
    d: "Compute Engine の VM に cron を設定し、bq コマンドで毎朝6時に SQL を実行するスクリプトを動かす"
  answer: [a]
  choiceNotes:
    a: "正解です。スケジュールされたクエリは BigQuery の機能だけで SQL を定期実行でき、追加の基盤は不要です。@run_date や @run_time のパラメータで、実行ごとの対象日を指定できます。"
    b: "実行はできますが、1本の SQL のために Cloud Composer 環境を常時稼働させることになり、費用と運用の手間が大きすぎます。"
    c: "関数のコードとデプロイ、エラー処理を自分たちで管理する必要があります。BigQuery の機能だけで済む処理に対して手間が増えます。"
    d: "VM の常時稼働の費用と、OS の更新や障害時の対応が必要になります。運用の手間を最小限にするという要件に反します。"
  explanation: |
    繰り返し実行する処理は、**処理の複雑さに見合った最も簡単な方法** でスケジュールします。

    | 方法 | 向いている処理 |
    | --- | --- |
    | BigQuery のスケジュールされたクエリ | BigQuery の SQL 1本で完結する定期処理 |
    | Dataform のワークフロー構成 | 依存関係のある複数の SQL 変換を定期実行する |
    | Cloud Scheduler | HTTP や Pub/Sub で起動できる単発の処理を定期実行する |
    | Cloud Composer | 複数のサービスにまたがる依存関係、再試行、バックフィルが必要なワークフロー |

    **スケジュールされたクエリ** のポイント
    - BigQuery Data Transfer Service の仕組みで動く
    - `@run_time`（TIMESTAMP）と `@run_date`（DATE）のパラメータで、実行ごとの対象期間を指定できる。どちらも実際の開始時刻ではなく、スケジュール上の実行時刻を表す
    - `@run_time` は UTC で表され、`@run_date` はその UTC の日付になる。日本時間の6時（UTC では前日の21時）の実行では `@run_date` が前日の日付になるため、日本時間の日付で区切る場合は `DATE(@run_time, 'Asia/Tokyo')` のように日本時間に変換してから計算する
    - 宛先テーブルへの追記・上書きを選べる

    日本時間の前日（0時〜24時）の受講ログを集計する例です。`event_time` も日本時間の日付に変換して比べます。

    ```sql
    SELECT course_id, COUNT(*) AS views
    FROM learning.logs
    WHERE DATE(event_time, 'Asia/Tokyo')
      = DATE_SUB(DATE(@run_time, 'Asia/Tokyo'), INTERVAL 1 DAY)
    GROUP BY course_id
    ```
  references:
    - title: "クエリのスケジューリング"
      url: "https://docs.cloud.google.com/bigquery/docs/scheduling-queries"

- id: maintain-cost-017
  domain: maintain
  services: [bigtable]
  type: single
  question: |
    ある天気予報アプリの運営企業は、地点ごとの観測値と予報の時系列データを Bigtable のクラスタ（SSD）に保存し、アプリの画面表示に使っています。読み取りは朝の通勤時間帯と夕方に集中し、深夜はほとんどありません。また、台風や大雨のときには、予測できないタイミングで読み取りが普段の数倍に増えます。

    現在は、最も負荷が高いときに合わせた固定のノード数で運用しており、深夜にも同じ費用がかかっています。画面表示のレイテンシを保ちながらノードの費用を下げ、運用の手間も最小限にしたいと考えています。

    どうすればよいですか？
  choices:
    a: "クラスタのオートスケーリングを有効にし、最小ノード数、最大ノード数、CPU 使用率の目標を設定する"
    b: "Cloud Scheduler から Cloud Run functions を呼び出し、朝と夕方の前にノード数を増やし、深夜に減らす"
    c: "ストレージ タイプが HDD のインスタンスを作成してデータを移し、保存の費用を下げる"
    d: "別のリージョンにクラスタを追加し、マルチクラスタ ルーティングで読み取りを2つのクラスタに分散する"
  answer: [a]
  choiceNotes:
    a: "正解です。オートスケーリングでは、CPU 使用率とストレージの使用率に応じて、指定した範囲でノード数が自動で増減します。深夜は負荷に合わせてノード数が減り、台風のときのような予測できない負荷の増加にも追従します。"
    b: "時間帯による増減はできますが、台風や大雨のときのような予測できない負荷の増加には対応できません。関数とスケジュールの作成・保守も必要になります。"
    c: "HDD で下がるのは保存の費用で、ノードの費用は下がりません。1行単位の読み取りが遅くなるため、画面表示のレイテンシも保てません。"
    d: "クラスタを追加すると、そのノードの費用が増えます。深夜に使われないノードの費用も、2つのクラスタでかかり続けます。"
  explanation: |
    Bigtable のクラスタのノード数は、**手動の割り当て** か **オートスケーリング** で管理します。

    | 方法 | ノード数の決まり方 | 向いている負荷 |
    | --- | --- | --- |
    | 手動の割り当て | 指定した数で固定する | 一定で、予測しやすい負荷 |
    | オートスケーリング | 最小・最大の範囲で、CPU 使用率とストレージの使用率に応じて自動で増減する | 時間帯で変わる負荷、予測できない急増 |

    オートスケーリングのポイント

    - 設定するのは、最小ノード数、最大ノード数、CPU 使用率の目標です。保存しているデータ量に必要なノード数も考慮されます。
    - 設定はクラスタごとに行うため、レプリケーションしているインスタンスでは、それぞれのクラスタに設定します。
    - ノードを追加してから性能に反映されるまでには時間がかかります。大きなイベントのように事前にわかっている急増には、前もって最小ノード数を引き上げておきます。
    - 最大ノード数に達すると、それ以上はノードが増えません。Cloud Monitoring で CPU 使用率やレイテンシを監視し、最大ノード数が足りているかを確認します。
  references:
    - title: "オートスケーリング"
      url: "https://docs.cloud.google.com/bigtable/docs/autoscaling"
    - title: "インスタンス、クラスタ、ノード"
      url: "https://docs.cloud.google.com/bigtable/docs/instances-clusters-nodes"

- id: maintain-cost-018
  domain: maintain
  services: [bigquery, bigquery-ml, kms]
  type: single
  question: |
    ある銀行は、BigQuery の料金をオンデマンドから容量ベースに切り替えることにしました。要件は次のとおりです。
    - 信用リスクの予測モデルを BigQuery ML で作成する
    - セキュリティ ポリシーにより、データは Cloud KMS で管理する顧客管理の暗号鍵（CMEK）で暗号化する
    - 費用を予測しやすくするため、1年の容量コミットメントを購入する
    - リージョン障害への備えは別の方法で行うため、BigQuery のマネージド障害復旧は使わない

    要件を満たし、費用を最小限に抑えられる構成はどれですか？
  choices:
    a: "Standard エディションの予約を作成し、1年の容量コミットメントを購入して割り当てる"
    b: "Enterprise エディションの予約を作成し、1年の容量コミットメントを購入して割り当てる"
    c: "Enterprise Plus エディションの予約を作成し、1年の容量コミットメントを購入して割り当てる"
    d: "定額料金（flat-rate）の年間プランを購入し、すべてのプロジェクトをその予約に割り当てる"
  answer: [b]
  choiceNotes:
    a: "Standard エディションでは BigQuery ML と CMEK を使えず、容量コミットメントも購入できません。"
    b: "正解です。Enterprise エディションは BigQuery ML と CMEK に対応し、1年・3年の容量コミットメントも購入できます。要件を満たすエディションのうち最も安価です。"
    c: "要件は満たしますが、Enterprise エディションより単価が高くなります。マネージド障害復旧などの Enterprise Plus 固有の機能が不要なら、費用を最小限にするという要件に反します。"
    d: "定額料金は新規の購入が終了しており、現在はエディションによる容量ベースの料金に置き換わっています。"
  explanation: |
    BigQuery エディションは、必要な機能とスロットの使い方で選びます。

    | 項目 | Standard | Enterprise | Enterprise Plus |
    | --- | --- | --- | --- |
    | 容量コミットメント（1年・3年） | なし | あり | あり |
    | オートスケーリング | あり | あり | あり |
    | アイドル スロットの共有 | なし | あり | あり |
    | BigQuery ML | なし | あり | あり |
    | CMEK | なし | あり | あり |
    | マネージド障害復旧 | なし | なし | あり |
    | Assured Workloads によるコンプライアンス管理 | なし | なし | あり |

    選び方の目安
    - **Standard**：開発・テストや小規模なアドホック分析など、基本的な SQL の機能で足りるワークロード。1つの予約のスロット数にも上限がある
    - **Enterprise**：多くの本番ワークロード。ML、セキュリティ機能、コミットメント割引が必要な場合
    - **Enterprise Plus**：マネージド障害復旧や厳しい規制への対応が必要な、ミッションクリティカルなワークロード

    エディションは予約ごとに選べるため、部門やワークロードごとに異なるエディションを使い分けることもできます。
  references:
    - title: "BigQuery エディションについて"
      url: "https://docs.cloud.google.com/bigquery/docs/editions-intro"
    - title: "顧客管理の Cloud KMS 鍵"
      url: "https://docs.cloud.google.com/bigquery/docs/customer-managed-encryption"

- id: maintain-cost-019
  domain: maintain
  services: [bigquery]
  type: single
  question: |
    ある電力会社は、以前は BigQuery の定額料金で年間 1,000 スロットを契約し、月末の決算処理の3日間だけ Flex スロットを 500 追加購入していました。現在は Enterprise エディションに移行しており、新しい構成を検討しています。

    要件は次のとおりです。
    - 日常的に必要な 1,000 スロットは、割引された予測しやすい費用で確保する
    - 月末のピークには、手作業での購入なしに容量が自動で増える
    - 月末以外の時間帯に、使わない容量の費用は払わない

    どの構成にすべきですか？
  choices:
    a: "1,000 スロットの1年の容量コミットメントを購入してベースラインにし、最大予約サイズを 1,500 スロットにする"
    b: "1,500 スロットの1年の容量コミットメントを購入し、すべてを予約のベースライン スロットにする"
    c: "1,000 スロットをベースラインにし、月末の3日間だけ Flex スロットを 500 購入して予約に追加する"
    d: "コミットメントは購入せず、ベースラインを 0 にして最大予約サイズ 1,500 スロットのオートスケーリングだけで運用する"
  answer: [a]
  choiceNotes:
    a: "正解です。コミットメントでベースラインの 1,000 スロットを割引単価で確保し、残りの 500 スロットは月末のピーク時だけオートスケーリングで追加されます。追加分は使っている間だけ課金されます。"
    b: "月末以外も 500 スロット分の費用を払い続けることになり、「使わない容量の費用は払わない」という要件に反します。"
    c: "Flex スロットは提供が終了しています。現在は、一時的な容量の追加にオートスケーリングを使います。"
    d: "常に必要な 1,000 スロットにもコミットメントの割引が適用されず、従量課金の単価になります。「割引された予測しやすい費用」という要件に反します。"
  explanation: |
    旧来の料金モデルは、エディションでは次のように置き換えます。

    | 旧来のモデル | エディションでの置き換え |
    | --- | --- |
    | 定額料金（flat-rate）の月間・年間契約 | 容量コミットメント（1年・3年）＋ベースライン スロット |
    | Flex スロット（短期の追加購入） | オートスケーリング（最大予約サイズまで自動で追加） |

    設計の考え方
    - **常に使う量** はコミットメントで購入し、ベースライン スロットにする（割引単価、費用が予測しやすい）
    - **変動する量** は最大予約サイズとの差としてオートスケーリングに任せる（使った分だけの従量課金）
    - ベースラインを大きくしすぎると無駄が出て、小さくしすぎるとオートスケーリングの割合が増えて単価が上がる

    **データ例**: 30日（720時間）の月に、常に 1,000 スロットを使い、月末の3日間（72時間）だけ 1,500 スロットを使う場合の、1か月のスロット時間

    | 構成 | コミットメント（割引単価） | 従量課金 |
    | --- | --- | --- |
    | ベースライン 1,000、最大 1,500 | 720,000 | 36,000 |
    | ベースライン 1,500 | 1,080,000 | 0 |
    | ベースライン 0、最大 1,500 | 0 | 756,000 |

    ベースライン 1,500 では、月末以外に使わない 500 スロット分（500 × 648時間 = 324,000 スロット時間）も払います。ベースライン 0 では、常に使う 1,000 スロット分もすべて従量課金の単価になります。
  diagram: |
    flowchart TD
      C["容量コミットメント<br/>1年・1,000 スロット"] --> B["ベースライン<br/>1,000 スロット"]
      B --> R["予約<br/>Enterprise エディション"]
      A["オートスケーリング<br/>最大 500 スロット"] -->|月末のピークだけ| R
      R --> P["分析プロジェクト"]
  references:
    - title: "BigQuery エディションについて"
      url: "https://docs.cloud.google.com/bigquery/docs/editions-intro"
    - title: "スロットの自動スケーリングの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/slots-autoscaling-intro"
    - title: "従来の予約の概要"
      url: "https://docs.cloud.google.com/bigquery/docs/reservations-intro-legacy"

- id: maintain-cost-020
  domain: maintain
  services: [bigquery]
  type: single
  question: |
    ある自動車メーカーの車両試験データ分析チームは、ベースライン 800 スロットでオートスケーリングなしの BigQuery の予約を使っています。予算の都合で、スロットは増やせません。

    チームのクエリは複雑なシミュレーション結果の集計が中心で、20件以上が同時に送信されることがよくあります。そのたびに1件あたりのスロットが少なくなり、すべてのクエリが遅くなって、数時間かかるものも出ています。チームは、同時に実行するクエリを減らして1件ずつに多くのスロットを使わせ、残りはキューで待たせたほうがよいと考えています。

    どうすればよいですか？
  choices:
    a: "予約の target_job_concurrency を、動的な既定値から小さい固定値に変える"
    b: "予約の最大予約サイズを引き上げてオートスケーリングを有効にし、同時実行時に使えるスロットを増やす"
    c: "予約で「アイドル スロットを無視する」設定を有効にし、ほかの予約とのスロットの共有をやめる"
    d: "クエリをバッチ優先度で送信し、ほかの予約のスロットに空きがある時間帯にまとめて実行させる"
  answer: [a]
  choiceNotes:
    a: "正解です。target_job_concurrency は予約で同時に実行するクエリ数の上限で、上限を超えたクエリはキューで待ちます。小さくすると1件あたりに割り当てられるスロットが増え、複雑なクエリの性能が安定します。"
    b: "スロットを増やすことになり、予算の制約に反します。"
    c: "ほかの予約のアイドル スロットを借りられなくなるだけで、使えるスロットが減ります。同時実行の問題は解決しません。"
    d: "バッチ優先度はクエリの開始を遅らせるだけで、開始されたクエリの同時実行数は制御できません。"
  explanation: |
    BigQuery の **クエリキュー** は、予約やプロジェクトで同時に実行するクエリの数を管理し、上限を超えたクエリを失敗させずにキューで待たせます。

    - 既定では **動的な同時実行** で、使えるスロットに応じて BigQuery が同時実行数を決める
    - 予約の `target_job_concurrency` で同時実行数の上限を指定できる（`CREATE RESERVATION` / `ALTER RESERVATION` の DDL、`bq` コマンド、コンソールで設定）

    | target_job_concurrency | 効果 |
    | --- | --- |
    | 小さくする | 1件あたりのスロットが増え、複雑なクエリの性能が安定する。待つクエリは増える |
    | 大きくする | 同時に実行できる数が増えるが、スロットを増やさなければ1件あたりのスロットは減る |

    **データ例**: 800 スロットを、実行中のクエリで均等に分けるとした場合

    | 同時に実行するクエリ | 1件あたりのスロット | キューで待つクエリ |
    | --- | --- | --- |
    | 20件（今の状態） | 約40 | 0件 |
    | 5件（上限を 5 に設定） | 約160 | 15件 |

    スロットの合計は同じでも、1件あたりのスロットは4倍になります。待っているクエリは、実行中のクエリが終わると開始されます。

    ```sql
    ALTER RESERVATION `admin-project.region-us.vehicle-test`
    SET OPTIONS (target_job_concurrency = 5);
    ```
  references:
    - title: "クエリキューを使用する"
      url: "https://docs.cloud.google.com/bigquery/docs/query-queues"

- id: maintain-cost-021
  domain: maintain
  services: [bigquery]
  type: single
  question: |
    ある出版社では、編集者が BI ツールから BigQuery にアドホックなクエリを実行しています。同じ予約で、月末には販売レポートを作るスクリプトが約300件のクエリを一度に送信します。月末になると、編集者のクエリがなかなか始まらず、作業に支障が出ています。販売レポートは数時間遅れても問題ありません。

    既存の予約やスロット数、料金モデルは変えずに、スクリプトの変更だけで編集者のクエリを優先させたいと考えています。どうすればよいですか？
  choices:
    a: "レポート作成のスクリプトが送るクエリをバッチ優先度に変更し、編集者のインタラクティブ クエリを優先させる"
    b: "レポート作成のスクリプトが送るクエリに最大課金バイト数を設定し、1件あたりの処理量を制限する"
    c: "予約の target_job_concurrency を大きな値に設定し、同時に実行できるクエリの数を増やす"
    d: "編集者のプロジェクトを予約の割り当てから外し、オンデマンド料金でクエリを実行させる"
  answer: [a]
  choiceNotes:
    a: "正解です。バッチ優先度のクエリはキューに入り、空いているリソースがあるときに開始されます。実行中のバッチクエリが一定数に達すると、後から送信されたインタラクティブ クエリが優先して開始されます。"
    b: "最大課金バイト数は処理量の上限を超えるクエリを失敗させる設定で、実行の順番は変わりません。レポートのクエリが失敗するおそれもあります。"
    c: "予約の設定を変えることになり、要件に反します。スロットを増やさずに同時実行数だけを増やしても、1件あたりのスロットが減るだけです。"
    d: "料金モデルを変えることになり、要件に反します。"
  explanation: |
    BigQuery のクエリには2つの優先度があります。

    | 優先度 | 動作 | 向いている処理 |
    | --- | --- | --- |
    | インタラクティブ（既定） | できるだけすぐに実行を始める | 人が結果を待つアドホック分析、ダッシュボード |
    | バッチ | キューに入り、空いているリソースがあるときに開始する | 急ぎではない定期レポート、大量のクエリの一括実行 |

    ポイント
    - 実行中のバッチクエリの数が上限（BigQuery が動的に決める）に達すると、後から送信されたインタラクティブ クエリが優先して開始される
    - 優先度は **開始の順番** を変えるもので、オンデマンド料金の単価は変わらない
    - 実行を始めたバッチクエリは、インタラクティブ クエリと同じようにスロットを使う
    - キューで待てる時間には上限があり、既定ではバッチクエリのほうが長い
  references:
    - title: "クエリを実行する"
      url: "https://docs.cloud.google.com/bigquery/docs/running-queries"
    - title: "クエリキューを使用する"
      url: "https://docs.cloud.google.com/bigquery/docs/query-queues"
