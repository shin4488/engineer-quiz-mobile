- id: analyze-ml-016
  domain: analyze
  services: [bigquery-ml, bigquery, cloud-storage, vertex-ai]
  type: single
  question: |
    ある新聞社は、過去の報道写真約200万枚を Cloud Storage に保存しており、BigQuery でこれらの画像を参照するオブジェクト テーブルを作成済みです。記者が「雨の中を傘をさして歩く通勤客」のような自由な文章で、内容の近い写真を探せるようにしたいと考えています。写真に手作業でタグを付ける余裕はなく、言い回しが異なっても意味の近い写真を見つけられることが求められています。

    BigQuery の中で実現するには、どうすればよいですか？
  choices:
    a: "マルチモーダル エンベディング モデルのリモートモデルで、画像と検索文の両方のエンベディングを生成し、VECTOR_SEARCH で近い画像を探す"
    b: "Gemini のリモートモデルで各画像の説明文を生成して保存し、検索文に含まれる単語を LIKE 演算子で部分一致検索する"
    c: "テキスト エンベディング モデルのリモートモデルで、画像のファイル名と URI のエンベディングを生成し、VECTOR_SEARCH で検索文と比較する"
    d: "画像は画像用のモデル、検索文はテキスト用の別のモデルでそれぞれエンベディングを生成し、VECTOR_SEARCH で距離を比較する"
  answer: [a]
  choiceNotes:
    a: "正解です。マルチモーダル エンベディング モデルは、画像とテキストを同じベクトル空間に変換します。オブジェクト テーブルを ML.GENERATE_EMBEDDING に渡して画像のエンベディングを作り、同じモデルで変換した検索文と VECTOR_SEARCH で比較すれば、意味の近い写真を探せます。"
    b: "説明文の生成はできますが、LIKE による部分一致では、言い回しが異なる検索文に対応できません。意味の近さで探すという要件を満たしません。"
    c: "ファイル名や URI には写真の内容がほとんど含まれないため、内容の近い写真は探せません。"
    d: "異なるモデルで作ったエンベディングは別々のベクトル空間にあるため、距離を比較しても意味の近さを表しません。"
  explanation: |
    画像やテキストなどの **非構造化データ** を意味の近さで検索するには、エンベディング（ベクトル）を使います。

    1. Cloud Storage の画像を参照する **オブジェクト テーブル** を用意する
    2. マルチモーダル エンベディング モデルを指すリモートモデルを作成する
    3. `ML.GENERATE_EMBEDDING` にオブジェクト テーブルを渡し、画像のエンベディングをテーブルに保存する
    4. 検索文を同じモデルでエンベディングにし、`VECTOR_SEARCH` で距離の近い画像を探す
    5. データ量が多い場合は、エンベディングの列に **ベクトル インデックス** を作成して検索を高速化する

    - マルチモーダル エンベディングは、テキスト・画像・動画を **同じ意味空間** に変換するため、文章で画像を検索できる
    - VECTOR_SEARCH はインデックスがなくても動作するが、インデックスがあると多くの場合で性能が上がる
    - ベクトル インデックスの種類には、k-means でベクトルをクラスタに分ける **IVF** と、ScaNN に基づき、多数の検索をまとめて実行するバッチ処理に向いた **TREE_AH** がある
    - 新しいクエリでは、ML.GENERATE_EMBEDDING と同じ機能で出力列の名前が簡潔になった `AI.GENERATE_EMBEDDING` の利用が推奨されている
  diagram: |
    flowchart TD
      P["オブジェクト テーブル<br/>報道写真約200万枚"] --> M["同じマルチモーダル<br/>エンベディング モデル"]
      Q["記者の検索文"] --> M
      M -->|画像のベクトル| T["エンベディングの<br/>テーブル"]
      M -->|検索文のベクトル| S["VECTOR_SEARCH"]
      T --> S
      S -->|距離の近い順| R["内容の近い写真"]
  references:
    - title: "Generate and search multimodal embeddings"
      url: "https://docs.cloud.google.com/bigquery/docs/generate-multimodal-embeddings"
    - title: "Manage vector indexes"
      url: "https://docs.cloud.google.com/bigquery/docs/vector-index"

- id: analyze-ml-017
  domain: analyze
  services: [bigquery-ml, bigquery, vertex-ai]
  type: multiple
  question: |
    ある SaaS 企業は、製品マニュアルや FAQ など約5万件の文書の本文を、BigQuery のテーブル（列は doc_id、updated_at、body）に保存しています。社内のサポート担当者向けに、質問に関連する記述を VECTOR_SEARCH で探して Gemini に回答を生成させる、RAG（検索拡張生成）の仕組みを作っています。現在、次の問題があります。

    - 文書全体を1つのエンベディングにしているため、長い文書では関連する手順の記述をうまく検索できず、エンベディング モデルの入力の上限を超える文書もある
    - 変更があるのは毎日全体の1%程度の文書だけなのに、毎晩すべての文書のエンベディングを生成し直しており、コストがかかるうえ、割り当て（クォータ）のエラーも起きている

    回答の根拠となる具体的な手順の記述を取り出せるようにしたうえで、これらの問題を解決するには、どの対応を組み合わせるべきですか？
  choices:
    a: "文書を前後が少し重なるように適切な長さのチャンクに分割し、doc_id とチャンク番号とともに保存して、チャンクごとにエンベディングを生成する"
    b: "updated_at をもとに追加・変更された文書だけを選び、その文書の古いチャンクを削除して、新しいチャンクのエンベディングだけを生成する"
    c: "エンベディング モデルの入力の上限を超えないように、各文書の先頭部分だけを切り出してからエンベディングを生成する"
    d: "Gemini で各文書の短い要約を生成してテーブルに保存し、要約文のエンベディングだけを生成して検索に使う"
    e: "VECTOR_SEARCH の top_k を大きくして、より多くの文書の全文を検索結果として Gemini のプロンプトに含める"
  answer: [a, b]
  choiceNotes:
    a: "正解です。チャンクに分割すると、質問に関連する箇所だけを検索で取り出せ、エンベディング モデルの入力の上限にも収まります。チャンクを少し重ねると、区切りの位置で文脈が途切れる影響を減らせます。"
    b: "正解です。変更のあった文書だけのエンベディングを生成し直す増分処理にすると、生成のコストとモデルへのリクエスト数を大きく減らせ、割り当てのエラーも起きにくくなります。"
    c: "先頭以外に書かれた手順が検索の対象から外れ、回答の根拠となる記述を取り出せなくなります。"
    d: "要約では具体的な手順の記述が失われるため、要件を満たしません。すべての文書の要約を生成するコストもかかります。"
    e: "検索の単位が文書全体のままなので関連する箇所を絞り込めず、プロンプトが長くなって生成のコストも増えます。エンベディングの再生成の問題も解決しません。"
  explanation: |
    RAG の検索精度とコストは、**データの準備** で大きく変わります。

    | 準備の作業 | ポイント |
    | --- | --- |
    | チャンク分割 | 見出しや段落などの意味のまとまりを目安に分け、前後を少し重ねる。元の文書の ID とチャンク番号を保持する |
    | エンベディングの生成 | チャンクごとに生成する。質問文も同じモデルでエンベディングにする |
    | 増分更新 | 追加・変更された文書のチャンクだけを作り直す。削除された文書のチャンクも消す |
    | 検索 | VECTOR_SEARCH で質問に近いチャンクを探す。データ量が多ければベクトル インデックスで高速化する |
    | 生成 | 取り出したチャンクをプロンプトに含めて Gemini に回答させる |

    **データ例**: 5つの段落（P1〜P5）からなるマニュアル D100 を、3段落ずつ、1段落を重ねて分けた場合

    | doc_id | チャンク番号 | 含まれる段落 |
    | --- | --- | --- |
    | D100 | 1 | P1、P2、P3 |
    | D100 | 2 | P3、P4、P5 |

    P3 は両方のチャンクに入るため、P2 から続く手順も、P4 に続く手順も、1つのチャンクの中で前後の文脈と一緒に検索できます。また、1文書あたり平均10チャンクとすると、毎晩生成するエンベディングは、全文書の50万件から、変更のあった1%（500文書）の5,000件に減ります。

    エンベディングの列を自動で最新に保ちたい場合は、2026年に一般提供（GA）となった **autonomous embedding generation** も使えます。`AI.EMBED` 関数を使う生成列を定義すると、ソースの列にデータが追加・変更されるたびに、BigQuery がエンベディングを自動で生成・更新します。
  diagram: |
    flowchart TD
      D["文書テーブル<br/>doc_id, updated_at, body"] -->|追加・変更分だけ| C["チャンク分割"]
      C --> E["エンベディング生成"]
      E --> V["チャンクと<br/>エンベディングのテーブル"]
      Q["サポート担当者の質問"] --> S["VECTOR_SEARCH"]
      V --> S
      S -->|関連するチャンク| G["Gemini で回答を生成"]
  references:
    - title: "Perform semantic search and retrieval-augmented generation"
      url: "https://docs.cloud.google.com/bigquery/docs/vector-index-text-search-tutorial"
    - title: "Autonomous embedding generation"
      url: "https://docs.cloud.google.com/bigquery/docs/autonomous-embedding-generation"
    - title: "The ML.GENERATE_EMBEDDING function"
      url: "https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-generate-embedding"
