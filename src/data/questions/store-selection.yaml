- id: store-selection-001
  domain: store
  services: [bigtable, bigquery, cloud-sql, memorystore]
  type: multiple
  question: |
    ある製造企業は、世界 30 か所の工場に設置した約 50 万個のセンサーから、1 秒ごとに温度や振動の計測値を収集しています。収集したデータは次の2つの用途に使います。

    - 設備保全アプリが、センサー ID と時間範囲を指定して、直近の計測値を数ミリ秒以内に読み取る
    - 品質管理チームが、数年分のデータを対象に、工場別・月別の不良率などを SQL でアドホックに集計する

    データは毎年数百 TB ずつ増える見込みです。運用の手間を抑えて両方の用途を満たすには、保存先をどのように選べばよいですか？
  choices:
    a: "設備保全アプリ向けの計測値は Bigtable に保存し、センサー ID を先頭にした行キーで読み取る"
    b: "品質管理チームの分析用に、同じ計測値を BigQuery にも保存して SQL で集計する"
    c: "設備保全アプリ向けの計測値は Cloud SQL for PostgreSQL に保存し、リードレプリカを追加する"
    d: "設備保全アプリ向けの計測値は BigQuery に保存し、アプリから直近の値をクエリで取得する"
    e: "すべての計測値を Memorystore に保存し、品質管理チームの集計にもそのまま使う"
  answer: [a, b]
  choiceNotes:
    a: "正解です。Bigtable は毎秒数十万件規模の書き込みと、行キーによる数ミリ秒の読み取りに向いています。センサー ID を先頭に置くと、書き込みが分散し、センサーごとの時間範囲を連続したスキャンで読み取れます。"
    b: "正解です。BigQuery はサーバーレスのデータ ウェアハウスで、数年分・数百 TB 規模のデータに対するアドホックな SQL 集計に向いています。"
    c: "Cloud SQL は書き込みを1台のプライマリ インスタンスで処理し、ストレージにも上限（64 TB）があります。毎秒 50 万件の書き込みや数百 TB 規模への増加には対応できず、リードレプリカを足しても書き込み性能は上がりません。"
    d: "BigQuery は大量データの分析向けです。アプリから特定のキーを高い頻度で、数ミリ秒で読み取る用途には向きません。"
    e: "Memorystore はインメモリのキャッシュで、数百 TB のデータを長期間保持する保存先には適しません。SQL による集計もできません。"
  explanation: |
    アクセス パターンごとに保存先を分けるのが基本です。1つのサービスですべての要件を満たそうとしないことが、試験でもよく問われます。

    | 要件 | 適した保存先 | 特徴 |
    | --- | --- | --- |
    | 大量の書き込み、キーによる低レイテンシの読み取り、時系列 | Bigtable | ノードを追加すると性能がほぼ比例して伸びる NoSQL（ワイドカラム） |
    | 大量データに対するアドホックな SQL 分析 | BigQuery | サーバーレスで、ペタバイト規模のスキャンと集計に向く |
    | リージョン内のリレーショナル | Cloud SQL / AlloyDB | MySQL・PostgreSQL などとの互換性 |
    | グローバルなリレーショナル、強整合性 | Spanner | 水平スケールと強整合性を両立 |
    | キャッシュ | Memorystore | インメモリで 1 ミリ秒未満の応答 |
    | ファイル・オブジェクト | Cloud Storage | 容量無制限、ストレージ クラスで保存コストを調整 |

    典型的な構成では、Pub/Sub で受けたデータを Dataflow で処理し、Bigtable（アプリの参照用）と BigQuery（分析用）の両方に書き込みます。
  diagram: |
    flowchart TD
      S["工場のセンサー<br/>毎秒 50 万件"] --> P["Pub/Sub"]
      P --> D["Dataflow"]
      D --> BT["Bigtable<br/>センサー ID で参照"]
      D --> BQ["BigQuery<br/>SQL で集計"]
      BT --> A["設備保全アプリ<br/>数ミリ秒で読み取り"]
      BQ --> Q["品質管理チーム<br/>アドホック分析"]
  references:
    - title: "Bigtable の概要"
      url: "https://docs.cloud.google.com/bigtable/docs/overview"
    - title: "時系列データのスキーマ設計"
      url: "https://docs.cloud.google.com/bigtable/docs/schema-design-time-series"
    - title: "BigQuery ストレージの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/storage_overview"

- id: store-selection-002
  domain: store
  services: [spanner, cloud-sql, alloydb]
  type: single
  question: |
    あるフリマアプリの運営企業は、出品、注文、ポイント残高のデータを Cloud SQL for PostgreSQL で管理しています。購入の確定では、出品の在庫の引き当て、注文の登録、ポイント残高の減算を1つのトランザクションで行います。テレビで紹介されたときやセールのたびに書き込みが急増し、最大のマシンタイプにしてもプライマリ インスタンスの CPU が上限に達して、購入の処理が遅れるようになりました。

    利用者は国内だけで、海外に展開する予定はありません。障害への備えは、ゾーン障害に耐えられれば十分です。SQL とトランザクションは使い続けたいと考えており、移行のためのアプリケーションの改修はある程度許容できます。書き込みの増加に合わせて処理能力を水平に拡張でき、必要以上の費用がかからない構成にしたいと考えています。

    どの構成を選ぶべきですか？
  choices:
    a: "Spanner のリージョン構成のインスタンスを東京に作成し、負荷に合わせてコンピューティング容量を増やす"
    b: "Spanner のマルチリージョン構成のインスタンスを作成し、東京と大阪に読み書きレプリカを置いて書き込みを分散する"
    c: "AlloyDB for PostgreSQL に移行し、読み取りプール インスタンスのノードを増やして負荷を分散する"
    d: "Cloud SQL にリードレプリカを追加し、アプリケーションの書き込みをプライマリとリードレプリカに振り分ける"
  answer: [a]
  choiceNotes:
    a: "正解です。Spanner はリレーショナル モデルと ACID トランザクションを備え、コンピューティング容量（ノードや処理ユニット）を追加すると、書き込みの処理能力も水平に伸びます。リージョン構成は1つのリージョンの3つのゾーンにレプリカを置くため、ゾーン障害に耐えられます。"
    b: "マルチリージョン構成でも、書き込みの処理能力はレプリカの数ではなくコンピューティング容量で決まります。リージョン障害への備えは求められていないうえ、Enterprise Plus エディションが必要でレプリカも増えるため、必要以上に費用がかかります。リージョン間で合意を取るため、書き込みのレイテンシも大きくなります。"
    c: "読み取りプールは、読み取りの処理を分散する仕組みです。書き込みは引き続き1つのプライマリ インスタンスで処理するため、書き込みを水平に拡張できません。"
    d: "リードレプリカは読み取り専用で、書き込みを受け付けません。書き込みは引き続きプライマリ インスタンスだけで処理されます。"
  explanation: |
    リレーショナル データベースで **書き込み** の処理能力が足りないときは、書き込みを1台のプライマリで処理する構成かどうかを確認します。

    | サービス | 書き込みの処理 | 読み取りを分散する仕組み |
    | --- | --- | --- |
    | Cloud SQL | 1台のプライマリ インスタンス（マシンタイプを上げる垂直スケール） | リードレプリカ |
    | AlloyDB | 1台のプライマリ インスタンス（垂直スケール） | 読み取りプール インスタンス |
    | Spanner | データを分割して複数のサーバーで処理（水平スケール） | コンピューティング容量の追加、読み取り専用レプリカ |

    Spanner のインスタンス構成は、必要な可用性に合わせて選びます。

    | 構成 | レプリカの配置 | 可用性の SLA | 利用できるエディション |
    | --- | --- | --- | --- |
    | リージョン構成 | 1つのリージョンの3つのゾーン | 99.99% | Standard、Enterprise、Enterprise Plus |
    | デュアルリージョン構成、マルチリージョン構成 | 複数のリージョン | 99.999% | Enterprise Plus |

    - コンピューティング容量は、ノードまたは処理ユニット（1ノード = 1,000 処理ユニット）の単位で、サービスを止めずに増減できます。
    - Cloud SQL から移行するときは、単調に増える値を主キーの先頭に置かないなど、Spanner に合わせたスキーマの見直しが必要です。
  references:
    - title: "リージョン構成、デュアルリージョン構成、マルチリージョン構成"
      url: "https://docs.cloud.google.com/spanner/docs/instance-configurations"
    - title: "Spanner エディションの概要"
      url: "https://docs.cloud.google.com/spanner/docs/editions-overview"
    - title: "コンピューティング容量、ノード、処理ユニット"
      url: "https://docs.cloud.google.com/spanner/docs/compute-capacity"

- id: store-selection-003
  domain: store
  services: [cloud-sql, spanner, alloydb, bigtable]
  type: single
  question: |
    ある物流企業は、国内向けの配送管理アプリをオンプレミスの MySQL 8.0（データ量は約 300 GB）で運用しています。サーバーの保守の負担を減らすため、Google Cloud のマネージド データベースに移行することにしました。利用者は国内だけで、ピーク時でも毎秒数百件のトランザクションです。今後数年でデータ量が数倍になる見込みはありますが、海外展開の予定はありません。ゾーン障害に耐える構成にしつつ、アプリのコード変更とコストを最小限に抑えたいと考えています。

    どの保存先を選ぶべきですか？
  choices:
    a: "Cloud SQL for MySQL のインスタンスを高可用性構成で作成し、データを移行する"
    b: "Spanner のリージョン構成のインスタンスを作成し、スキーマを変換して移行する"
    c: "AlloyDB for PostgreSQL のクラスタを作成し、スキーマとクエリを書き換えて移行する"
    d: "Bigtable のインスタンスを作成し、テーブルごとに行キーを設計して移行する"
  answer: [a]
  choiceNotes:
    a: "正解です。Cloud SQL for MySQL は MySQL と互換性があり、アプリのコードをほとんど変えずに移行できます。高可用性構成では別のゾーンにスタンバイを置き、ゾーン障害時に自動でフェイルオーバーします。"
    b: "Spanner はグローバルな規模や書き込みの水平スケールが必要な場合に向いています。MySQL とは SQL の方言が異なるため移行時の変更が大きく、この規模ではコストも過大です。"
    c: "AlloyDB は高性能な PostgreSQL 互換のデータベースです。MySQL からはスキーマとクエリの書き換えが必要になり、コード変更を最小限にする要件に反します。"
    d: "Bigtable は NoSQL のデータベースで、トランザクションは1行の中に限られます。リレーショナル データベースを前提にした既存のアプリをそのまま移行できません。"
  explanation: |
    リレーショナル データベースの選択は、**規模・地理的な範囲・互換性** で判断します。

    | サービス | 向いているケース |
    | --- | --- |
    | Cloud SQL | MySQL・PostgreSQL・SQL Server の既存アプリを、リージョン内でそのまま動かしたい |
    | AlloyDB | PostgreSQL 互換で、より高いトランザクション性能や分析クエリの高速化が必要 |
    | Spanner | 複数リージョンにまたがる強整合性や、1台のサーバーを超える書き込みのスケールが必要 |

    押さえておきたい点:

    - Cloud SQL の専用コアのインスタンスでは、ストレージを最大 64 TB まで拡張できます。数百 GB から数 TB 規模なら十分です。
    - Cloud SQL には Enterprise エディションと Enterprise Plus エディションがあり、Enterprise Plus のほうが性能が高く、可用性の SLA も高く設定されています。
    - Spanner の SQL の方言は GoogleSQL と PostgreSQL です。MySQL のアプリをそのまま動かすことはできず、スキーマとクエリの変換が必要です。
  references:
    - title: "Cloud SQL の概要"
      url: "https://docs.cloud.google.com/sql/docs/introduction"
    - title: "Cloud SQL エディションの概要"
      url: "https://docs.cloud.google.com/sql/docs/mysql/editions-intro"

- id: store-selection-004
  domain: store
  services: [alloydb, cloud-sql, spanner, bigquery]
  type: single
  question: |
    ある EC 企業は、受注管理システムで PostgreSQL を使っています。最近、営業部門から「直近1時間の商品別売上」などを受注データベースに直接問い合わせるダッシュボードの要望が増えました。こうした集計クエリは、列の多い大きなテーブルのうち一部の列だけを広い範囲でスキャンするため、実行に数分かかり、受注処理の応答も遅くなっています。PostgreSQL との互換性を保ち、別の分析基盤へのデータ連携（ETL）を作らずに、最新の受注データに対する集計クエリを高速化したいと考えています。

    どの対応が最も適していますか？
  choices:
    a: "AlloyDB for PostgreSQL に移行し、集計に使う列を列指向エンジンに読み込む"
    b: "Cloud SQL for PostgreSQL に移行し、集計クエリをリードレプリカに振り分ける"
    c: "Spanner の PostgreSQL インターフェースに移行し、集計に使う列にセカンダリ インデックスを作る"
    d: "受注データを毎晩 BigQuery にエクスポートし、ダッシュボードは BigQuery に接続する"
  answer: [a]
  choiceNotes:
    a: "正解です。AlloyDB は PostgreSQL 互換のデータベースで、列指向エンジン（columnar engine）が選んだ列をメモリ上に列形式で保持し、スキャンや集計を高速化します。運用中のデータをそのまま分析でき、ETL は不要です。"
    b: "リードレプリカに振り分けるとプライマリの負荷は下がりますが、行形式のデータを広く読むことは変わらず、集計クエリ自体は速くなりません。"
    c: "Spanner の PostgreSQL インターフェースは PostgreSQL と完全には互換性がなく、移行時の変更が大きくなります。セカンダリ インデックスは特定の値の検索には有効ですが、広い範囲の集計の高速化には向きません。"
    d: "毎晩のエクスポートでは最新の受注データを分析できません。別の分析基盤へのデータ連携を作らないという要件にも反します。"
  explanation: |
    AlloyDB for PostgreSQL は、トランザクション処理と分析クエリの両方を1つのデータベースで高速に処理できるように設計された、PostgreSQL 互換のマネージド データベースです。

    - **列指向エンジン**：選んだ列をインメモリの列形式で保持し、スキャン・結合・集計を高速化します。どの列を載せるかを自動で判断する機能もあります。
    - **読み取りプール インスタンス**：読み取り専用のノードを追加して、分析クエリなどの読み取り負荷を分けられます。
    - クエリ プランナーが行形式と列形式のどちらで実行するかを選ぶため、アプリの SQL を変える必要はありません。

    | 要件 | 選択 |
    | --- | --- |
    | PostgreSQL 互換のまま、運用データに対する分析を速くしたい | AlloyDB（列指向エンジン） |
    | 大量の履歴データを横断した大規模な分析 | BigQuery へデータを連携 |
    | 既存の PostgreSQL をそのままマネージドにしたい | Cloud SQL for PostgreSQL |
  references:
    - title: "AlloyDB の概要"
      url: "https://docs.cloud.google.com/alloydb/docs/overview"
    - title: "AlloyDB 列指向エンジンについて"
      url: "https://docs.cloud.google.com/alloydb/docs/columnar-engine/about"

- id: store-selection-005
  domain: store
  services: [firestore, cloud-sql, bigtable, memorystore]
  type: single
  question: |
    ある旅行会社は、利用者が旅程やメモを管理できるモバイルアプリとウェブアプリを開発しています。旅程のデータは、旅行ごとに日程・予約・メモが入れ子になった構造で、項目は旅行の種類によって異なります。機内などのオフライン環境でもアプリで旅程を参照・編集でき、通信が回復したら自動で同期する必要があります。また、同行者が旅程を更新したら、他の同行者の端末にもすぐに反映させたいと考えています。データベースの容量管理は行いたくありません。

    どの保存先が最も適していますか？
  choices:
    a: "Firestore に旅行ごとのドキュメントとして保存し、リアルタイム リスナーで変更を受け取る"
    b: "Cloud SQL for MySQL に旅程のテーブルを作成し、アプリから定期的にポーリングして変更を取得する"
    c: "Bigtable に利用者 ID を行キーにして旅程を保存し、アプリから直接読み書きする"
    d: "Memorystore に旅程を保存し、アプリの起動時に最新の旅程をまとめて読み込む"
  answer: [a]
  choiceNotes:
    a: "正解です。Firestore はサーバーレスのドキュメント データベースです。モバイル・ウェブ向けのクライアント SDK が、オフライン時のキャッシュと再接続後の同期、リアルタイム リスナーによる変更の通知を提供します。"
    b: "項目が変わる入れ子のデータを固定のスキーマに合わせる手間がかかります。オフラインでの編集と同期、すぐに反映する仕組みは自分で作る必要があり、インスタンスの容量管理も必要です。"
    c: "Bigtable は大量のデータを低レイテンシで扱うサーバー側のデータベースで、端末のオフライン同期やリアルタイムの変更通知の機能はありません。ノード単位で課金されるため、この用途では割高です。"
    d: "Memorystore はインメモリのキャッシュで、旅程を保存する主なデータベースには向きません。オフラインでの編集と同期の仕組みもありません。"
  explanation: |
    **モバイル・ウェブのアプリ + 柔軟なスキーマ + オフライン同期 + リアルタイム更新** の組み合わせは Firestore を選ぶ決め手です。

    - データはドキュメント（JSON に近い入れ子のデータ）とコレクションで管理し、ドキュメントごとに項目が異なってもかまいません。
    - Android と Apple プラットフォームの SDK ではオフラインの永続化が既定で有効です。ウェブでは明示的に有効にします。
    - リアルタイム リスナーを使うと、ドキュメントやクエリの結果が変わったときに各端末へ通知されます。
    - サーバーレスで、負荷に応じて自動でスケールします。

    **データ例**: `trips` コレクションに、国内旅行と海外旅行の2つのドキュメントがある場合

    | フィールド | `trips/t001`（京都） | `trips/t002`（ハワイ） |
    | --- | --- | --- |
    | `members` | u01、u02 | u01、u03、u04 |
    | `days` | 2日分の予定（配列） | 5日分の予定（配列） |
    | `bookings.train` | 新幹線 | なし |
    | `bookings.flight` | なし | 往復の航空便 |
    | `bookings.hotel` | 旅館 | ホテル |

    `bookings` は予約の種類ごとの値を入れ子にしたマップです。同じコレクションのドキュメントでも、t001 には航空便がなく、t002 には新幹線がありません。旅行の種類ごとにテーブルや列を用意しなくても、必要な項目だけを持てます。

    Firestore には Native モードと Datastore モードがあります。モバイル・ウェブのクライアント SDK、オフライン同期、リアルタイム リスナーを使うのは **Native モード** です。
  diagram: |
    flowchart TD
      A["同行者 A の端末<br/>機内で旅程を編集"] --> C["端末のキャッシュに<br/>変更を保存"]
      C -->|通信の回復後に<br/>自動で同期| F["Firestore"]
      F -->|リアルタイム リスナー<br/>で通知| B["同行者 B の端末<br/>変更がすぐに反映"]
  references:
    - title: "オフライン データを有効にする"
      url: "https://docs.cloud.google.com/firestore/docs/manage-data/enable-offline"
    - title: "リアルタイム アップデートを入手する"
      url: "https://docs.cloud.google.com/firestore/docs/query-data/listen"

- id: store-selection-006
  domain: store
  services: [memorystore, cloud-sql, spanner, bigtable]
  type: single
  question: |
    あるゲーム会社のスマートフォン向けゲームでは、プレイヤーのプロフィールとランキングを Cloud SQL for PostgreSQL に保存しています。ロビー画面を開くたびに同じプロフィールと上位ランキングが繰り返し読み取られ、イベントの開催中は Cloud SQL の CPU 使用率が上限に達して、応答に数百ミリ秒かかるようになりました。頻繁に読み取られるデータを 1 ミリ秒未満で返せるようにし、データベースの負荷を下げたいと考えています。既存のスキーマとデータベースは今後も使い続けます。

    どの対応が最も適していますか？
  choices:
    a: "Memorystore for Redis を追加し、プロフィールとランキングをキャッシュする"
    b: "Cloud SQL にリードレプリカを追加し、ロビー画面の読み取りをすべてレプリカに振り分ける"
    c: "プロフィールとランキングを Spanner に移行し、コンピューティング容量を増やす"
    d: "プロフィールとランキングを Bigtable に移行し、プレイヤー ID を行キーにする"
  answer: [a]
  choiceNotes:
    a: "正解です。Memorystore はインメモリのマネージド サービスで、1 ミリ秒未満でデータを返せます。キャッシュになければ Cloud SQL から読んで格納する方式にすれば、既存のデータベースを変えずに負荷を下げられます。Redis のソート済みセットはランキングの実装にも向いています。"
    b: "リードレプリカでも同じ SQL クエリを実行するため、1 ミリ秒未満の応答という要件を満たすのは困難です。レプリカの台数に応じてコストも増えます。"
    c: "Spanner への移行はスキーマとアプリの大きな変更を伴い、既存のデータベースを使い続ける要件に反します。インメモリのキャッシュほどの低レイテンシも得られません。"
    d: "Bigtable への移行は既存のデータベースを使い続ける要件に反します。Bigtable の読み取りは数ミリ秒程度で、1 ミリ秒未満を求める用途にはキャッシュが適しています。"
  explanation: |
    同じデータが繰り返し読まれてデータベースが過負荷になる場合は、**Memorystore をキャッシュとして前段に置きます**。

    - **キャッシュアサイド**：アプリはまずキャッシュを読み、なければデータベースから読んでキャッシュに格納します。TTL（有効期限）を設定して古いデータが残り続けないようにします。
    - キャッシュは主なデータの保存先ではありません。元のデータは Cloud SQL などのデータベースに置きます。

    | Memorystore のサービス | 特徴 |
    | --- | --- |
    | Memorystore for Valkey | オープンソースの Valkey 互換。クラスタ構成でスケールする |
    | Memorystore for Redis Cluster | Redis Cluster 互換。シャードを追加してスケールする |
    | Memorystore for Redis | 単一ノードまたはレプリカ付きの Redis |
  diagram: |
    flowchart TD
      A["アプリがプロフィールや<br/>ランキングを読む"] --> M{"Memorystore に<br/>あるか"}
      M -->|ある| H["キャッシュから返す<br/>1 ミリ秒未満"]
      M -->|ない| S["Cloud SQL から読む"]
      S --> W["TTL を付けて<br/>キャッシュに格納"]
      W --> R["結果を返す"]
  references:
    - title: "Memorystore for Redis の概要"
      url: "https://docs.cloud.google.com/memorystore/docs/redis/memorystore-for-redis-overview"
    - title: "Memorystore のドキュメント"
      url: "https://docs.cloud.google.com/memorystore/docs"

- id: store-selection-007
  domain: store
  services: [bigtable]
  type: single
  question: |
    ある配車サービス企業は、約 2 万台の車両から 5 秒ごとに位置情報を受け取り、Bigtable に保存しています。位置情報は 1 年間保持し、行キーは `受信時刻#車両ID` の形式です。利用が増えるにつれて書き込みのレイテンシが悪化し、Key Visualizer を確認したところ、書き込みが常に行キーの範囲の末尾に集中していました。アプリの主な読み取りは「特定の車両の、指定した時間範囲の位置情報」です。

    書き込みを分散させ、主な読み取りも効率よく行うには、行キーをどのように変更すべきですか？
  choices:
    a: "行キーを「車両ID#受信時刻」の形式に変更する"
    b: "行キーを「受信時刻#車両ID」全体のハッシュ値に変更する"
    c: "行キーを「車両ID」だけにし、位置情報を同じ列の新しいバージョンとして追加し続ける"
    d: "行キーはそのままにして、クラスタのノード数を増やす"
  answer: [a]
  choiceNotes:
    a: "正解です。カーディナリティの高い車両 ID を先頭に移す（フィールドの昇格）と、書き込みが行キーの範囲全体に分散します。同じ車両のデータは時刻順に連続して並ぶため、時間範囲を指定したスキャンで効率よく読み取れます。"
    b: "ハッシュ値にすると書き込みは分散しますが、行キーの並び順の意味が失われます。特定の車両の時間範囲を読むには、テーブル全体をスキャンすることになります。"
    c: "1 年分で1行あたり数百万個のセルになり、1行のサイズの推奨上限（100 MB）を大きく超えるおそれがあります。行が大きすぎると読み取りの性能も悪化します。"
    d: "新しい行が常に行キーの範囲の末尾、つまり同じタブレットに書き込まれるため、ノードを増やしても負荷の集中は解消しません。"
  explanation: |
    Bigtable は行を **行キーの辞書順** に並べ、連続した範囲（タブレット）ごとにノードへ割り当てます。時刻で始まる行キーでは、新しい書き込みがすべて範囲の末尾に集まり、1つのノードに負荷が集中します（ホットスポット）。

    | 手法 | 内容 | 注意点 |
    | --- | --- | --- |
    | フィールドの昇格 | 車両 ID やユーザー ID などを時刻より前に置く | 読み取りのパターンに合うフィールドを選ぶ |
    | ソルト | ハッシュから求めた少数のプレフィックスを付けて分散する | 範囲の読み取りはプレフィックスの数だけ並列に行う |
    | 逆タイムスタンプ | 最大値から時刻を引いた値で新しい順に並べる | 先頭に置くとやはりホットスポットになる |

    **データ例**: 3台の車両（v0412、v1385、v7731）から 9:00:00 と 9:00:05 に位置情報を受信した場合の行の並び（受信時刻は時分秒の6桁に簡略化。太字は 9:00:05 の新しい書き込み）

    | 並び順 | 受信時刻#車両ID | 車両ID#受信時刻 |
    | --- | --- | --- |
    | 1 | `090000#v0412` | `v0412#090000` |
    | 2 | `090000#v1385` | **`v0412#090005`** |
    | 3 | `090000#v7731` | `v1385#090000` |
    | 4 | **`090005#v0412`** | **`v1385#090005`** |
    | 5 | **`090005#v1385`** | `v7731#090000` |
    | 6 | **`090005#v7731`** | **`v7731#090005`** |

    変更前は、新しい書き込みがすべて範囲の末尾に追加されます。v1385 の行も2行目と5行目に離れるため、時間範囲内の全車両の行をスキャンすることになります。変更後は、新しい書き込みが車両ごとの位置に分かれ、v1385 の行は `v1385#` で始まる連続した範囲（3〜4行目）として読み取れます。

    行キーは「どう読むか」から設計します。行キー全体をハッシュ値にする方法は、範囲スキャンができなくなり、Key Visualizer での分析もしにくくなるため推奨されません。
  diagram: |
    flowchart TD
      W["2 万台の車両<br/>からの書き込み"] --> K1["行キー<br/>受信時刻#車両ID"]
      W --> K2["行キー<br/>車両ID#受信時刻"]
      K1 -->|最新の時刻に集中| N1["1つのノードが過負荷"]
      K2 -->|車両 ID ごとに分散| N2["全ノードに分散"]
  references:
    - title: "スキーマ設計のベスト プラクティス"
      url: "https://docs.cloud.google.com/bigtable/docs/schema-design"
    - title: "Key Visualizer の概要"
      url: "https://docs.cloud.google.com/bigtable/docs/keyvis-overview"

- id: store-selection-008
  domain: store
  services: [bigtable]
  type: multiple
  question: |
    ある SEO 分析企業は、Web クローラーで取得したページの内容を Bigtable に保存しています。同じページを定期的に取得し直し、取得のたびに新しい行として保存します。分析アプリの主な読み取りは次の2つです。

    - 特定のドメインのページを、サブドメイン（`www.example.com`、`blog.example.com` など）も含めてまとめて読み取る
    - 特定のページについて、新しい取得結果から順に数件を読み取る

    行キーの設計として適切なものはどれですか？
  choices:
    a: "ドメイン名を逆順にして先頭に置き、「com.example.www/パス」のような形式にする"
    b: "ページを表す部分の後ろに、最大値から取得時刻を引いた値（逆タイムスタンプ）を付ける"
    c: "取得時刻を先頭に置き、「取得時刻#URL」のような形式にする"
    d: "URL のハッシュ値を行キーにして、書き込みを均等に分散させる"
    e: "ドメイン名をそのまま先頭に置き、「www.example.com/パス」のような形式にする"
  answer: [a, b]
  choiceNotes:
    a: "正解です。ドメイン名を逆順にすると、同じドメインのサブドメインが「com.example.」で始まる連続した範囲に並びます。1回の範囲スキャンでドメイン全体を読み取れ、似た内容の行が隣り合うため圧縮効率も上がります。"
    b: "正解です。逆タイムスタンプを付けると、同じページの取得結果が新しい順に並びます。範囲の先頭から数行を読むだけで最新の結果を取得できます。"
    c: "時刻で始まる行キーは、新しい書き込みが範囲の末尾に集中するホットスポットの原因になります。ドメインやページ単位の読み取りにも向きません。"
    d: "ハッシュ値では行の並び順の意味が失われ、ドメイン単位の範囲スキャンや、同じページの取得結果を新しい順に読むことができなくなります。"
    e: "「www.」や「blog.」で始まる行キーでは、同じドメインのページが離れた範囲に散らばり、ドメイン単位でまとめて読み取れません。"
  explanation: |
    Bigtable の行キーは、**よく使うクエリが連続した範囲の読み取り（範囲スキャン）になるように** 設計します。

    この例では、行キーは次のようになります。

    - `com.example.www/products#<逆タイムスタンプ>`
    - `com.example.blog/2026/hello#<逆タイムスタンプ>`

    **データ例**: example.com と sample.org のページを保存した場合の行の並び

    | 並び順 | ドメイン名をそのまま | ドメイン名を逆順 |
    | --- | --- | --- |
    | 1 | `blog.example.com/…` | `com.example.blog/…` |
    | 2 | `blog.sample.org/…` | `com.example.www/…` |
    | 3 | `www.example.com/…` | `org.sample.blog/…` |
    | 4 | `www.sample.org/…` | `org.sample.www/…` |

    ドメイン名をそのまま使うと example.com のページが1行目と3行目に離れますが、逆順にすると `com.example.` で始まる1〜2行目に連続して並びます。

    `com.example.www/products` を3回取得し、取得日を8桁の数値として 99999999 から引いた値を付けた場合（99999999 - 20261020 = 79738979）

    | 並び順 | 取得日 | 行キー |
    | --- | --- | --- |
    | 1 | 20261020 | `com.example.www/products#79738979` |
    | 2 | 20261013 | `com.example.www/products#79738986` |
    | 3 | 20261006 | `com.example.www/products#79738993` |

    新しい取得結果ほど値が小さくなるため、`com.example.www/products#` で始まる範囲の先頭の行が最新です。

    | 設計のポイント | 理由 |
    | --- | --- |
    | 先頭にカーディナリティの高い値を置く | 書き込みを分散する |
    | 関連する行が隣り合うようにする（逆ドメインなど） | 範囲スキャンで読め、圧縮も効く |
    | 最新から読むなら逆タイムスタンプを後ろに付ける | 先頭から数行を読むだけで済む |
    | 数値は桁をそろえてゼロ埋めする | 辞書順と数値の順序を一致させる |
    | 短く、人が読める文字列にする | ストレージを節約し、Key Visualizer でも分析しやすい |

    Bigtable には逆方向のスキャンもあり、逆タイムスタンプを使わずに新しい行から読む方法もあります。試験では「最新のデータから読む」要件に対して、逆タイムスタンプを行キーの後ろに付ける設計を押さえておきます。
  references:
    - title: "スキーマ設計のベスト プラクティス"
      url: "https://docs.cloud.google.com/bigtable/docs/schema-design"
    - title: "読み取り"
      url: "https://docs.cloud.google.com/bigtable/docs/reads"

- id: store-selection-009
  domain: store
  services: [bigtable]
  type: single
  question: |
    ある電力会社は、約 200 万台のスマートメーターから 30 分ごとに電力量や電圧など 20 項目の計測値を受け取り、Bigtable に保存しています。現在は計測のたびに1行を書き込み、行キーは `メーターID#計測時刻` です。顧客向けポータルでは、1台のメーターの1日分の全項目をまとめて表示します。読み取りの性能とデータの圧縮効率を高めたいと考えています。

    どのスキーマに変更すべきですか？
  choices:
    a: "行キーを「メーターID#日付」にし、1日分の計測値を同じ行にまとめて保存する"
    b: "行キーを「メーターID」だけにし、すべての計測値を同じ行に追加し続ける"
    c: "行キーを「日付#メーターID」にし、1日分の計測値を同じ行にまとめて保存する"
    d: "メーターごとに別のテーブルを作成し、行キーを「計測時刻」にして計測のたびに1行を書き込む"
  answer: [a]
  choiceNotes:
    a: "正解です。一定の期間のデータを1行にまとめる「時間バケット」のパターンです。1日分を1行で読めるため多数の行を読むより速く、関連する値がまとまるため圧縮効率も上がります。"
    b: "1台のメーターの行が際限なく大きくなり、1行のサイズの推奨上限（100 MB）を超えるおそれがあります。期間で区切ってバケットにする必要があります。"
    c: "日付で始まる行キーでは、その日の書き込みがすべて行キーの範囲の末尾にある、同じ日付で始まる範囲に集まります。負荷が一部のノードに偏るため、行キーは時刻や日付で始めないことが推奨されています。"
    d: "Bigtable では、似たスキーマのデータは同じテーブルに保存します。インスタンスあたりのテーブル数には上限があり、200 万個のテーブルは作成できません。"
  explanation: |
    時系列データのスキーマには、主に2つのパターンがあります。

    | パターン | 行の単位 | 特徴 |
    | --- | --- | --- |
    | 1回の計測を1行（縦長で幅の狭いテーブル） | `メーターID#計測時刻` | 実装が簡単。行数が多くなり、性能と圧縮効率は時間バケットに劣る |
    | 時間バケット（幅の広い行） | `メーターID#日付` など | 一定期間の値を1行にまとめる。読み書きが速く、圧縮効率が高い |

    時間バケットでは、1日の中の時刻を列修飾子にするか、セルのタイムスタンプで区別します。

    **データ例**: メーター m00123 の 2026 年 10 月 20 日のデータ（30 分ごとに 48 回、1回に 20 項目）

    | パターン | 行キーの例 | 1日分の行数 | 1行のセル数 |
    | --- | --- | --- | --- |
    | 1回の計測を1行 | `m00123#20261020T0030` | 48 | 20 |
    | 時間バケット（1日） | `m00123#20261020` | 1 | 960（48 × 20） |

    ポータルで1日分を表示するとき、1回の計測を1行にするパターンでは 48 行を読みますが、時間バケットでは1行を読むだけで済みます。1セルを 100 バイトと仮定すると、1日分の行は約 96 KB で、推奨上限の 100 MB を大きく下回ります。一方、行キーをメーター ID だけにすると、1年で約 35 万個（約 35 MB）のセルが1行にたまり、3年ほどで 100 MB を超えます。

    - バケットの大きさ（1時間・1日・1か月など）は、よく使うクエリの範囲に合わせます。
    - 1行が推奨上限の 100 MB に近づく場合は、バケットを小さくします。
    - どちらのパターンでも、行キーの先頭に時刻を置かず、メーター ID などカーディナリティの高い値を置きます。
  references:
    - title: "時系列データのスキーマ設計"
      url: "https://docs.cloud.google.com/bigtable/docs/schema-design-time-series"
    - title: "スキーマ設計のベスト プラクティス"
      url: "https://docs.cloud.google.com/bigtable/docs/schema-design"

- id: store-selection-010
  domain: store
  services: [bigtable, dataflow]
  type: single
  question: |
    ある広告配信企業は、利用者ごとのプロフィールを Bigtable に保存しています。行キーは利用者 ID で、各行には次の2種類のデータがあります。

    - 属性（年齢層、興味のカテゴリなど）：ときどき同じ列に上書きされ、最新の値だけが必要
    - 閲覧イベント：イベントごとに新しい列として追加され、直近 30 日分だけが必要

    現在はすべてのデータを1つの列ファミリーに保存し、ガベージ コレクション ポリシーを設定していないため、ストレージが増え続けています。運用の手間をかけずに、不要になったデータを自動で削除したいと考えています。

    どうすればよいですか？
  choices:
    a: "属性とイベントを別の列ファミリーに分け、属性には最大バージョン数 1、イベントには最大経過時間 30 日のポリシーを設定する"
    b: "1つの列ファミリーのまま、最大バージョン数 1 または最大経過時間 30 日のどちらかを満たすと削除する（和集合）ポリシーを設定する"
    c: "1つの列ファミリーのまま、最大バージョン数 1 と最大経過時間 30 日の両方を満たすと削除する（積集合）ポリシーを設定する"
    d: "1つの列ファミリーのまま、毎日 Dataflow のバッチジョブを実行し、30 日より古いセルを読み取って削除する"
  answer: [a]
  choiceNotes:
    a: "正解です。ガベージ コレクション ポリシーは列ファミリーごとに設定します。保持の要件が異なるデータを別の列ファミリーに分けると、それぞれに合ったポリシーで自動的に削除できます。"
    b: "和集合では、どちらかの条件を満たしたセルが削除されます。30 日以上更新されていない属性は、最新の値まで削除されてしまいます。"
    c: "積集合では、両方の条件を満たしたセルだけが削除されます。閲覧イベントは列ごとにセルが1つしかなく常に最新のバージョンのため、30 日を過ぎても削除されません。"
    d: "削除はできますが、ジョブの開発・スケジュール設定・監視が必要になり、運用の手間をかけないという要件に反します。"
  explanation: |
    Bigtable の **ガベージ コレクション ポリシーは列ファミリー単位** で設定します。保持の要件ごとに列ファミリーを分けるのが設計の基本です。

    | ポリシー | 削除されるセル |
    | --- | --- |
    | 最大バージョン数（max versions） | 列ごとに、新しいほうから指定数を超えた古いセル |
    | 最大経過時間（max age） | タイムスタンプが指定期間より古いセル |
    | 和集合（union） | いずれかの条件を満たすセル |
    | 積集合（intersection） | すべての条件を満たすセル |

    **データ例**: 今日を 2026 年 10 月 20 日として、利用者 u001 の行に次のセルがある場合に、各設定で削除の対象になるか

    | セル | 列ファミリーを分ける | 1つで和集合 | 1つで積集合 |
    | --- | --- | --- | --- |
    | 年齢層の古い版（2025/1/10） | 削除 | 削除 | 削除 |
    | 年齢層の最新版（2026/3/1） | 残る | **削除** | 残る |
    | 閲覧イベント（2026/9/10） | 削除 | 削除 | **残る** |
    | 閲覧イベント（2026/10/15） | 残る | 残る | 残る |

    和集合では、30 日以上更新されていない最新の年齢層まで削除されます。積集合では、列ごとにセルが1つしかない 9/10 の閲覧イベントが最新のバージョンのため、30 日を過ぎても残ります。列ファミリーを分けると、属性は古い版だけ、イベントは 30 日を過ぎたものだけが削除されます。

    - ポリシーは入れ子にして組み合わせることもできます。
    - 削除はバックグラウンドのコンパクションで行われ、実際に消えるまで最大で1週間ほどかかることがあります。期限切れのデータを確実に読み取りから除きたい場合は、読み取り時にフィルタを使います。
    - 列ファミリーには、一緒に読み書きする列をまとめます。
  references:
    - title: "ガベージ コレクションを構成する"
      url: "https://docs.cloud.google.com/bigtable/docs/configuring-garbage-collection"
    - title: "スキーマ設計のベスト プラクティス"
      url: "https://docs.cloud.google.com/bigtable/docs/schema-design"

- id: store-selection-011
  domain: store
  services: [bigtable, monitoring]
  type: single
  question: |
    ある動画配信企業は、視聴者ごとのおすすめ作品を Bigtable（SSD、12 ノード）から配信しています。人気シリーズの新作の公開直後に、読み取りのレイテンシが大幅に悪化しました。Cloud Monitoring で確認すると、クラスタ全体の平均 CPU 使用率は約 45% でしたが、最も負荷の高いノードの CPU 使用率は 100% 近くに達していました。

    原因を特定して根本的に対処するために、最初に行うべきことはどれですか？
  choices:
    a: "Key Visualizer で負荷が集中している行キーの範囲を特定し、行キーを見直す"
    b: "クラスタのノード数を 12 から 24 に増やし、読み取りの負荷をより多くのノードに分散させる"
    c: "読み取りリクエストにフィルタを追加し、必要な列ファミリーと列だけを返すようにする"
    d: "クラスタ全体の平均 CPU 使用率にアラートを設定し、上昇したらノードを追加する運用にする"
  answer: [a]
  choiceNotes:
    a: "正解です。平均と最も高いノードの CPU 使用率の差が大きいのは、一部の行キーの範囲に負荷が集中しているホットスポットの兆候です。Key Visualizer で原因の範囲を特定し、負荷が分散する行キーやスキーマに見直します。"
    b: "負荷が特定の行キーの範囲に集中している場合、ノードを増やしてもその範囲の負荷は分散されず、根本的な対処になりません。"
    c: "必要な列だけを読むのは良い習慣ですが、特定の行キーの範囲に読み取りが集中している原因の特定と解消にはつながりません。"
    d: "平均の CPU 使用率は約 45% のため、アラートは発生しません。平均値の監視だけでは、一部のノードへの負荷の集中を検出できず、原因も特定できません。"
  explanation: |
    **Key Visualizer** は、行キーの範囲（縦軸）と時間（横軸）ごとの負荷をヒートマップで表示するツールです。明るい帯が続く範囲がホットスポットの候補です。

    - 読み取り・書き込みの負荷の高さや大きすぎる行など、問題の兆候を示す指標も表示されます。
    - Key Visualizer より細かい時間の単位で調べるには、負荷の高いタブレットを一覧できるホット タブレットの機能を併用します。

    ノード数と性能の関係も押さえておきます。

    | 状況 | 対処 |
    | --- | --- |
    | 全ノードの CPU 使用率が均等に高い | ノードを追加する（性能はノード数にほぼ比例して伸びる） |
    | 一部のノードだけ CPU 使用率が高い | 行キーやスキーマを見直す（ノードの追加では解消しない） |

    ノードを追加してから、負荷がかかった状態で性能が大きく改善するまでに、最大 20 分ほどかかることがあります。
  references:
    - title: "Key Visualizer の概要"
      url: "https://docs.cloud.google.com/bigtable/docs/keyvis-overview"
    - title: "ホット タブレット"
      url: "https://docs.cloud.google.com/bigtable/docs/hot-tablets"
    - title: "パフォーマンスについて"
      url: "https://docs.cloud.google.com/bigtable/docs/performance"

- id: store-selection-012
  domain: store
  services: [bigtable]
  type: single
  question: |
    ある通信事業者は、通話明細（CDR）を Bigtable に保存しています。直近 3 か月分は顧客サポート画面からの低レイテンシの参照に使い、それより古いデータは法令に従って 10 年間保持し、月に1回のバッチ処理で広い範囲をスキャンして集計するだけです。古いデータは約 800 TB あり、既存のバッチ処理は Bigtable の HBase クライアントで書かれているため、保存先は Bigtable のままにします。現在はすべてのデータを SSD の1つのインスタンスに保存しており、ストレージのコストを下げたいと考えています。

    どうすればよいですか？
  choices:
    a: "ストレージ タイプが HDD の新しいインスタンスを作成し、3 か月より古いデータをそこに移す"
    b: "既存のインスタンスにストレージ タイプが HDD のクラスタを追加し、古いデータをそのクラスタに置く"
    c: "既存のクラスタのストレージ タイプを SSD から HDD に変更する"
    d: "ガベージ コレクション ポリシーで 1 年より古いセルを削除し、保存するデータ量を減らす"
  answer: [a]
  choiceNotes:
    a: "正解です。HDD は SSD より保存コストが大幅に低く、レイテンシを問わない大量データのバッチ処理やスキャンに向いています。直近のデータは SSD のインスタンスに残し、古いデータ用に HDD のインスタンスを別に作ります。"
    b: "1つのインスタンス内のクラスタは、すべて同じストレージ タイプを使う必要があります。SSD と HDD のクラスタを混在させることはできません。"
    c: "ストレージ タイプは作成後に変更できません。変更するには新しいインスタンスを作成してデータを移す必要があり、直近のデータの低レイテンシの参照も HDD では満たしにくくなります。"
    d: "10 年間保持するという法令の要件に反します。"
  explanation: |
    Bigtable のストレージ タイプは、**ほとんどの場合 SSD** を選びます。HDD を選ぶのは、次の条件がそろう場合です。

    - 保存するデータ量が非常に大きい
    - レイテンシを問わない（ユーザー向けの画面から使わない）
    - 主な処理がバッチや大きな範囲のスキャンで、1行単位のランダムな読み取りが少ない

    | 観点 | SSD | HDD |
    | --- | --- | --- |
    | 保存コスト | 高い | 大幅に低い |
    | 1行単位の読み取り | 高速 | 非常に遅い（SSD の数％程度） |
    | 向く用途 | ユーザー向けの配信、リアルタイム分析 | 履歴データのバッチ処理 |

    - ストレージ タイプは後から変更できず、インスタンス内のすべてのクラスタで同じです。変更するには新しいインスタンスを作成してデータを移します。
    - HDD でスループットが足りずノードを増やすと、その費用が保存コストの削減分を上回ることがあります。
  references:
    - title: "SSD ストレージと HDD ストレージの選択"
      url: "https://docs.cloud.google.com/bigtable/docs/choosing-ssd-hdd"
    - title: "インスタンス、クラスタ、ノード"
      url: "https://docs.cloud.google.com/bigtable/docs/instances-clusters-nodes"

- id: store-selection-013
  domain: store
  services: [spanner]
  type: multiple
  question: |
    あるイベント チケット販売会社は、予約システムを MySQL から Spanner に移行しました。予約テーブルの主キーは、MySQL の AUTO_INCREMENT と同じようにアプリが1ずつ増やして採番する INT64 の値です。人気公演の発売開始時に書き込みのレイテンシが大きく悪化し、Key Visualizer では書き込みがキーの範囲の末尾に集中していました。今後新しく作るテーブルもありますが、予約テーブルは外部の決済代行会社が数値の予約番号を参照しているため、INT64 の主キーを使い続ける必要があります。

    予約テーブルの書き込みの集中を解消し、新しく作るテーブルでも同じ問題を防ぐ方法として、適切なものはどれですか？
  choices:
    a: "新しく作るテーブルでは、主キーにバージョン 4 の UUID を文字列として使う"
    b: "予約テーブルでは、bit_reversed_positive を指定したシーケンスで主キーを生成する"
    c: "主キーを、生成時刻をもとに値を作るバージョン 1 の UUID に変更する"
    d: "主キーの先頭の列として、コミット タイムスタンプを格納する列を追加する"
    e: "インスタンスのコンピューティング容量を増やし、書き込みを多くのサーバーで処理する"
  answer: [a, b]
  choiceNotes:
    a: "正解です。バージョン 4 の UUID は上位ビットがランダムなため、書き込みがキーの範囲全体に分散します。新しいアプリでは UUID の使用が推奨されています。"
    b: "正解です。ビット反転シーケンスは、連番の値のビットを反転させた INT64 の値を生成します。数値の主キーを保ったまま、書き込みをキーの範囲全体に分散できます。"
    c: "バージョン 1 の UUID は生成時刻をもとに値を作るため、続けて生成した値が近い範囲に集まり、書き込みが集中するおそれがあります。Spanner のドキュメントでもバージョン 1 の UUID は推奨されていません。予約番号が INT64 でなくなる点も要件に反します。"
    d: "コミット タイムスタンプは単調に増える値で、主キーの先頭に置くと書き込みが範囲の末尾に集中します。"
    e: "書き込みが同じキーの範囲（スプリット）に集中している限り、容量を増やしても分散されません。主キーの設計を見直す必要があります。"
  explanation: |
    Spanner は主キーの順にデータを並べ、キーの範囲（スプリット）ごとにサーバーへ割り当てます。**単調に増える（または減る）主キー** では、新しい行がすべて範囲の末尾に書き込まれ、ホットスポットになります。

    | 方法 | 使う場面 |
    | --- | --- |
    | バージョン 4 の UUID（GENERATE_UUID 関数など） | 新しいテーブルの第一の選択肢 |
    | ビット反転シーケンス（bit_reversed_positive） | INT64 の主キーが必要な場合 |
    | キーのハッシュから求めたシャード ID を先頭に置く | 複合キーで、既存の列の順序を保ちたい場合 |
    | 主キーの列の順序を入れ替える | 単調に増える列を先頭から外せる場合 |

    ```sql
    CREATE SEQUENCE BookingSeq OPTIONS (sequence_kind = 'bit_reversed_positive');

    CREATE TABLE Bookings (
      BookingId INT64 NOT NULL DEFAULT (GET_NEXT_SEQUENCE_VALUE(SEQUENCE BookingSeq)),
      EventId STRING(36) NOT NULL,
    ) PRIMARY KEY (BookingId);
    ```

    **データ例**: 予約が4件続けて登録された場合の主キー（ビット反転シーケンスは、内部のカウンタ 1〜4 のビットを反転した値。説明のため4ビットに簡略化）

    | 予約 | 連番 | ビット反転シーケンス |
    | --- | --- | --- |
    | 1件目 | 100001 | 0001 → 1000（8） |
    | 2件目 | 100002 | 0010 → 0100（4） |
    | 3件目 | 100003 | 0011 → 1100（12） |
    | 4件目 | 100004 | 0100 → 0010（2） |

    連番では、4件とも既存のどのキーよりも大きいため、範囲の末尾にある同じスプリットに書き込まれます。ビット反転では、続けて生成した値が 0〜15 の範囲全体に散らばるため、書き込みが複数のスプリットに分散します。実際のシーケンスは INT64 の正の値を生成するため、値はもっと大きな数になります。

    移行元に既存のキーがある場合は、シーケンスで既存のキーの範囲をスキップするように設定できます。単調に増える列に作成した **セカンダリ インデックス** も、同じ理由でホットスポットになる点に注意します。
  references:
    - title: "スキーマ設計のベスト プラクティス"
      url: "https://docs.cloud.google.com/spanner/docs/schema-design"
    - title: "主キーのデフォルト値の管理"
      url: "https://docs.cloud.google.com/spanner/docs/primary-key-default-value"
    - title: "シーケンスを作成して管理する"
      url: "https://docs.cloud.google.com/spanner/docs/sequence-tasks"

- id: store-selection-014
  domain: store
  services: [spanner]
  type: single
  question: |
    ある医療機関グループは、電子カルテのデータを Spanner に保存しています。患者を表す Patients テーブル（主キーは PatientId）と、受診記録を表す Encounters テーブルがあります。アプリでは、患者の情報とその患者の受診記録をまとめて読み取る処理が大半を占めます。受診記録は必ずいずれかの患者に属し、患者のデータを削除したときは受診記録も一緒に削除する必要があります。

    患者と受診記録の結合を高速にし、親子関係の整合性も保つには、Encounters テーブルをどのように設計すべきですか？
  choices:
    a: "主キーを (PatientId, EncounterId) にし、INTERLEAVE IN PARENT Patients ON DELETE CASCADE を指定する"
    b: "主キーを EncounterId にし、PatientId 列に ON DELETE CASCADE を付けた Patients への外部キーを定義する"
    c: "主キーを EncounterId にし、PatientId 列にセカンダリ インデックスを作成する"
    d: "Encounters テーブルは作らず、受診記録を Patients テーブルの JSON 型の列に配列で保存する"
  answer: [a]
  choiceNotes:
    a: "正解です。インターリーブすると、受診記録の行が親の患者の行と物理的に隣接して格納され、結合を効率よく処理できます。INTERLEAVE IN PARENT は親のない子の行の挿入を防ぎ、ON DELETE CASCADE により患者の削除時に受診記録も削除されます。"
    b: "外部キーの ON DELETE CASCADE で、参照の整合性と患者の削除に連動した削除は保てます。しかし受診記録の行は患者の行と離れた場所に格納され、結合のたびに別のスプリットを読む可能性があるため、結合の高速化にはなりません。"
    c: "インデックスで患者ごとの受診記録は探しやすくなりますが、行は親の近くに格納されません。親子の整合性や、患者の削除に連動した削除も保証されません。"
    d: "受診のたびに患者の行が大きくなり、1件の受診記録を追加するだけでも列全体を書き換えることになります。受診記録ごとの検索や更新も非効率です。"
  explanation: |
    **インターリーブ テーブル** は、親子関係にあるテーブルの行を物理的に隣接させて格納する Spanner の機能です。親と子をまとめて読む処理が多い場合に使います。

    ```sql
    CREATE TABLE Encounters (
      PatientId STRING(36) NOT NULL,
      EncounterId STRING(36) NOT NULL,
      VisitDate DATE,
    ) PRIMARY KEY (PatientId, EncounterId),
      INTERLEAVE IN PARENT Patients ON DELETE CASCADE;
    ```

    - 子テーブルの主キーは、親テーブルの主キーの列で始める必要があります。
    - INTERLEAVE IN PARENT は親の行がない子の行の挿入を拒否します。INTERLEAVE IN（PARENT なし）は同じ物理配置で、この確認を行いません。
    - 外部キーでも ON DELETE CASCADE を指定できますが、行の物理的な配置は変わりません。親子をまとめて読む処理を速くしたい場合はインターリーブを選びます。
    - 親テーブルの主キー（PatientId）は、ホットスポットを避けるために UUID などを使います。
  diagram: |
    flowchart TD
      subgraph G1["隣接して格納"]
        P1["Patients<br/>P001"] --> E1["Encounters<br/>P001, E01"]
        P1 --> E2["Encounters<br/>P001, E02"]
      end
      subgraph G2["隣接して格納"]
        P2["Patients<br/>P002"] --> E3["Encounters<br/>P002, E01"]
      end
  references:
    - title: "スキーマの概要"
      url: "https://docs.cloud.google.com/spanner/docs/schema-and-data-model"
    - title: "外部キー"
      url: "https://docs.cloud.google.com/spanner/docs/foreign-keys/overview"

- id: store-selection-015
  domain: store
  services: [spanner]
  type: single
  question: |
    ある音楽配信企業は、楽曲のメタデータを Spanner の Songs テーブルに保存しています。主キーは SongId（UUID）で、ArtistName、SongTitle、Duration など約 30 列があります。アプリの検索画面では、次のクエリが頻繁に実行されます。

    ```sql
    SELECT SongTitle, Duration FROM Songs WHERE ArtistName = @artist;
    ```

    クエリの実行計画を確認すると、テーブル全体をスキャンしていました。楽曲データの更新は少なく、このクエリの読み取りレイテンシをできるだけ小さくしたいと考えています。

    どうすればよいですか？
  choices:
    a: "ArtistName にセカンダリ インデックスを作成し、STORING 句で SongTitle と Duration を含める"
    b: "ArtistName にセカンダリ インデックスを作成し、SongTitle と Duration は元のテーブルから読み取る"
    c: "テーブルを作り直し、主キーを SongId から ArtistName に変更する"
    d: "クエリを 15 秒のステイル読み取りで実行し、リーダーとの通信を減らす"
  answer: [a]
  choiceNotes:
    a: "正解です。STORING 句で指定した列はインデックスにもコピーされるため、インデックスだけで結果を返せます。元のテーブルへの結合（バックジョイン）が不要になり、レイテンシが小さくなります。書き込みとストレージのコストは増えますが、更新が少ないため影響は小さくて済みます。"
    b: "全件スキャンは解消しますが、SongTitle と Duration を取得するために元のテーブルとの結合が必要になり、レイテンシを最小にする要件を満たしません。"
    c: "同じアーティストの楽曲は複数あり、ArtistName だけでは行を一意に識別できないため主キーにできません。テーブルの作り直しとデータの移行も必要です。"
    d: "ステイル読み取りはリーダーとの通信を省けますが、テーブル全体をスキャンする問題は解消しません。"
  explanation: |
    Spanner のセカンダリ インデックスは、主キー以外の列での検索を高速にします。

    | オプション | 効果 | 補足 |
    | --- | --- | --- |
    | STORING 句（PostgreSQL 方言では INCLUDE） | 指定した列をインデックスにも保持し、元のテーブルへの結合を不要にする | ストレージと書き込みのコストが増える |
    | NULL_FILTERED | インデックス列が NULL の行をインデックスに含めない | NULL が多い列でインデックスを小さくできる |
    | UNIQUE | インデックス列の値の一意性を保証する | 重複する値は書き込めない |

    ```sql
    CREATE INDEX SongsByArtist ON Songs(ArtistName) STORING (SongTitle, Duration);
    ```

    - よく使うクエリが読む列だけを STORING に含めます。すべての列を含めるとテーブルの複製に近くなります。
    - 単調に増える列（タイムスタンプなど）だけをキーにしたインデックスは、ホットスポットの原因になります。
  references:
    - title: "セカンダリ インデックス"
      url: "https://docs.cloud.google.com/spanner/docs/secondary-indexes"
    - title: "スキーマ設計のベスト プラクティス"
      url: "https://docs.cloud.google.com/spanner/docs/schema-design"

- id: store-selection-016
  domain: store
  services: [spanner]
  type: single
  question: |
    あるグローバル SaaS 企業は、プロジェクト管理サービスのデータを Spanner で管理しています。利用者は北米・欧州・アジアに分散しており、どの地域からも読み取りのレイテンシを小さくしたいと考えています。書き込みの大部分は北米の利用者によるものです。サービスの可用性の目標は 99.999% で、リージョン全体の障害が起きてもサービスを継続する必要があります。

    どのインスタンス構成を選ぶべきですか？
  choices:
    a: "北米・欧州・アジアにレプリカを置くマルチリージョン構成を選び、デフォルトのリーダー リージョンを北米にする"
    b: "北米のリージョン構成を選び、コンピューティング容量を増やして他の大陸からの読み取りに備える"
    c: "大陸ごとにリージョン構成のインスタンスを1つずつ作成し、アプリでデータを同期する"
    d: "北米・欧州・アジアにレプリカを置くマルチリージョン構成を選び、デフォルトのリーダー リージョンをアジアにする"
  answer: [a]
  choiceNotes:
    a: "正解です。マルチリージョン構成は 99.999% の可用性の SLA を提供し、リージョン全体の障害にも耐えます。各大陸のレプリカで読み取りを処理でき、書き込みを処理するリーダーを書き込みの多い北米に置くと、書き込みのレイテンシも抑えられます。"
    b: "リージョン構成の可用性の SLA は 99.99% で、リージョン全体の障害には耐えられません。容量を増やしても、他の大陸との距離による読み取りのレイテンシは小さくなりません。"
    c: "インスタンス間の同期をアプリで実装する必要があり、データの整合性を保つのが困難です。運用の負担も大きくなります。"
    d: "書き込みはリーダーのあるリージョンで処理されるため、書き込みの大部分を占める北米の利用者のレイテンシが大きくなります。"
  explanation: |
    Spanner のインスタンス構成は、**可用性・レイテンシ・コスト** のバランスで選びます。

    | 構成 | 可用性の SLA | 特徴 |
    | --- | --- | --- |
    | リージョン構成 | 99.99% | 1つのリージョン内の複数ゾーンに複製。書き込みのレイテンシが最も小さい |
    | デュアルリージョン構成 | 99.999% | 2つのリージョンに複製し、リージョン障害に耐える |
    | マルチリージョン構成 | 99.999% | 複数のリージョンに複製。離れた地域からの読み取りが速く、書き込みのレイテンシは大きくなる |

    マルチリージョン構成のレプリカの種類:

    - **読み取り / 書き込みレプリカ**：書き込みの投票に参加し、リーダーになれる
    - **読み取り専用レプリカ**：読み取りだけを処理し、利用者の近くで読み取りを速くする
    - **ウィットネス レプリカ**：書き込みの投票だけに参加し、データの読み取りは処理しない

    書き込みは常にリーダーで処理されるため、デフォルトのリーダー リージョンは書き込みの多い地域の近くに設定します。デュアルリージョン構成とマルチリージョン構成は Enterprise Plus エディションで利用できます。
  references:
    - title: "リージョン構成、デュアルリージョン構成、マルチリージョン構成"
      url: "https://docs.cloud.google.com/spanner/docs/instance-configurations"
    - title: "データベースのリーダー リージョンを変更する"
      url: "https://docs.cloud.google.com/spanner/docs/modifying-leader-region"

- id: store-selection-017
  domain: store
  services: [spanner]
  type: single
  question: |
    ある小売チェーンは、店舗の在庫データを Spanner のマルチリージョン構成のインスタンスで管理しています。リーダー リージョンは北米にあり、在庫の更新の大部分は北米の基幹システムから行われます。アジアの店舗で使う在庫照会画面は在庫を参照するだけで、表示する在庫数は 1 分程度古くてもかまいません。インスタンスの構成は変えずに、この画面の読み取りレイテンシを小さくしたいと考えています。

    どうすればよいですか？
  choices:
    a: "在庫照会の読み取りを、15 秒の正確なステイルネスを指定したステイル読み取りで実行する"
    b: "在庫照会の読み取りを、常に最新のデータを返す強い読み取り（strong read）で実行する"
    c: "在庫照会の読み取りを、在庫を更新する処理と同じ読み取り / 書き込みトランザクションで実行する"
    d: "インスタンスのコンピューティング容量を増やし、読み取りを処理するサーバーの能力を上げる"
  answer: [a]
  choiceNotes:
    a: "正解です。ステイル読み取りでは、指定した過去の時点のデータを最寄りのレプリカから読み取れ、遠くのリーダーへの問い合わせを省けるため、古さを許容できる読み取りのレイテンシを小さくできます。"
    b: "強い読み取りは最新のデータを返すため、レプリカがリーダーに問い合わせて最新の状態かを確認する必要があり、レイテンシが大きくなります。"
    c: "読み取り / 書き込みトランザクションはロックを取得し、リーダーでの処理が必要です。参照するだけの画面には不要で、レイテンシも大きくなります。"
    d: "レイテンシの主な原因は北米のリーダーとの通信にかかる時間で、容量を増やしても小さくなりません。"
  explanation: |
    Spanner の読み取りは、**タイムスタンプの境界** によって次のように分かれます。

    | 種類 | 内容 | 主な用途 |
    | --- | --- | --- |
    | 強い読み取り（strong） | 最新のコミット済みデータを読む（既定） | 最新の値が必要な処理 |
    | 正確なステイルネス（exact staleness） | 指定した時間だけ過去の時点を読む | 古さを許容できる照会や集計 |
    | 上限付きステイルネス（bounded staleness） | 指定した上限の範囲で、なるべく新しいデータを読む | 単一の読み取り（single-use）で鮮度も重視する場合 |

    - ステイル読み取りは、単一の読み取りか読み取り専用トランザクションで実行します。読み取り / 書き込みトランザクションでは使えません。
    - ステイル読み取りの古さは **15 秒** 程度にすると、レプリカがリーダーに問い合わせずに応答できることが多く、効果が出やすいとされています。
    - 古いバージョンのデータは保持期間（既定は1時間）を過ぎると削除されるため、それより古い時点は読めません。
    - 読み取り専用レプリカはステイル読み取りの処理に使われ、利用者に近いリージョンで読み取りを速くします。
  diagram: |
    flowchart TD
      U["アジアの店舗の<br/>在庫照会画面"] --> R["最寄りのレプリカ"]
      R -->|強い読み取り| L["北米のリーダーに<br/>最新かを確認<br/>してから応答"]
      R -->|ステイル読み取り<br/>15 秒前の時点| F["リーダーに<br/>問い合わせず<br/>そのまま応答"]
  references:
    - title: "トランザクション外での読み取り"
      url: "https://docs.cloud.google.com/spanner/docs/reads"
    - title: "タイムスタンプの境界"
      url: "https://docs.cloud.google.com/spanner/docs/timestamp-bounds"

- id: store-selection-018
  domain: store
  services: [cloud-storage]
  type: single
  question: |
    ある建設会社は、竣工した建物の図面と現場写真を Cloud Storage に保存しています。データは法令に従って 10 年間保持し、建物の定期点検の際に、四半期に1回程度参照されます。参照するときは、すぐにファイルを開ける必要があります。データ量は約 1 PB あり、保存にかかる全体のコストをできるだけ抑えたいと考えています。

    どのストレージ クラスを選ぶべきですか？
  choices:
    a: "Coldline Storage"
    b: "Archive Storage"
    c: "Nearline Storage"
    d: "Standard Storage"
  answer: [a]
  choiceNotes:
    a: "正解です。Coldline は四半期に1回程度までのアクセスを想定したクラスで、最小保存期間は 90 日です。長期間保持し、ときどき参照するデータの保存コストを抑えられます。"
    b: "Archive は年に1回未満のアクセスを想定したクラスです。保存料金は最も安いものの取得の料金が最も高く、四半期ごとに参照する用途では Coldline のほうが適しています。"
    c: "Nearline は月に1回程度のアクセスを想定したクラスです。四半期に1回程度の参照なら、保存料金がより安い Coldline が適しています。"
    d: "Standard は頻繁にアクセスするデータ向けで、4つのクラスの中で保存料金が最も高く、このデータには割高です。"
  explanation: |
    ストレージ クラスは **アクセスの頻度** と **保存する期間** で選びます。

    | クラス | 想定するアクセス頻度 | 最小保存期間 | 取得の料金 |
    | --- | --- | --- | --- |
    | Standard | 頻繁 | なし | なし |
    | Nearline | 月に1回程度まで | 30 日 | あり |
    | Coldline | 四半期に1回程度まで | 90 日 | Nearline より高い |
    | Archive | 年に1回未満 | 365 日 | 最も高い |

    - どのクラスもミリ秒単位でデータを取り出せ、耐久性も同じです。Archive でも、取り出しに数時間待つことはありません。
    - 最小保存期間より前に削除・上書きすると、残りの期間分の料金（早期削除の料金）がかかります。例えば Coldline のオブジェクトを 60 日で削除すると、90 日分が請求されます。
    - 保存料金が安いクラスほど、取得や操作の料金は高くなります。
  references:
    - title: "ストレージ クラス"
      url: "https://docs.cloud.google.com/storage/docs/storage-classes"

- id: store-selection-019
  domain: store
  services: [cloud-storage]
  type: single
  question: |
    ある銀行は、顧客向けの取引明細書（PDF）を Cloud Storage のバケットに保存しています。明細書へのアクセスの傾向は次のとおりです。

    - 作成から 30 日間：顧客がオンラインで頻繁に閲覧する
    - 30 日後から 1 年後まで：問い合わせへの対応で、四半期に1回程度参照される
    - 1 年後以降：監査のため、まれに参照される程度
    - 作成から 7 年後：保持の義務が終わるため削除する

    この傾向はどの明細書でもほぼ同じで、予測できます。運用の手間を抑え、保存のコストを最小にするには、どうすればよいですか？
  choices:
    a: "Standard で保存し、ライフサイクル ルールで 30 日後に Coldline、365 日後に Archive に変更して、2,555 日後に削除する"
    b: "Standard で保存し、Cloud Run functions を毎日実行して、経過日数に応じてオブジェクトのクラスを書き換え、7 年後に削除する"
    c: "最初から Coldline で保存し、ライフサイクル ルールで 2,555 日後に削除する"
    d: "Standard で保存し、ライフサイクル ルールで 30 日後に Nearline、90 日後に Coldline に変更して、2,555 日後に削除する"
  answer: [a]
  choiceNotes:
    a: "正解です。オブジェクトのライフサイクル管理のルールで、経過日数に応じてストレージ クラスを自動で変更し、保持期間を過ぎたら削除できます。ライフサイクルによるクラスの変更には、早期削除や取得の料金がかかりません。"
    b: "自作の仕組みは開発と運用の手間がかかります。オブジェクトを書き換えてクラスを変えると、早期削除の料金が発生する場合もあります。"
    c: "作成から 30 日間の頻繁な閲覧に Coldline の取得の料金がかかり、割高になります。1 年後以降もより安い Archive に移らないため、保存コストを最小にできません。"
    d: "1 年後以降のまれにしか参照されないデータが Coldline に残り、Archive に移す場合より保存コストが高くなります。"
  explanation: |
    アクセスの傾向が **予測できる** 場合は、オブジェクトのライフサイクル管理のルールでクラスの変更と削除を自動化します。

    | ルール | 条件 | アクション |
    | --- | --- | --- |
    | 1 | age: 30、matchesStorageClass: STANDARD | SetStorageClass: COLDLINE |
    | 2 | age: 365、matchesStorageClass: COLDLINE | SetStorageClass: ARCHIVE |
    | 3 | age: 2555 | Delete |

    - age は作成からの日数です。クラスを変更しても作成日時は変わりません。
    - 1つのオブジェクトに Delete と SetStorageClass の両方が当てはまる場合は、Delete が優先されます。
    - ライフサイクルによるクラスの変更には、早期削除・取得の料金はかかりません。ただし、最小保存期間より前にライフサイクルで削除した場合は、早期削除の料金がかかります。
    - アクセスの傾向が予測できない場合は、Autoclass を検討します。
  diagram: |
    flowchart TD
      A["作成<br/>Standard"] -->|30 日後| B["Coldline"]
      B -->|365 日後| C["Archive"]
      C -->|2,555 日後| D["削除"]
  references:
    - title: "オブジェクトのライフサイクル管理"
      url: "https://docs.cloud.google.com/storage/docs/lifecycle"
    - title: "オブジェクトのライフサイクル管理の構成例"
      url: "https://docs.cloud.google.com/storage/docs/lifecycle-configurations"

- id: store-selection-020
  domain: store
  services: [cloud-storage]
  type: single
  question: |
    ある写真共有サービスは、利用者が投稿した写真を Cloud Storage のバケットに保存しています。多くの写真は投稿直後にしか閲覧されませんが、数か月後や数年後に急に話題になり、大量に閲覧される写真もあります。どの写真がいつ参照されるかは予測できません。長期間アクセスされない写真はできるだけ安いクラスに移したい一方で、再び閲覧されたときに取得の料金や早期削除の料金がかかることは避けたいと考えています。運用の手間も最小限にしたいと考えています。

    どうすればよいですか？
  choices:
    a: "バケットで Autoclass を有効にし、終端のストレージ クラスを Archive に設定する"
    b: "ライフサイクル ルールで、作成から 90 日後に Coldline、365 日後に Archive に変更する"
    c: "すべての写真を最初から Nearline で保存し、クラスは変更しない"
    d: "閲覧ログを毎週分析し、アクセスのない写真をスクリプトで Coldline に書き換える"
  answer: [a]
  choiceNotes:
    a: "正解です。Autoclass はオブジェクトごとのアクセス状況に応じてクラスを自動で変更し、アクセスされたオブジェクトは Standard に戻します。Autoclass のバケットでは取得や早期削除の料金はかかりません。終端のクラスを Archive にすると、長期間アクセスのない写真が Coldline、Archive まで移ります。"
    b: "経過日数だけで移すため、話題になった古い写真も安いクラスのまま閲覧され、取得の料金がかかります。アクセスされても Standard には戻りません。"
    c: "投稿直後に頻繁に閲覧される写真にも取得の料金がかかります。長期間アクセスのない写真も、Nearline より安いクラスには移りません。"
    d: "分析とスクリプトの開発・運用が必要です。オブジェクトを書き換えてクラスを変えると、早期削除の料金が発生する場合もあります。"
  explanation: |
    **Autoclass** は、オブジェクトごとのアクセス状況に基づいてストレージ クラスを自動で変更する、バケット単位の機能です。アクセスの傾向が予測できないデータに向いています。

    | 最後のアクセスからの期間 | 移るクラス |
    | --- | --- |
    | 30 日 | Nearline |
    | 90 日 | Coldline（終端が Archive の場合） |
    | 365 日 | Archive（終端が Archive の場合） |
    | アクセスされたとき | Standard に戻る |

    - 終端のクラスは Nearline（既定）か Archive を選べます。
    - 対象は 128 KiB 以上のオブジェクトです。
    - 早期削除の料金と取得の料金はかかりませんが、対象のオブジェクトの数に応じて Autoclass の管理の料金がかかります。
    - ストレージ クラスの変更は Autoclass が行うため、ライフサイクル ルールは削除（Delete）などに使います。

    アクセスの傾向が予測できるならライフサイクル ルール、予測できないなら Autoclass、と使い分けます。
  references:
    - title: "Autoclass"
      url: "https://docs.cloud.google.com/storage/docs/autoclass"
    - title: "Autoclass を使用する"
      url: "https://docs.cloud.google.com/storage/docs/using-autoclass"

- id: store-selection-021
  domain: store
  services: [cloud-storage]
  type: multiple
  question: |
    ある製薬会社の研究部門は、実験データの解析結果を Cloud Storage のバケットに保存しています。解析パイプラインは、同じ名前のファイルを定期的に上書きします。以前、誤った処理で重要なファイルが上書きや削除され、元に戻せなかったことがありました。上書きや削除の前の状態に 30 日間は戻せるようにしたいと考えています。ただし、古い版が際限なく残ってストレージのコストが増えることは避けたいと考えています。

    どの対応を組み合わせるべきですか？
  choices:
    a: "バケットでオブジェクトのバージョニングを有効にする"
    b: "ライフサイクル ルールで、非現行になってから 30 日を過ぎたバージョンを削除する（daysSinceNoncurrentTime: 30）"
    c: "ライフサイクル ルールで、作成から 30 日を過ぎたオブジェクトを削除する（age: 30）"
    d: "ライフサイクル ルールで、新しい版が 30 個以上あるバージョンを削除する（numNewerVersions: 30）"
    e: "バケットに 30 日間の保持ポリシーを設定する"
  answer: [a, b]
  choiceNotes:
    a: "正解です。バージョニングを有効にすると、オブジェクトが上書きや削除されたときに以前の版が非現行のバージョンとして残り、後から復元できます。"
    b: "正解です。非現行になってからの日数で削除するルールにより、30 日間は復元できる状態を保ちつつ、古い版が際限なく残るのを防げます。"
    c: "age は作成からの日数の条件のため、上書きされていない現行のファイルまで 30 日で削除の対象になり、要件に反します。"
    d: "numNewerVersions は日数ではなく新しい版の数の条件です。頻繁に上書きされるファイルでは 30 日より前に古い版が消え、あまり上書きされないファイルでは古い版がいつまでも残ります。"
    e: "保持ポリシーは、保持期間が過ぎるまでオブジェクトの上書きと削除を禁止します。定期的に上書きするパイプラインが失敗し、要件に合いません。"
  explanation: |
    **オブジェクトのバージョニング** を有効にしたバケットでは、オブジェクトを上書き・削除すると、以前の版が **非現行（noncurrent）のバージョン** として残ります。非現行のバージョンにも保存料金がかかるため、ライフサイクル ルールと組み合わせて残す範囲を決めます。

    | 条件 | 意味 | 用途 |
    | --- | --- | --- |
    | daysSinceNoncurrentTime | 非現行になってからの日数 | 一定期間だけ復元できるようにする |
    | numNewerVersions | そのバージョンより新しい版の数 | 直近の N 版だけ残す |
    | isLive | 現行（true）か非現行（false）か | 非現行のバージョンだけを対象にする |
    | age | 作成からの日数 | 現行のオブジェクトの移動や削除 |

    **データ例**: `result.csv` を 9/7 に作成し、9/14 と 9/21 に上書きした場合（daysSinceNoncurrentTime: 30 のルールを設定）

    | 版 | 作成日 | 非現行になった日 | 削除の対象になる日 |
    | --- | --- | --- | --- |
    | 1 | 9/7 | 9/14 | 10/14 |
    | 2 | 9/14 | 9/21 | 10/21 |
    | 3 | 9/21 | なし（現行） | 対象にならない |

    どの版も、上書きされてから 30 日間は復元できます。age: 30 では作成日から数えるため、版1は非現行になってから 23 日後の 10/7 に削除の対象になり、現行の版3も 10/21 に削除の対象になります。numNewerVersions: 30 では、このファイルがその後上書きされない限り、版1と版2はいつまでも残ります。

    - 非現行のバージョンは、世代番号（generation）を指定してコピーすると現行のオブジェクトとして復元できます。
    - 削除や上書きで失われたオブジェクトを一定期間（既定は 7 日間）復元できる **削除（復元可能）** （soft delete）の機能も、新しいバケットでは既定で有効です。
  references:
    - title: "オブジェクトのバージョニング"
      url: "https://docs.cloud.google.com/storage/docs/object-versioning"
    - title: "オブジェクトのライフサイクル管理"
      url: "https://docs.cloud.google.com/storage/docs/lifecycle"

- id: store-selection-022
  domain: store
  services: [cloud-storage, dataproc]
  type: single
  question: |
    ある自動車メーカーは、試験車両の走行データ（Parquet ファイル、合計約 3 PB）を Cloud Storage に保存し、us-central1 リージョンの Dataproc クラスタで毎日解析しています。解析ジョブはデータを繰り返し大量に読み込むため、読み取りのスループットが重要です。元データはオンプレミスのアーカイブにも保管されているため、リージョン全体の障害に備えた複製は不要で、ゾーン障害に耐えられれば十分です。ストレージのコストは最小限に抑えたいと考えています。

    バケットのロケーションとストレージ クラスをどのように選ぶべきですか？
  choices:
    a: "us-central1 のリージョンに、Standard Storage のバケットを作成する"
    b: "US マルチリージョンに、Standard Storage のバケットを作成する"
    c: "us-central1 を含むデュアルリージョンに、ターボ レプリケーションを有効にしたバケットを作成する"
    d: "us-central1 のリージョンに、Nearline Storage のバケットを作成する"
  answer: [a]
  choiceNotes:
    a: "正解です。処理と同じリージョンのバケットは、ロケーションの中で保存料金が最も低く、Dataproc から低いレイテンシと高いスループットで読み取れます。リージョンのバケットでも、データはリージョン内の複数のゾーンに冗長化され、ゾーン障害に耐えられます。"
    b: "マルチリージョンはリージョン障害にも耐えますが、保存料金はリージョンより高くなります。データを置くリージョンは Google が決めるため、処理と同じリージョンに置かれるとは限りません。"
    c: "リージョン障害に備える必要はないため、デュアルリージョンの高い保存料金とレプリケーションの料金は不要です。ターボ レプリケーションにはさらに追加の料金がかかります。"
    d: "Nearline は月に1回程度のアクセスを想定したクラスです。毎日繰り返し読み込むと取得の料金がかさみ、かえって高くつきます。"
  explanation: |
    バケットのロケーションは、**データを使う場所** と **必要な可用性** で選びます。

    | ロケーション | 保存先 | 保存料金 | 主な用途 |
    | --- | --- | --- | --- |
    | リージョン | 1つのリージョン（リージョン内の複数ゾーンに冗長化） | 最も低い | 同じリージョンの Dataproc、Dataflow、BigQuery などからの処理 |
    | デュアルリージョン | 特定の2つのリージョン | 高い | 2つのリージョンでの高可用性と災害対策 |
    | マルチリージョン | US・EU・ASIA などの広い地域（リージョンは Google が決める） | 高い | 広い地域の利用者へのコンテンツ配信、高可用性 |

    - 分析パイプラインのように処理が1つのリージョンにまとまっている場合は、同じリージョンのバケットに置くとレイテンシとコストの両面で有利です。
    - リージョン障害に備える必要があるときはデュアルリージョンを選び、RPO 15 分が必要ならターボ レプリケーションを有効にします。
    - 毎日読み込むデータは Standard、アクセスが少なくなったデータはライフサイクル ルールや Autoclass で低いクラスに移します。
  diagram: |
    flowchart TD
      Q1{"リージョン障害でも<br/>継続が必要か"} -->|いいえ| R["リージョン<br/>処理と同じリージョンに置く"]
      Q1 -->|はい| Q2{"保存先の2つの<br/>リージョンを指定したいか"}
      Q2 -->|はい| D["デュアルリージョン<br/>RPO 15 分ならターボ"]
      Q2 -->|いいえ| M["マルチリージョン"]
  references:
    - title: "バケットのロケーション"
      url: "https://docs.cloud.google.com/storage/docs/locations"
    - title: "ストレージ クラス"
      url: "https://docs.cloud.google.com/storage/docs/storage-classes"

- id: store-selection-023
  domain: store
  services: [bigquery, cloud-storage]
  type: single
  question: |
    あるセキュリティ企業は、顧客のファイアウォール ログを BigQuery のデータセットに蓄積しています。ログは追記するだけで、更新や削除はほとんど行いません。データ量は 2 PB を超え、ストレージの料金が増え続けています。INFORMATION_SCHEMA.TABLE_STORAGE ビューで確認したところ、このデータセットのテーブルは、物理（圧縮後）のバイト数が論理（非圧縮）のバイト数より大幅に小さいことがわかりました。データの保持期間とクエリの方法は変えずに、ストレージのコストを下げたいと考えています。

    どうすればよいですか？
  choices:
    a: "データセットのストレージ課金モデルを、物理ストレージ課金に変更する"
    b: "テーブルに 90 日の有効期限を設定し、古いログを自動で削除する"
    c: "ログを Cloud Storage の Archive Storage にエクスポートし、外部テーブルからクエリする"
    d: "BigQuery Enterprise エディションの予約を購入し、ストレージの料金を割り引く"
  answer: [a]
  choiceNotes:
    a: "正解です。物理ストレージ課金では、圧縮後のバイト数に基づいて課金されます。圧縮率の高いデータでは、単価が高くても全体の料金を下げられます。変更はデータセット単位の設定で、データの移動やクエリの変更は不要です。"
    b: "古いログが削除されるため、データの保持期間を変えないという要件に反します。"
    c: "外部テーブルからのクエリは性能や使える機能が制限され、クエリの方法を変えないという要件に反します。エクスポートの運用も必要です。"
    d: "エディションと予約はクエリなどのコンピューティングの料金に関するもので、ストレージの料金は下がりません。"
  explanation: |
    BigQuery のストレージの課金モデルは、**データセット単位** で選びます。

    | 観点 | 論理ストレージ課金（既定） | 物理ストレージ課金 |
    | --- | --- | --- |
    | 課金の基準 | 非圧縮のバイト数 | 圧縮後のバイト数 |
    | 単価 | 低い | 高い |
    | タイムトラベルとフェイルセーフのデータ | 課金されない | 課金される |
    | 有利になるデータ | 圧縮が効きにくい、更新や削除が多い | 圧縮率が高い、追記が中心 |

    **データ例**: ログの論理のバイト数が 2,000 TB、物理のバイト数が 400 TB で、仮に物理の単価を論理の2倍とした場合

    | 課金モデル | 課金されるバイト数 | 単価（仮定） | 料金の比 |
    | --- | --- | --- | --- |
    | 論理ストレージ課金 | 2,000 TB | 1 | 2,000 |
    | 物理ストレージ課金 | 400 TB | 2 | 800 |

    単価が2倍でも、課金されるバイト数が5分の1になるため、料金は6割下がります。この仮定では、物理のバイト数（タイムトラベルとフェイルセーフの分を含む）が論理の半分を下回れば、物理ストレージ課金のほうが安くなります。

    ```sql
    SELECT table_name, total_logical_bytes, total_physical_bytes, time_travel_physical_bytes
    FROM `region-us`.INFORMATION_SCHEMA.TABLE_STORAGE
    WHERE table_schema = 'firewall_logs';

    ALTER SCHEMA firewall_logs SET OPTIONS (storage_billing_model = 'PHYSICAL');
    ```

    - 更新や削除が多いテーブルは、タイムトラベル（2〜7 日で設定）とフェイルセーフ（7 日間）のバイト数が増えるため、物理ストレージ課金で割高になることがあります。タイムトラベルの期間を短くすると、この分を減らせます。
    - 課金モデルの変更が反映されるまで 24 時間かかり、変更後 14 日間は再び変更できません。
    - どちらの課金モデルでも、90 日間変更されていないテーブルやパーティションには長期保存の料金が適用されます。
  references:
    - title: "BigQuery ストレージの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/storage_overview"
    - title: "データセットの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/datasets-intro"
    - title: "タイムトラベルとフェイルセーフによるデータの保持"
      url: "https://docs.cloud.google.com/bigquery/docs/time-travel"

- id: store-selection-024
  domain: store
  services: [bigquery]
  type: single
  question: |
    あるオンライン学習サービスは、受講者の学習ログを、日付でパーティション分割した BigQuery のテーブルに保存しています。分析の大半は直近 3 か月のデータが対象ですが、年に数回、過去のデータも含めて BigQuery で分析します。社内規程により、ログは 3 年間保持した後に削除しなければなりません。運用の手間を最小限にして、ストレージのコストを抑えたいと考えています。

    どうすればよいですか？
  choices:
    a: "テーブルにパーティションの有効期限を 3 年で設定し、古いパーティションは長期保存の料金が自動で適用されるのに任せる"
    b: "テーブルの有効期限を 3 年で設定し、90 日を過ぎたパーティションは毎月アーカイブ用の別のテーブルにコピーする"
    c: "スケジュールされたクエリを毎日実行し、3 年を過ぎたパーティションのデータを DELETE 文で削除する"
    d: "90 日を過ぎたパーティションを毎月 Cloud Storage にエクスポートして BigQuery から削除し、3 年後に削除する"
  answer: [a]
  choiceNotes:
    a: "正解です。パーティションの有効期限を設定すると、期限を過ぎたパーティションが自動で削除されます。90 日間連続して変更されていないパーティションには長期保存の料金が自動で適用され、料金はおよそ半分になります。クエリの性能も変わりません。"
    b: "テーブルの有効期限はテーブル全体を削除する設定のため、3 年後にすべてのデータが消えてしまいます。長期保存の料金は自動で適用されるため、コピーも不要です。"
    c: "削除はできますが、スケジュールされたクエリの作成と管理が必要です。パーティションの有効期限なら設定だけで済み、削除漏れも起きません。"
    d: "エクスポートと削除の処理を作って運用する必要があります。過去のデータを分析するたびに外部テーブルなどを用意する手間もかかります。"
  explanation: |
    BigQuery では、古いデータのコストと削除を **設定だけで自動化** できます。

    **長期保存の料金**

    - テーブル、またはパーティションが **90 日間連続して変更されていない** と、ストレージの料金がおよそ半額になります。パーティションごとに判定されます。
    - クエリの実行やエクスポートでは 90 日のカウントはリセットされません。データの追加・更新・削除でリセットされます。
    - 性能・耐久性・可用性は変わりません。

    **有効期限の設定**

    | 設定 | 対象 |
    | --- | --- |
    | テーブルの有効期限 | テーブル全体を指定日時に削除 |
    | パーティションの有効期限 | パーティションの日付から指定期間が過ぎたパーティションを削除 |
    | データセットのデフォルトのテーブル有効期限 | 新しく作るテーブルに適用 |
    | データセットのデフォルトのパーティション有効期限 | 新しく作るパーティション分割テーブルに適用（デフォルトのテーブル有効期限より優先） |

    ```sql
    ALTER TABLE learning.events SET OPTIONS (partition_expiration_days = 1095);
    ```
  diagram: |
    flowchart TD
      A["新しいパーティション<br/>アクティブ ストレージ"] -->|90 日間変更なし| B["長期保存の料金<br/>約半額"]
      B -->|データを変更| A
      B -->|パーティションの<br/>有効期限 3 年| C["自動で削除"]
  references:
    - title: "パーティション分割テーブルを管理する"
      url: "https://docs.cloud.google.com/bigquery/docs/managing-partitioned-tables"
    - title: "費用の見積もりと管理"
      url: "https://docs.cloud.google.com/bigquery/docs/best-practices-costs"
