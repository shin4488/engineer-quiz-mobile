- id: maintain-ops-001
  domain: maintain
  services: [dataflow, pubsub, monitoring]
  type: multiple
  question: |
    ある物流企業は、約2万台のトラックから送られる位置情報を Pub/Sub で受け取り、Dataflow のストリーミング パイプラインで加工して BigQuery に書き込んでいます。配車担当者のダッシュボードは、5分以内のデータが表示されることを前提にしています。先月、パイプラインの処理が遅れて BigQuery のデータが30分以上古くなっていたのに、誰も気づきませんでした。

    今後は、次の2つの状況を Cloud Monitoring のアラートで早く検知したいと考えています。
    - Dataflow の処理が遅れ、出力されるデータが古くなっている
    - Pub/Sub のサブスクリプションで、メッセージが処理されずに滞留している

    どのアラートを設定すべきですか？
  choices:
    a: "Dataflow のワーカーの CPU 使用率が、90%を超えたら通知するアラート"
    b: "Dataflow ジョブのデータの鮮度が、5分を超えたら通知するアラート"
    c: "Pub/Sub トピックへのパブリッシュ数が、5分間ゼロになったら通知するアラート"
    d: "サブスクリプションの最も古い未確認メッセージの経過時間が、5分を超えたら通知するアラート"
    e: "BigQuery の予約のスロット使用率が、80%を超えたら通知するアラート"
  answer: [b, d]
  choiceNotes:
    a: "CPU 使用率が高くても処理が間に合っている場合があり、逆に外部 API の応答待ちなどで CPU 使用率が低いまま遅れる場合もあります。データの古さは直接検知できません。"
    b: "正解です。データの鮮度は、現在の時刻と、パイプラインが処理し終えたデータの時刻（データのウォーターマーク）との差です。値が大きいほど出力が古くなっているため、「5分以内」という要件を直接監視できます。"
    c: "パブリッシュが止まったことは、送信側（トラック側）の問題の検知には役立ちます。しかし、受信側での処理の遅れや滞留は検知できません。"
    d: "正解です。確認応答（ack）されていない最も古いメッセージの経過時間が伸びている場合、サブスクライバー（ここでは Dataflow）がメッセージを受け取りきれず、サブスクリプションに滞留しています。"
    e: "Dataflow から BigQuery へのストリーミング書き込みは、クエリ用の予約のスロットを消費しません。パイプラインの遅れの検知には使えません。"
  explanation: |
    ストリーミング パイプラインの遅れは、**処理がどこまで進んでいるか** と **入口でどれだけ滞留しているか** の両方を監視すると早く気づけます。

    | 監視対象 | 主な指標 | わかること |
    | --- | --- | --- |
    | Dataflow | データの鮮度（`job/data_watermark_age`） | 出力されるデータがどれだけ古いか |
    | Dataflow | システム レイテンシ（`job/system_lag`） | データが処理中または処理待ちになっている最大の時間 |
    | Pub/Sub | 最も古い未確認メッセージの経過時間（`subscription/oldest_unacked_message_age`） | 最も古い未処理のメッセージがどれだけ待たされているか |
    | Pub/Sub | 未配信メッセージ数（`subscription/num_undelivered_messages`） | 滞留しているメッセージの件数 |

    - 件数の指標は、流量によって正常な値が変わるため、しきい値を決めにくいことがあります。**経過時間** の指標は遅れそのものを表すので、レイテンシの要件と対応づけやすくなります。
    - Dataflow と Pub/Sub の指標は、追加の設定なしで Cloud Monitoring に記録されます。そのままアラート ポリシーの条件に使えます。
    - CPU 使用率などのリソースの指標は、原因の調査には役立ちますが、遅れそのものの検知には向きません。

    **データ例**: サブスクリプションに、日中も夜間も同じ12,000件のメッセージが滞留している場合

    | 時間帯 | 受信する件数 | 滞留の時間の目安 | 5分以内の要件 |
    | --- | --- | --- | --- |
    | 日中 | 毎秒2,000件 | 約6秒 | 満たす |
    | 夜間 | 毎秒20件 | 約10分 | 満たさない |

    滞留の時間は、おおよそ件数を流量で割った値です。件数は同じでも、流量が少ない夜間は要件を超える遅れになっています。最も古い未確認メッセージの経過時間なら、時間帯によらず「5分を超えたら通知」という1つのしきい値で検知できます。
  diagram: |
    flowchart TD
      T["トラック 約2万台"] --> P["Pub/Sub<br/>サブスクリプション"]
      P --> D["Dataflow<br/>ストリーミング"]
      D --> B["BigQuery"]
      B --> V["配車ダッシュボード"]
      A1["アラート<br/>最も古い未確認メッセージの経過時間"] -.->|監視| P
      A2["アラート<br/>データの鮮度"] -.->|監視| D
  references:
    - title: "Dataflow のジョブの指標"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/using-monitoring-intf"
    - title: "Dataflow パイプラインで Cloud Monitoring を使用する"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/using-cloud-monitoring"
    - title: "Cloud Monitoring で Pub/Sub をモニタリングする"
      url: "https://docs.cloud.google.com/pubsub/docs/monitoring"

- id: maintain-ops-002
  domain: maintain
  services: [monitoring, dataproc]
  type: single
  question: |
    ある医療データ分析企業は、毎晩 Dataproc で Spark ジョブを実行し、病院から届く診療記録を変換しています。Spark ジョブのドライバのログは Cloud Logging に出力するよう設定済みで、形式が不正なレコードを読み飛ばすたびに `Skipped malformed record` という警告が1行出力されます。数件の読み飛ばしは許容されていますが、10分間に1,000件を超えた場合は入力ファイルの異常と考えられるため、運用チームに通知したいと考えています。

    独自のコードを書かずに、この通知を実現するにはどうすればよいですか？
  choices:
    a: "警告メッセージに一致するログベースのアラート ポリシーを作成し、該当するログが出力されるたびに運用チームに通知する"
    b: "ログシンクで警告ログを BigQuery に送り、スケジュールされたクエリで10分ごとに件数を集計して、超えたら Cloud Run functions からメールを送る"
    c: "警告メッセージに一致するカウンタ型のログベースの指標を作成し、10分間の件数が1,000件を超えたら通知するアラート ポリシーを設定する"
    d: "Dataproc クラスタの YARN のメモリ使用量にアラート ポリシーを設定し、使用量が増えたら運用チームに通知する"
  answer: [c]
  choiceNotes:
    a: "ログベースのアラートは、条件に一致するログが出力されたときに通知する仕組みで、一定時間の件数をしきい値にすることはできません。許容されている少数の読み飛ばしでも通知されてしまいます。"
    b: "実現はできますが、シンク、スケジュールされたクエリ、関数の作成と保守が必要になり、「独自のコードを書かない」という要件に反します。"
    c: "正解です。ログベースの指標は、条件に一致したログエントリの件数を Cloud Monitoring の指標として記録します。この指標にしきい値のアラート ポリシーを設定すれば、コードを書かずに「10分間で1,000件超」を検知できます。"
    d: "メモリ使用量は不正なレコードの件数とは関係がないため、入力ファイルの異常は検知できません。"
  explanation: |
    Cloud Logging のログを監視に使う方法は2つあり、通知したい条件によって使い分けます。

    | 方法 | 通知のタイミング | 向いている用途 |
    | --- | --- | --- |
    | ログベースの指標 ＋ 指標のアラート ポリシー | 件数や値がしきい値を超えたとき | 「一定時間に N 件を超えたら」などの傾向の監視 |
    | ログベースのアラート ポリシー | 条件に一致するログが出力されたとき | 重大なエラーが1件でも出たら知りたい場合 |

    **データ例**: ある晩の `Skipped malformed record` の件数が次のとおりだった場合（指標のアラートのしきい値は10分間に1,000件）

    | 時間帯 | 警告の件数 | 指標のアラート | ログベースのアラート |
    | --- | --- | --- | --- |
    | 1:00〜1:10 | 8件 | 通知しない | 通知する |
    | 1:10〜1:20 | 0件 | 通知しない | 通知しない |
    | 1:20〜1:30 | 1,630件 | 通知する | 通知する |

    ログベースのアラートは、許容されている8件の読み飛ばしでも通知します。指標のアラートなら、入力ファイルの異常が疑われる 1:20〜1:30 だけ通知できます。

    - ログベースの指標には、一致したログの件数を数える **カウンタ型** と、ログに含まれる数値（処理時間など）の分布を記録する **分布型** があります。
    - ユーザー定義のログベースの指標は、作成した時点以降に届いたログだけを集計します。過去のログには遡りません。
    - 作成した指標は、アラートだけでなく Cloud Monitoring のグラフやダッシュボードでも使えます。
  references:
    - title: "ログをモニタリングする"
      url: "https://docs.cloud.google.com/logging/docs/alerting/monitoring-logs"
    - title: "ログベースの指標の概要"
      url: "https://docs.cloud.google.com/logging/docs/logs-based-metrics"
    - title: "ログベースの指標のグラフとアラートを構成する"
      url: "https://docs.cloud.google.com/logging/docs/logs-based-metrics/charts-and-alerts"

- id: maintain-ops-003
  domain: maintain
  services: [monitoring, bigquery, cloud-storage]
  type: single
  question: |
    ある EC 企業で、顧客データが社外に持ち出された可能性があると報告されました。セキュリティ チームは、過去2週間に BigQuery の `crm.customers` テーブルのデータを読み取ったアカウントと、Cloud Storage のバケット `crm-exports` からオブジェクトをダウンロードしたアカウントを特定する必要があります。このプロジェクトでは、Cloud Storage のデータアクセス監査ログを半年前から有効にしています。ログの保持期間は既定のままです。

    最も早く調査を始めるには、どうすればよいですか？
  choices:
    a: "INFORMATION_SCHEMA.JOBS ビューの referenced_tables 列で対象テーブルを参照したジョブを検索し、実行したユーザーを確認する"
    b: "ログ エクスプローラで2つのリソースのデータアクセス監査ログを検索し、各ログエントリのプリンシパルのメールアドレスを確認する"
    c: "ログ エクスプローラで2つのリソースの管理アクティビティ監査ログを検索し、操作したプリンシパルのメールアドレスを確認する"
    d: "Cloud Monitoring で、バケットへのリクエスト数とテーブルの読み取りバイト数の推移をグラフで確認する"
  answer: [b]
  choiceNotes:
    a: "BigQuery のジョブは調べられますが、Cloud Storage からのダウンロードは調べられません。バケットにアクセスしたアカウントを特定するという要件を満たしません。"
    b: "正解です。データの読み取りやダウンロードは、データアクセス監査ログに記録されます。BigQuery のデータアクセス監査ログは既定で記録され、Cloud Storage も有効にしてあるため、1か所で両方を調べられます。"
    c: "管理アクティビティ監査ログは、リソースの作成・削除や IAM ポリシーの変更などの管理操作を記録するもので、データの読み取りやダウンロードは記録されません。"
    d: "指標からアクセス量の変化はわかりますが、誰がアクセスしたかは特定できません。"
  explanation: |
    「誰が、いつ、どのデータにアクセスしたか」の調査には **Cloud Audit Logs** を使います。

    | 監査ログ | 記録される操作 | 既定の状態 | 既定の保持期間 |
    | --- | --- | --- | --- |
    | 管理アクティビティ | リソースの作成・削除、IAM ポリシーの変更など | 常に記録 | 400日（`_Required` バケット） |
    | データアクセス | データやメタデータの読み取り、データの書き込み | BigQuery 以外は無効 | 30日（`_Default` バケット） |
    | システム イベント | Google Cloud が行ったリソースの変更 | 常に記録 | 400日（`_Required` バケット） |

    - ログ エクスプローラでは、`protoPayload.authenticationInfo.principalEmail`（操作したアカウント）や `protoPayload.resourceName`（対象のリソース）で絞り込みます。
    - データアクセス監査ログの既定の保持期間は30日です。長期間の調査に備えるには、ログシンクで BigQuery や保持期間を延ばしたログバケットに転送しておきます。
    - INFORMATION_SCHEMA.JOBS は BigQuery のジョブの分析には便利ですが、他のサービスへのアクセスは記録されません。
  references:
    - title: "Cloud Audit Logs の概要"
      url: "https://docs.cloud.google.com/logging/docs/audit"
    - title: "BigQuery の監査ログ"
      url: "https://docs.cloud.google.com/bigquery/docs/reference/auditlogs"
    - title: "データアクセス監査ログを構成する"
      url: "https://docs.cloud.google.com/logging/docs/audit/configure-data-access"

- id: maintain-ops-004
  domain: maintain
  services: [bigquery, monitoring]
  type: single
  question: |
    あるメディア企業は、BigQuery Enterprise エディションの予約（ベースライン 1,000 スロット）を、分析用のプロジェクト `media-analytics` に割り当てています。最近、平日の午前中にクエリの待ち時間が長くなっています。データ基盤チームは、過去30日間にどのユーザーがどれだけスロットを消費したか、消費の多いクエリは何かを把握し、利用者と改善を相談したいと考えています。

    追加の設定をせずに、すぐにこの分析を行うにはどうすればよいですか？
  choices:
    a: "Cloud Billing のデータを BigQuery にエクスポートし、ユーザーごとの BigQuery の料金を集計する"
    b: "データアクセス監査ログを BigQuery に送るログシンクを作成し、ジョブの完了イベントからスロット時間を集計する"
    c: "Cloud Monitoring で BigQuery のスロットの指標のダッシュボードを作成し、ユーザーごとの使用量を比較する"
    d: "INFORMATION_SCHEMA.JOBS ビューを、ユーザーやクエリごとに total_slot_ms で集計する"
  answer: [d]
  choiceNotes:
    a: "課金データは SKU やプロジェクトの単位です。容量ベースの料金（予約）では、ユーザーやクエリごとの料金にはならないため、誰が消費したかはわかりません。"
    b: "これから作成するシンクには過去のログが転送されないため、過去30日間の分析にすぐには使えません。同じ情報は INFORMATION_SCHEMA.JOBS から追加の設定なしで得られます。"
    c: "Cloud Monitoring の BigQuery の指標は、プロジェクトや予約などの単位で集計されており、ユーザーやクエリごとの内訳は確認できません。"
    d: "正解です。INFORMATION_SCHEMA.JOBS には過去180日間のジョブが記録されており、実行したユーザー、クエリ本文、消費したスロット時間（total_slot_ms）などを SQL で集計できます。追加の設定は不要です。"
  explanation: |
    BigQuery のジョブの実績は、**INFORMATION_SCHEMA のジョブのビュー** で分析するのが基本です。

    ```sql
    SELECT
      user_email,
      COUNT(*) AS jobs,
      SUM(total_slot_ms) / (1000 * 60 * 60) AS slot_hours
    FROM `region-us`.INFORMATION_SCHEMA.JOBS
    WHERE creation_time >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 30 DAY)
      AND job_type = 'QUERY'
    GROUP BY user_email
    ORDER BY slot_hours DESC;
    ```

    | ビュー | 対象・用途 |
    | --- | --- |
    | `JOBS`（`JOBS_BY_PROJECT`） | 現在のプロジェクトのすべてのジョブ |
    | `JOBS_BY_USER` | 自分が実行したジョブ |
    | `JOBS_BY_ORGANIZATION` | 組織全体のジョブ |
    | `JOBS_TIMELINE` | 1秒ごとのスロット使用量（`period_slot_ms`）。混雑した時間帯の分析に使う |

    - ビューはリージョンごとにあるため、`region-us` のようにリージョンを指定します。
    - オンデマンド料金のプロジェクトでは、`total_bytes_billed` を集計すると、ユーザーやクエリごとの料金の目安がわかります。
    - 定数だけが異なる同じ形のクエリは、`query_info.query_hashes.normalized_literals` でまとめて集計できます。
  references:
    - title: "JOBS ビュー"
      url: "https://docs.cloud.google.com/bigquery/docs/information-schema-jobs"
    - title: "JOBS_TIMELINE ビュー"
      url: "https://docs.cloud.google.com/bigquery/docs/information-schema-jobs-timeline"

- id: maintain-ops-005
  domain: maintain
  services: [bigquery]
  type: single
  question: |
    ある証券会社は、BigQuery の予約を部門ごとに分けて運用しています。データ基盤チームは毎週の運用レビューで、各予約のスロット使用量の推移と、使用量が急に増えた時間帯にどのプロジェクトやユーザーのジョブが多かったかを確認したいと考えています。レビューに参加するメンバーは SQL に慣れておらず、チームとしてもダッシュボードの作成や保守は避けたいと考えています。

    どの方法を使うべきですか？
  choices:
    a: "INFORMATION_SCHEMA.JOBS_TIMELINE ビューを集計するクエリを作成し、Looker Studio のダッシュボードで可視化する"
    b: "Cloud Billing のレポートで、BigQuery の SKU ごとの料金の推移をプロジェクト別に表示して比較する"
    c: "BigQuery のコンソールの管理リソースグラフで、予約のスロット使用量の推移をプロジェクトやユーザー別に確認する"
    d: "ログ エクスプローラで BigQuery のデータアクセス監査ログを検索し、ジョブの完了イベントを時間帯ごとに確認する"
  answer: [c]
  choiceNotes:
    a: "柔軟な分析はできますが、クエリとダッシュボードの作成・保守が必要になり、要件に反します。"
    b: "料金の推移はわかりますが、予約の料金はユーザーやジョブの単位にはならないため、使用量が増えた原因のジョブを特定できません。"
    c: "正解です。管理リソースグラフでは、スロット使用量やジョブの同時実行数などの推移を、予約・プロジェクト・ユーザーなどの単位で BigQuery のコンソール上で確認できます。SQL を書いたりダッシュボードを作成したりする必要がありません。"
    d: "個々のジョブは確認できますが、スロット使用量の推移をつかむには集計の手間がかかり、SQL に慣れていないメンバーが推移を確認するという要件に合いません。"
  explanation: |
    BigQuery の使用状況を把握する方法は、目的に応じて使い分けます。

    | 方法 | 特徴 |
    | --- | --- |
    | 管理リソースグラフ | スロット使用量、ジョブの同時実行数、ジョブの実行時間、エラーなどの推移をコンソールのグラフで確認できる |
    | 管理ジョブ エクスプローラ | 組織やプロジェクトのジョブを、状態・所有者・プロジェクト・予約などで絞り込んだり、まとめて集計したりできる |
    | INFORMATION_SCHEMA（JOBS、JOBS_TIMELINE など） | SQL で自由に集計できる。独自のレポートや定期的な分析に向く |
    | Cloud Monitoring | 指標にアラート ポリシーを設定し、しきい値を超えたときに通知できる |
    | Cloud Billing のデータのエクスポート | 料金をプロジェクト・サービス・ラベル別に分析できる |

    - グラフで使用量が増えた時間帯を見つけ、管理ジョブ エクスプローラで個々のジョブを確認する、という順に調べると効率的です。
    - 閲覧には、組織やプロジェクトのジョブと予約を参照できる権限が必要です。BigQuery リソース閲覧者（`roles/bigquery.resourceViewer`）などのロールを付与します。
    - 予約が計画どおりに使われているか（ベースラインを常に超えて自動スケーリングに頼っていないか、逆に余っていないか）を定期的に確認し、予約のサイズや割り当ての見直しにつなげます。
  references:
    - title: "健全性とリソース使用率をモニタリングする"
      url: "https://docs.cloud.google.com/bigquery/docs/admin-resource-charts"
    - title: "ジョブをモニタリングする"
      url: "https://docs.cloud.google.com/bigquery/docs/admin-jobs-explorer"
    - title: "JOBS_TIMELINE ビュー"
      url: "https://docs.cloud.google.com/bigquery/docs/information-schema-jobs-timeline"

- id: maintain-ops-006
  domain: maintain
  services: [bigquery]
  type: multiple
  question: |
    ある製造業の企業は、工場のゲートウェイから数秒ごとに届く小さな CSV ファイルを、1ファイルにつき1つの読み込みジョブで BigQuery の同じテーブル `sensor_raw` に追記しています。最近、次の2つのエラーが発生するようになりました。

    1. 読み込みジョブがときどき `rateLimitExceeded`（Exceeded rate limits: too many table update operations for this table）で失敗する
    2. 分析担当者が約30億行の全件を `ORDER BY event_time` で並べ替えて別のテーブルに書き出すクエリが、`resourcesExceeded`（The query could not be executed in the allotted memory）で失敗する

    それぞれのエラーを解消するために、どの対応を行うべきですか？
  choices:
    a: "ファイルを数分ごとにまとめて読み込むか、Storage Write API による書き込みに切り替える"
    b: "割り当てのページで、テーブルの更新操作の頻度の上限を引き上げるようリクエストし、承認を待つ"
    c: "予約のベースライン スロットを増やし、並べ替えのクエリが使えるスロットとメモリを増やす"
    d: "失敗した読み込みジョブを、間隔を空けずにすぐ再試行するようアプリケーションを変更する"
    e: "全件の並べ替えをやめ、必要なら LIMIT や条件で件数を絞ってから並べ替える"
  answer: [a, e]
  choiceNotes:
    a: "正解です。テーブルごとの更新操作（読み込みジョブ、クエリ結果の書き込みなど）には、短時間あたりの頻度の上限があります。読み込みの回数を減らすか、Storage Write API で書き込むと解消します。"
    b: "テーブルの更新操作の頻度の上限は、引き上げを申請できません。ドキュメントでも、操作をまとめる、Storage Write API に移行するなど、更新の回数を減らす対応が推奨されています。"
    c: "スロットを増やしても、全件の並べ替えに必要なメモリの問題は解消しません。クエリの書き方を見直す必要があります。"
    d: "レート制限のエラーは、すぐに再試行するとさらに制限にかかりやすくなります。再試行するなら指数バックオフで間隔を空けますが、根本的には更新の回数を減らす必要があります。"
    e: "正解です。全件を ORDER BY で並べ替えると、最後の並べ替えの段階でメモリが不足しやすくなります。結果をテーブルに書き出す場合、テーブルの行には順序がないため、全件の並べ替えはそもそも不要です。"
  explanation: |
    BigQuery のエラーは、エラーの理由（reason）から原因の種類を切り分けます。

    | reason | 主な原因 | 対応の例 |
    | --- | --- | --- |
    | `quotaExceeded` | 割り当て（カスタム割り当てを含む）を超えた | 使用量を減らす、割り当ての引き上げを申請する、リセットを待つ |
    | `rateLimitExceeded` | 短時間にリクエストや更新を送りすぎた | 頻度を下げる、まとめて処理する、指数バックオフで再試行する |
    | `resourcesExceeded` | クエリが使うリソース（メモリなど）が多すぎる | クエリを分割する、全件の ORDER BY を避ける、中間結果を減らす |
    | `backendError` | サービス側の一時的なエラー | 指数バックオフで再試行する |

    - 読み込みジョブは1回ごとにテーブルの更新操作として数えられます。小さなファイルを大量に読み込む場合は、まとめて読み込むか、Storage Write API を使います。
    - `resourcesExceeded` は、全件の ORDER BY のほか、PARTITION BY のない分析関数（ウィンドウ関数）や、非常に大きな配列・文字列の生成などでも起こります。
  references:
    - title: "エラー メッセージ"
      url: "https://docs.cloud.google.com/bigquery/docs/error-messages"
    - title: "割り当てと上限のエラーのトラブルシューティング"
      url: "https://docs.cloud.google.com/bigquery/docs/troubleshoot-quotas"
    - title: "割り当てと上限"
      url: "https://docs.cloud.google.com/bigquery/quotas"

- id: maintain-ops-007
  domain: maintain
  services: [dataproc]
  type: single
  question: |
    ある通信事業者は、Dataproc クラスタ（ワーカーは n2-standard-8）で PySpark のバッチジョブを実行し、通話記録と基地局のデータを結合しています。データ量が増えてから、ジョブが途中で失敗するようになりました。ドライバのログには、次のメッセージが繰り返し出ています。

    `Container killed by YARN for exceeding memory limits. Consider boosting spark.executor.memoryOverhead.`

    コードの変更を最小限に抑えてジョブを安定させるには、どうすればよいですか？
  choices:
    a: "セカンダリ ワーカーを追加してクラスタのワーカー数を増やし、処理をより多くのノードに分散して1台あたりの負荷を下げる"
    b: "spark.executor.memoryOverhead を増やし、必要ならメモリの多いマシンタイプに変える"
    c: "spark.executor.cores を増やし、1つのエグゼキュータで同時に実行するタスクの数を増やして処理を速く終わらせる"
    d: "ワーカーのブートディスクのサイズを増やし、シャッフルやディスクへの書き出しに使える容量を確保する"
  answer: [b]
  choiceNotes:
    a: "ノードを増やしても、1つのコンテナに割り当てられるメモリは変わりません。大きなパーティションを処理するエグゼキュータは、同じように上限を超えます。"
    b: "正解です。このエラーは、エグゼキュータのコンテナが YARN に割り当てられたメモリ（ヒープとオーバーヘッドの合計）を超えたことを示します。PySpark では Python のプロセスがオーバーヘッドの領域を使うため、オーバーヘッドを増やすのが直接の対策です。"
    c: "1つのエグゼキュータで同時に動くタスクが増えるため、エグゼキュータのメモリ不足がさらに悪化します。"
    d: "ディスクの容量はメモリの上限とは関係がないため、コンテナが強制終了される問題は解消しません。"
  explanation: |
    Dataproc で Spark ジョブがメモリ不足で失敗する場合は、**どこでメモリが足りないか** をログから切り分けます。

    | 症状 | 主な原因 | 対策の例 |
    | --- | --- | --- |
    | `Container killed by YARN for exceeding memory limits` | エグゼキュータのヒープ外のメモリ（オーバーヘッド）の不足 | `spark.executor.memoryOverhead` を増やす |
    | エグゼキュータの `java.lang.OutOfMemoryError` | エグゼキュータのヒープの不足、データの偏り | `spark.executor.memory` を増やす、パーティション数を増やす |
    | ドライバの `OutOfMemoryError` | `collect()` などで大量のデータをドライバに集めている | ドライバに集めるデータを減らす、`spark.driver.memory` を増やす |

    **データ例**: 1つのエグゼキュータが、ヒープを 8 GB、ヒープ外（Python のプロセスなど）で 2.5 GB、合わせて 10.5 GB のメモリを使う場合

    | 項目 | 変更前 | 変更後 |
    | --- | --- | --- |
    | ヒープ | 8 GB | 8 GB |
    | オーバーヘッド | 1 GB | 3 GB |
    | コンテナの上限（合計） | 9 GB | 11 GB |
    | 結果 | 上限を超え、YARN が強制終了する | 上限内に収まり、完了する |

    ヒープを上限まで使うと、ヒープ外で使えるのはオーバーヘッドの分だけです。ワーカーを増やしても1つのコンテナの上限は 9 GB のままなので、同じエラーが起きます。

    - プロパティは、ジョブの送信時（`gcloud dataproc jobs submit pyspark --properties=...`）やクラスタの作成時に指定できます。
    - ワーカーのメモリ自体が足りない場合は、highmem 系のマシンタイプに変更します。
    - 結合で一部のキーにデータが集中している場合は、パーティション数の調整やキーの分散も検討します。

    なお、最近のドキュメントでは、Dataproc（Dataproc on Compute Engine）は Managed Service for Apache Spark のクラスタ デプロイという名称になっています。試験ガイドでは Dataproc の名称が使われています。
  references:
    - title: "クラスタのプロパティ"
      url: "https://docs.cloud.google.com/dataproc/docs/concepts/configuring-clusters/cluster-properties"
    - title: "VM のメモリ不足エラーのトラブルシューティング"
      url: "https://docs.cloud.google.com/managed-spark/docs/support/troubleshoot-oom-errors"

- id: maintain-ops-008
  domain: maintain
  services: [dataflow, monitoring]
  type: single
  question: |
    ある不動産情報サイトは、毎晩 Dataflow のバッチジョブ（Java）で約2億件の物件データを正規化し、BigQuery に書き込んでいます。住所の表記をそろえる処理を追加してから、ジョブの実行時間が約2倍になりました。ワーカーの CPU 使用率は常に90%を超えていますが、エラーやホットキーの警告は出ていません。ジョブグラフで各ステップの経過時間を確認したところ、住所の表記をそろえる ParDo のステップに時間がかかっていることがわかりました。

    開発チームは、このステップのコードのうち、どのメソッドが CPU を多く使っているかを特定したいと考えています。そのためにコードを変更したり、ワーカーで手作業の調査をしたりすることは避けたいと考えています。

    どうすればよいですか？
  choices:
    a: "Cloud Monitoring の Metrics Explorer で、ワーカー VM ごとの CPU 使用率の推移を表示し、負荷の高い時間帯を特定する"
    b: "住所の表記をそろえる処理の各メソッドに、処理時間を出力するログを追加し、Cloud Logging で集計する"
    c: "Cloud Profiler を有効にするサービス オプションを指定してジョブを実行し、メソッドごとの負荷を確認する"
    d: "ワーカー VM に SSH で接続し、Java のスレッドダンプを繰り返し取得して、実行中のメソッドを集計する"
  answer: [c]
  choiceNotes:
    a: "CPU 使用率は VM 単位の指標で、どのメソッドが CPU を使っているかはわかりません。"
    b: "メソッドごとの時間はわかりますが、コードの変更が必要になり、要件に反します。"
    c: "正解です。Dataflow は Cloud Profiler と統合されており、ジョブの起動時にサービス オプションを指定するだけで、ワーカー上のコードの CPU 時間をメソッドごとに収集できます。結果はフレームグラフで確認できます。"
    d: "実行中のメソッドは調べられますが、多数のワーカーで手作業の調査が必要になり、要件に反します。"
  explanation: |
    Dataflow のパイプラインの性能の問題は、調べる範囲を絞り込みながら原因を探します。

    | 調べたいこと | 使う機能 |
    | --- | --- |
    | ジョブ全体の遅れやスループット | ジョブの指標（Cloud Monitoring、ジョブの画面のグラフ） |
    | どのステップが遅いか | ジョブグラフの各ステップの情報、ストラグラーやボトルネックの検出 |
    | ステップのコードのどこが CPU やメモリを使っているか | Cloud Profiler |
    | どのキーに処理が集中しているか | ホットキーのログ出力（Java は `--hotKeyLoggingEnabled`、Python は `--enable_hot_key_logging`） |
    | エラーの内容 | ワーカーのログ（Cloud Logging） |

    - Cloud Profiler は、ジョブの起動時にサービス オプション `enable_google_cloud_profiler` を指定して有効にします（Java は `--dataflowServiceOptions`、Python は `--dataflow_service_options`）。Java では、ヒープのプロファイリングも使えます。
    - ワーカーのサービス アカウントには、プロファイルを送信する権限（Cloud Profiler エージェントのロール `roles/cloudprofiler.agent` など）が必要です。
    - プロファイリングによる負荷は小さいため、本番のジョブでも使えます。
  references:
    - title: "Cloud Profiler を使用してパイプラインのパフォーマンスをモニタリングする"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/profiling-a-pipeline"
    - title: "Dataflow のジョブの指標"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/using-monitoring-intf"
    - title: "低速なストリーミング ジョブのトラブルシューティング"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/troubleshoot-slow-streaming-jobs"

- id: maintain-ops-009
  domain: maintain
  services: [dataflow]
  type: single
  question: |
    ある保険会社は、毎晩 Dataflow のバッチジョブで約30 TB の契約データを変換しています。通常は最大200ワーカーまで増えて2時間ほどで終わるジョブが、今週は6時間以上かかっています。ジョブのログには、リージョンの CPU の割り当て（CPUS）が不足しているため目標のワーカー数まで増やせないという `QUOTA_EXCEEDED` の警告が繰り返し記録されています。同じプロジェクトでは、最近ほかのチームが Compute Engine の VM を増やしました。データは現在のリージョンで処理する必要があります。

    パイプラインのコードを変更せずに処理時間を元に戻すには、どうすればよいですか？
  choices:
    a: "最大ワーカー数のパイプライン オプションを400に引き上げ、より多くのワーカーを使えるようにしてから実行する"
    b: "ワーカーのマシンタイプを vCPU の多いものに変更し、少ないワーカー数でも同じ処理量をこなせるようにする"
    c: "Compute Engine の CPU の割り当てをこのリージョンで引き上げるようリクエストし、承認後にジョブを実行する"
    d: "Cloud Composer の DAG にリトライを設定し、ジョブが遅れたときは自動でキャンセルして再実行する"
  answer: [c]
  choiceNotes:
    a: "最大ワーカー数を引き上げても、CPU の割り当てが不足している限りワーカーは増えません。"
    b: "1台あたりの vCPU が増えるだけで、ジョブ全体で使える vCPU の合計は割り当てで制限されたままです。"
    c: "正解です。Dataflow のワーカーは Compute Engine の VM として起動するため、プロジェクトの Compute Engine の割り当てを消費します。不足している CPU の割り当てを引き上げれば、目標のワーカー数まで増やせます。"
    d: "ジョブは割り当ての不足で遅くなっているだけです。再実行しても同じ制限にかかります。"
  explanation: |
    Dataflow のワーカーは Compute Engine の VM なので、次のような **Compute Engine の割り当て** の影響を受けます。

    | 割り当て | 不足したときの症状 |
    | --- | --- |
    | CPU（`CPUS`） | ワーカーを目標の数まで増やせない、ジョブを開始できない |
    | 使用中の IP アドレス（`IN_USE_ADDRESSES`） | 外部 IP アドレスを持つワーカーを増やせない |
    | 永続ディスク（`DISKS_TOTAL_GB`、`SSD_TOTAL_GB`） | ワーカーのディスクを作成できない |

    **データ例**: リージョンの CPU の割り当てが 2,000 vCPU で、ワーカーが n1-standard-8（8 vCPU）の場合

    | 状況・対応 | ほかの VM の vCPU | 空きの vCPU | ワーカー数 |
    | --- | --- | --- | --- |
    | 先週まで | 400 | 1,600 | 200 |
    | 今週 | 1,500 | 500 | 62 |
    | 最大ワーカー数を400にする | 1,500 | 500 | 62 |
    | n1-standard-16 に変える | 1,500 | 500 | 31 |
    | 割り当てを 3,200 に引き上げる | 1,500 | 1,700 | 200 |

    最大ワーカー数やマシンタイプを変えても、ジョブが使える vCPU は 496（62台 × 8、31台 × 16）のままです。割り当てを引き上げたときだけ、目標の200ワーカー（1,600 vCPU）まで増やせます。

    - 割り当ての使用状況は、Google Cloud コンソールの［割り当てとシステムの上限］ページで確認でき、そこから引き上げをリクエストできます。
    - ワーカーに外部 IP アドレスが不要な場合は、パブリック IP を使わない設定（Python の `--no_use_public_ips` など）にすると、外部 IP アドレスの割り当てを消費しません。この場合は、サブネットで限定公開の Google アクセスを有効にします。
    - 割り当てはプロジェクト内のほかのワークロードと共有されます。定期的に大規模なジョブを実行する場合は、余裕を持った値にしておきます。
  references:
    - title: "Dataflow の割り当てと上限"
      url: "https://docs.cloud.google.com/dataflow/quotas"
    - title: "Dataflow のエラーのトラブルシューティング"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/common-errors"

- id: maintain-ops-010
  domain: maintain
  services: [bigquery, monitoring]
  type: single
  question: |
    ある小売チェーンは、1つの請求先アカウントで約60のプロジェクトを運用しています。財務チームは、次の2つを実現したいと考えています。

    - プロジェクト、サービス、ラベル `cost-center` ごとの日々の料金を SQL で分析し、社内の予算表と結合したい
    - 分析基盤のプロジェクトの今月の料金が、計画した金額の90%と100%に達する見込みになった時点で、財務チームにメールで通知したい

    運用の手間を最小限に抑えて要件を満たすには、どうすればよいですか？
  choices:
    a: "Cloud Billing のレポートから毎日 CSV をダウンロードして BigQuery に読み込み、BigQuery のカスタム割り当てでクエリの使用量に上限を設ける"
    b: "Cloud Billing のデータの BigQuery へのエクスポートを有効にし、分析基盤のプロジェクトを対象に、予測額のしきい値を設定した予算を作成する"
    c: "各プロジェクトの INFORMATION_SCHEMA.JOBS で料金を集計し、その結果に対して Cloud Monitoring のアラート ポリシーを設定して通知する"
    d: "すべてのプロジェクトの監査ログをログシンクで BigQuery に集め、リソースの作成と削除の記録から料金を見積もって通知する"
  answer: [b]
  choiceNotes:
    a: "毎日の手作業が必要です。また、カスタム割り当ては BigQuery のクエリの使用量を制限する機能で、プロジェクト全体の料金の通知には使えません。"
    b: "正解です。課金データのエクスポートを有効にすると、料金の明細が BigQuery のテーブルに自動で書き込まれ、SQL で分析できます。予算では、実際の料金または予測額に対するしきい値（90%、100% など）を設定してメールで通知できます。"
    c: "INFORMATION_SCHEMA.JOBS からわかるのは BigQuery のジョブの情報だけで、ほかのサービスの料金は含まれません。"
    d: "監査ログには料金の情報が含まれないため、正確な料金を分析できません。仕組みの作成と保守の手間もかかります。"
  explanation: |
    料金の **分析** と **通知** は、Cloud Billing の2つの機能を組み合わせます。

    | 機能 | 用途 | ポイント |
    | --- | --- | --- |
    | 課金データの BigQuery へのエクスポート | 料金の詳細な分析 | 標準の使用料金、詳細な使用料金（リソース単位）、料金表のデータを出力できる。ラベルごとにも集計できる |
    | 予算とアラート | 計画した金額との比較と通知 | 請求先アカウント全体のほか、プロジェクト・サービス・ラベルで対象を絞れる。実際の料金または予測額に対するしきい値で通知する |

    - 予算のアラートは、既定では請求先アカウントの管理者とユーザーにメールで届きます。ほかの宛先にも送る場合は、Cloud Monitoring の通知チャネルを指定します。
    - 予算は **通知するだけで、使用を止めません**。しきい値を超えたときに自動で対処したい場合は、予算の通知を Pub/Sub に送り、Cloud Run functions などで処理します。
  references:
    - title: "Cloud Billing データを BigQuery にエクスポートする"
      url: "https://docs.cloud.google.com/billing/docs/how-to/export-data-bigquery"
    - title: "予算と予算アラートを作成、編集、削除する"
      url: "https://docs.cloud.google.com/billing/docs/how-to/budgets"

- id: maintain-ops-011
  domain: maintain
  services: [dataflow]
  type: single
  question: |
    ある配車サービスの企業は、車両の位置情報を Pub/Sub から読み取り、Dataflow のストリーミング パイプラインで車両ごとに1時間のウィンドウで走行距離を集計しています。解析処理の不具合を修正した新しいバージョンをデプロイする予定で、修正に合わせて解析のステップの名前を `ParseEvents` から `ParseVehicleEvents` に変更しました。ウィンドウの構成やコーダーは変更していません。処理中のデータと集計途中の状態を失わず、処理が止まる時間も最小限にしたいと考えています。

    どのようにデプロイすべきですか？
  choices:
    a: "同じジョブ名で --update を指定し、変更前後のステップ名の対応を transform name mapping で渡す"
    b: "実行中のジョブをドレインし、停止したことを確認してから、新しいバージョンのコードで新しいジョブを起動する"
    c: "実行中のジョブをキャンセルし、停止したら同じサブスクリプションを読み取る新しいバージョンのジョブを起動する"
    d: "gcloud dataflow jobs update-options コマンドで、実行中のジョブに新しいバージョンのコードを反映する"
  answer: [a]
  choiceNotes:
    a: "正解です。パイプラインを更新すると、新しいジョブが既存のジョブを置き換え、処理中のデータと状態を引き継ぎます。ステップの名前を変えた場合は、名前の対応を指定しないと互換性チェックで失敗します。"
    b: "データは失われませんが、ドレインでは集計途中のウィンドウがその時点で閉じられ、1時間の集計が途中の値で出力されます。新しいジョブが起動するまで処理も止まります。"
    c: "キャンセルすると、処理中のデータと集計途中の状態が失われます。"
    d: "update-options コマンドで変更できるのは、オートスケーリングの設定などの一部のオプションだけです。パイプラインのコードは変更できません。"
  explanation: |
    ストリーミング パイプラインに変更をデプロイする方法は、変更の互換性によって決まります。

    | 方法 | 処理中のデータ・状態 | 主な用途 |
    | --- | --- | --- |
    | 更新（`--update`） | 引き継ぐ | 互換性のある変更（ロジックの修正、ステップの名前の変更など） |
    | ドレインしてから新しいジョブを起動 | 処理を終えてから停止する（ウィンドウは途中で閉じる） | 互換性のない変更 |
    | キャンセルしてから新しいジョブを起動 | 失われる | データを失ってもよい場合 |

    **データ例**: 10:40 にデプロイする場合の、車両 A の 10:00〜11:00 のウィンドウ（10:40 までに 12 km、10:40 以降に 6 km 走行）

    | 方法 | 既存のジョブの出力 | 新しいジョブの出力 |
    | --- | --- | --- |
    | 更新 | なし（状態を引き継ぐ） | 11:00 すぎに 18 km |
    | ドレインして新しいジョブを起動 | 10:40 ごろに 12 km（途中で閉じる） | 11:00 すぎに 6 km |
    | キャンセルして新しいジョブを起動 | なし（12 km 分は失われる） | 11:00 すぎに 6 km |

    1時間の走行距離を 18 km の1件で正しく出力できるのは、更新だけです。ドレインでは同じウィンドウの結果が2件に分かれ、キャンセルでは途中までの集計が失われます。

    - 更新では、新しいジョブを **既存のジョブと同じ名前** で起動します。ステップの名前を変えたり削除したりした場合は、`--transformNameMapping`（Python は `--transform_name_mapping`）で対応を指定します。
    - 起動時に、状態やバッファ中のデータを引き継げるかを確かめる互換性チェックが行われます。失敗した場合は更新されず、既存のジョブがそのまま動き続けます。
    - 既存のステップへのサイド入力の追加や削除などは、互換性チェックに失敗する変更の例です。
    - サービス オプション `graph_validate_only` を指定して置き換え用のジョブを送信すると、既存のジョブを止めずに、互換性だけを事前に確かめられます。
  references:
    - title: "既存のパイプラインを更新する"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/updating-a-pipeline"
    - title: "ストリーミング パイプラインをアップグレードする"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/upgrade-guide"

- id: maintain-ops-012
  domain: maintain
  services: [dataflow, pubsub]
  type: single
  question: |
    あるエネルギー企業は、スマートメーターの計測値を Pub/Sub から読み取り、Dataflow のストリーミング パイプラインで5分間の固定ウィンドウごとに集計して BigQuery に書き込んでいます。今回、集計の単位を世帯ごとのセッション ウィンドウに変更し、出力の形式も変えることになりました。ステップの名前は変えていません。--update オプションで新しいバージョンを起動しようとしたところ、互換性チェックに失敗しました。既存のジョブがすでに Pub/Sub から読み取ったメッセージは、失わずに BigQuery まで書き込みたいと考えています。

    どうすればよいですか？
  choices:
    a: "既存のジョブをキャンセルし、停止したら同じサブスクリプションを読み取る新しいバージョンを起動する"
    b: "transform name mapping でステップ名の対応を指定し、もう一度 --update オプションで新しいジョブを起動する"
    c: "既存のジョブをドレインし、停止したら同じサブスクリプションを読み取る新しいバージョンのジョブを起動する"
    d: "同じサブスクリプションを読み取る新しいバージョンのジョブを並行して起動し、動作を確認してから既存のジョブをキャンセルする"
  answer: [c]
  choiceNotes:
    a: "キャンセルすると処理はすぐに止まり、すでに読み取って処理中だったデータは失われます。"
    b: "ステップ名の対応の指定は、ステップの名前を変えた場合の対策です。今回はステップの名前を変えていないため、指定しても互換性チェックの結果は変わりません。"
    c: "正解です。ドレインすると、既存のジョブは新しいメッセージの読み取りをやめ、すでに読み取ったデータの処理と書き込みを終えてから停止します。読み取られていないメッセージはサブスクリプションに残るため、新しいジョブが続きから処理します。"
    d: "同じサブスクリプションを2つのジョブで読み取ると、メッセージがジョブ間で分けて配信され、どちらの集計も不完全になります。既存のジョブをキャンセルした時点で、処理中のデータも失われます。"
  explanation: |
    ストリーミング ジョブを止める方法は2つあり、データの扱いが異なります。

    | 操作 | 動き | データ |
    | --- | --- | --- |
    | ドレイン | 新しいデータの読み取りをやめ、処理中のデータを最後まで処理してから停止する | 失われない。ただし未完了のウィンドウはその時点で閉じられ、途中までの集計結果が出力される |
    | キャンセル | すぐに処理を止めて停止する | 処理中・バッファ中のデータは失われる |

    - 互換性のある変更なら、まず **更新（--update）** を検討します。処理中のデータもウィンドウの状態も引き継げます。
    - 互換性のない変更では、ドレインしてから新しいジョブを起動します。ドレインによって途中で閉じられたウィンドウの結果は不完全になるため、出力側での扱いを決めておきます。
    - Dataflow には、既存のジョブを動かしたまま新しいジョブを準備し、ドレインが終わったら新しいジョブで処理を始める、自動の停止と置き換えの手順もあります。処理が止まる時間を短くできます。
    - ドレインやキャンセルで停止したジョブは再開できません。処理を続けるには新しいジョブを起動します。
  diagram: |
    flowchart TD
      S["ストリーミング ジョブに<br/>変更をデプロイ"] --> Q1{"互換性のある<br/>変更か"}
      Q1 -->|はい| U["--update で更新<br/>状態を引き継ぐ"]
      Q1 -->|いいえ| Q2{"処理中のデータを<br/>失ってよいか"}
      Q2 -->|いいえ| D["ドレインしてから<br/>新しいジョブを起動"]
      Q2 -->|はい| C["キャンセルしてから<br/>新しいジョブを起動"]
  references:
    - title: "実行中のパイプラインを停止する"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/stopping-a-pipeline"
    - title: "ストリーミング パイプラインをアップグレードする"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/upgrade-guide"

- id: maintain-ops-013
  domain: maintain
  services: [dataflow, pubsub, bigquery]
  type: single
  question: |
    あるオンラインゲーム企業は、プレイヤーの行動イベントを Pub/Sub から読み取り、Dataflow のストリーミング パイプラインでプレイヤーごとのセッションの状態を保持しながら集計しています。来週、集計ロジックを大きく改修した新しいバージョンに更新する予定です。新しいバージョンで問題が見つかった場合に、更新直前のパイプラインの状態と、その時点で未処理だった Pub/Sub のメッセージから、元のバージョンで処理をやり直せるようにしておきたいと考えています。

    更新の前に、何をしておくべきですか？
  choices:
    a: "Pub/Sub のサブスクリプションのスナップショットだけを作成し、問題が起きたらそこへシークしてから元のバージョンのジョブを起動する"
    b: "既存のジョブをドレインして集計途中の結果を BigQuery に書き出し、問題が起きたらそのテーブルを読み込むジョブを起動する"
    c: "出力先の BigQuery テーブルのスナップショットを作成し、問題が起きたらテーブルを復元してから元のバージョンのジョブを起動する"
    d: "Pub/Sub のソースも含めて Dataflow のスナップショットを作成し、問題が起きたらそこから元のバージョンのジョブを作成する"
  answer: [d]
  choiceNotes:
    a: "メッセージは再処理できますが、パイプラインが保持していたプレイヤーごとのセッションの状態は保存されないため、集計途中の状態が失われます。"
    b: "途中の結果をテーブルに書き出しても、パイプラインの状態としては復元できません。また、ドレインした時点で処理が止まります。"
    c: "出力先のテーブルは元に戻せますが、パイプラインが保持していた状態は復元できません。"
    d: "正解です。Dataflow のスナップショットは、ストリーミング パイプラインの状態を保存します。Pub/Sub のソースのスナップショットも同時に作成すると、状態と未処理のメッセージをそろえて、その時点から処理を再開できます。"
  explanation: |
    **Dataflow のスナップショット** は、ストリーミング パイプラインの状態を保存する機能です。

    - スナップショットから新しいジョブを作成すると、保存した状態から処理を始められます。バックアップと復旧、更新のテストや取り消し（ロールバック）などに使います。
    - Pub/Sub をソースにしている場合は、ソースのスナップショットも同時に作成すると（`--snapshot-sources=true`）、パイプラインの状態と未処理のメッセージをそろえて保存できます。
    - スナップショットには有効期限（TTL）があり、既定は7日、最長は30日です。ただし、同時に作成した Pub/Sub のスナップショットは7日以内に期限が切れます。
    - スナップショットからジョブを作成するには、ジョブの起動時に `--createFromSnapshot`（Python は `--create_from_snapshot`）でスナップショットを指定し、Streaming Engine を有効にします。
    - スナップショットの作成中は、ジョブの処理が一時的に止まります。

    ```bash
    gcloud dataflow snapshots create \
      --job-id=JOB_ID --region=REGION \
      --snapshot-sources=true --snapshot-ttl=7d
    ```

    | 機能 | 保存されるもの |
    | --- | --- |
    | Dataflow のスナップショット | パイプラインの状態（ウィンドウや集計途中の値など）。ソースのスナップショットも作成できる |
    | Pub/Sub のスナップショット | サブスクリプションの確認応答の状態（未処理のメッセージ） |
    | BigQuery のテーブル スナップショット | テーブルのある時点のデータ |

    **データ例**: 更新の直前に、プレイヤー P1 のセッションで3件のイベントを集計済みで、ほかに2件のメッセージが未処理だった場合

    | 戻し方 | 元のバージョンで再開したときの P1 のセッション |
    | --- | --- |
    | Dataflow のスナップショット（ソースを含む） | 3件の状態 ＋ 未処理の2件 ＝ 5件 |
    | Pub/Sub のスナップショットだけ | 状態がないため、未処理の2件だけ（3件分が抜ける） |
    | BigQuery のテーブル スナップショット | 状態も未処理のメッセージも戻らない |

    状態と未処理のメッセージを同じ時点にそろえて戻せるのは、ソースを含めた Dataflow のスナップショットだけです。
  references:
    - title: "Dataflow スナップショットを使用する"
      url: "https://docs.cloud.google.com/dataflow/docs/guides/using-snapshots"
    - title: "gcloud dataflow snapshots create"
      url: "https://docs.cloud.google.com/sdk/gcloud/reference/dataflow/snapshots/create"

- id: maintain-ops-014
  domain: maintain
  services: [pubsub]
  type: single
  question: |
    ある小売企業は、注文イベントを Pub/Sub で配信し、GKE 上のサブスクライバーが受信して在庫データベースを更新しています。本日10時にデプロイしたサブスクライバーの不具合により、10時から13時までに受信したメッセージは、在庫数を誤って計算したうえで確認応答（ack）されていました。不具合を修正したバージョンはすでにデプロイしています。サブスクリプションでは確認応答済みのメッセージを保持する設定（保持期間7日）を有効にしていますが、トピックのメッセージ保持は設定していません。在庫の更新処理は、同じメッセージを再処理しても結果が変わらないように作られています。

    10時以降のメッセージを再処理するには、どうすればよいですか？
  choices:
    a: "サブスクリプションのスナップショットを今すぐ作成し、作成したスナップショットにサブスクリプションをシークする"
    b: "サブスクリプションを本日10時の時刻にシークし、10時以降に公開されたメッセージを未確認の状態に戻して再配信させる"
    c: "同じトピックに新しいサブスクリプションを作成し、修正したサブスクライバーで新しいサブスクリプションから受信する"
    d: "サブスクリプションにデッドレター トピックを設定し、10時以降のメッセージをデッドレター トピックから再処理する"
  answer: [b]
  choiceNotes:
    a: "今作成したスナップショットは、現時点の確認応答の状態を記録するだけです。10時から13時に確認応答されたメッセージは、未確認の状態に戻りません。"
    b: "正解です。時刻を指定してシークすると、その時刻より後に公開されてサブスクリプションに保持されているメッセージが未確認の状態に戻り、再配信されます。確認応答済みのメッセージを保持しているので、10時以降のメッセージを再処理できます。"
    c: "トピックでメッセージを保持していないため、新しいサブスクリプションは作成後に公開されたメッセージだけを受信します。過去のメッセージは再処理できません。"
    d: "デッドレター トピックは、配信の試行回数の上限を超えたメッセージを転送する機能です。すでに確認応答されたメッセージは転送されません。"
  explanation: |
    Pub/Sub の **シーク** を使うと、サブスクリプションのメッセージの確認応答の状態をまとめて変更し、再処理や読み飛ばしができます。

    | シークの対象 | 動き | 必要な準備 |
    | --- | --- | --- |
    | 時刻 | 指定した時刻より後に公開されたメッセージを未確認に、前のメッセージを確認済みにする | 過去のメッセージを再処理するには、サブスクリプションの確認応答済みメッセージの保持か、トピックのメッセージ保持が必要 |
    | スナップショット | スナップショットを作成した時点の確認応答の状態に戻す | 事前にスナップショットを作成しておく |

    **データ例**: 13:00 に修正版をデプロイし、14:00 にサブスクリプションを 10:00 の時刻にシークする場合

    | 公開時刻 | シーク前 | シーク後 |
    | --- | --- | --- |
    | 9:50 | 正しく処理して確認済み | 確認済みのまま |
    | 10:20 | 誤って処理して確認済み | 未確認に戻り、再配信される |
    | 13:30 | 修正版で処理して確認済み | 未確認に戻り、再配信される |

    10:00〜13:00 に誤って処理した注文は、修正版でもう一度処理されます。13:30 のように正しく処理済みの注文も再配信されますが、処理が冪等なので在庫数は変わりません。

    - サブスクライバーの新しいバージョンをデプロイする前にスナップショットを作成しておくと、不具合が見つかったときにデプロイ前の状態に戻せます。
    - スナップショットの有効期限は最長7日で、作成時点で最も古い未確認メッセージの経過時間の分だけ短くなります。
    - シークすると同じメッセージが再び配信されるため、サブスクライバーの処理は冪等にしておきます。
  references:
    - title: "メッセージの再生と破棄の概要"
      url: "https://docs.cloud.google.com/pubsub/docs/replay-overview"
    - title: "gcloud pubsub subscriptions seek"
      url: "https://docs.cloud.google.com/sdk/gcloud/reference/pubsub/subscriptions/seek"

- id: maintain-ops-015
  domain: maintain
  services: [bigquery, migration]
  type: single
  question: |
    ある銀行は、BigQuery のマネージド障害復旧を構成しています。Enterprise Plus エディションのフェイルオーバー予約は、プライマリを東京（asia-northeast1）、セカンダリを大阪（asia-northeast2）に置き、重要なデータセットはこの予約に関連付けて大阪にレプリケーションしています。ある日、東京リージョン全体で長時間の障害が発生しました。直近の数分間に書き込まれたデータが失われることは許容されており、できるだけ早く大阪でデータの更新と分析を再開したいと考えています。

    どうすればよいですか？
  choices:
    a: "大阪のフェイルオーバー予約でソフト フェイルオーバーを実行し、未反映の書き込みが大阪に届くのを待つ"
    b: "東京で作成しておいたテーブル スナップショットから、大阪のデータセットにテーブルを復元する"
    c: "大阪のフェイルオーバー予約でハード フェイルオーバーを実行し、大阪の予約とデータセットをプライマリに切り替える"
    d: "大阪に新しいデータセットを作成し、BigQuery Data Transfer Service で東京のデータセットをコピーする"
  answer: [c]
  choiceNotes:
    a: "ソフト フェイルオーバーは、確定済みの書き込みがすべてセカンダリに届くまで待つため、両方のリージョンが利用できる必要があります。東京が停止している状況では完了しません。"
    b: "テーブル スナップショットはベーステーブルと同じリージョンにあるため、東京が停止している間は使えません。"
    c: "正解です。ハード フェイルオーバーは、レプリケーションが済んでいない書き込みを待たずに、セカンダリをプライマリに切り替えます。プライマリのリージョンが停止していても実行でき、直近のデータの損失を許容する今回の要件に合います。"
    d: "コピー元の東京のデータセットにアクセスできないため、コピーできません。"
  explanation: |
    **マネージド障害復旧**（managed disaster recovery）は、BigQuery の Enterprise Plus エディションの機能で、コンピューティング容量（予約）とデータをまとめて別のリージョンに切り替えます。

    - **フェイルオーバー予約**：プライマリとセカンダリのリージョンを持つ予約です。予約に関連付けたデータセットは、レプリカを個別に昇格するのではなく、予約のフェイルオーバーで予約と一緒に切り替わります。
    - **クロスリージョン データセット レプリケーション**：データセットをセカンダリのリージョンに非同期でレプリケーションします。セカンダリのレプリカは読み取り専用です。

    | フェイルオーバーの種類 | 動き | 使う場面 |
    | --- | --- | --- |
    | ソフト フェイルオーバー | 確定済みの書き込みがすべてセカンダリに届いてから切り替える。データは失われない | 両方のリージョンが使える計画的な切り替えや訓練 |
    | ハード フェイルオーバー | レプリケーションを待たずにすぐ切り替える。直近の書き込みが失われる可能性がある | プライマリのリージョンの障害 |

    - フェイルオーバーは、セカンダリのリージョンにある予約に対して実行します。
    - レプリケーションは非同期のため、RPO はゼロにはなりません。
    - テーブル スナップショットはベーステーブルと同じリージョンに作成されるため、リージョン全体の障害への備えにはなりません。
  diagram: |
    flowchart TD
      subgraph TKY["東京（プライマリ）"]
        R1["フェイルオーバー予約"]
        D1["データセット"]
      end
      subgraph OSK["大阪（セカンダリ）"]
        R2["フェイルオーバー予約"]
        D2["データセットのレプリカ"]
      end
      D1 -.->|非同期レプリケーション| D2
      OP["運用チーム"] -->|ハード フェイルオーバー| R2
      R2 --> P["大阪がプライマリになり<br/>更新と分析を再開"]
  references:
    - title: "マネージド障害復旧"
      url: "https://docs.cloud.google.com/bigquery/docs/managed-disaster-recovery"
    - title: "クロスリージョン データセット レプリケーション"
      url: "https://docs.cloud.google.com/bigquery/docs/data-replication"

- id: maintain-ops-016
  domain: maintain
  services: [cloud-sql, bigtable, spanner]
  type: multiple
  question: |
    ある旅行予約サービスの企業は、東京（asia-northeast1）を主なリージョンとして、次の構成でサービスを運用しています。

    - 会員情報：Cloud SQL for MySQL（高可用性構成）。大阪（asia-northeast2）にクロスリージョン リードレプリカを作成済み
    - 閲覧履歴：Bigtable のインスタンス（東京と大阪にクラスタを置いてレプリケーション）。アプリケーションは、東京のクラスタに要求を送る単一クラスタ ルーティングのアプリ プロファイルを使用
    - 予約の確定処理：Spanner のインスタンス（東京と大阪に読み書きレプリカ、別のリージョンにウィットネス レプリカを置くマルチリージョン構成）

    東京リージョン全体で障害が発生しました。大阪でサービスを続けるために、運用チームが行う必要がある操作はどれですか？
  choices:
    a: "Cloud SQL の高可用性構成で手動フェイルオーバーを実行し、スタンバイのインスタンスに切り替える"
    b: "Spanner のインスタンス構成を大阪のリージョン構成に変更し、データを大阪に移す"
    c: "Cloud SQL の大阪のリードレプリカを昇格し、アプリケーションの接続先を切り替える"
    d: "Bigtable のバックアップから大阪に新しいインスタンスを作成し、アプリケーションの接続先を切り替える"
    e: "Bigtable のアプリ プロファイルを変更し、要求を大阪のクラスタに送るようにする"
  answer: [c, e]
  choiceNotes:
    a: "高可用性構成のスタンバイは同じリージョンの別のゾーンにあるため、リージョン全体の障害には対応できません。"
    b: "マルチリージョン構成の Spanner は、1つのリージョンが停止しても、残りのリージョンで新しいリーダーが自動で選ばれて処理を続けます。構成を変更する必要はありません。"
    c: "正解です。クロスリージョン リードレプリカは自動では昇格しません。昇格すると読み書きできる独立したインスタンスになるため、アプリケーションの接続先を切り替えます。"
    d: "大阪のクラスタにはすでにデータがレプリケーションされているため、バックアップから新しいインスタンスを作成する必要はありません。復元に時間がかかり、バックアップ以降のデータも失われます。"
    e: "正解です。単一クラスタ ルーティングでは、指定したクラスタが使えなくなっても自動では切り替わりません。アプリ プロファイルを変更して、大阪のクラスタに要求を送ります。"
  explanation: |
    リージョンの障害では、**自動で切り替わるもの** と **手動の操作が必要なもの** を区別しておくことが重要です。

    | サービス・構成 | リージョン障害時の動き | 必要な操作 |
    | --- | --- | --- |
    | Cloud SQL の高可用性構成 | 同じリージョン内の別ゾーンのスタンバイに自動でフェイルオーバー（ゾーン障害向け） | リージョン障害には対応しない |
    | Cloud SQL のクロスリージョン リードレプリカ | 自動では切り替わらない | レプリカを昇格し、接続先を切り替える |
    | Bigtable（単一クラスタ ルーティング） | 自動では切り替わらない | アプリ プロファイルの送信先のクラスタを変更する |
    | Bigtable（マルチクラスタ ルーティング） | 使用できる最も近いクラスタに自動で切り替わる | 不要 |
    | Spanner のマルチリージョン構成 | 残りのリージョンで自動で処理を続ける | 不要 |

    - Bigtable のレプリケーションは結果整合性のため、障害の直前に書き込まれたデータが、まだ大阪に届いていない可能性があります。
    - 単一クラスタ ルーティングは、書き込んだ直後に最新の値を読みたい（read-your-writes）場合や、単一行トランザクションを使う場合に選びます。その代わり、フェイルオーバーは手動になります。
    - Cloud SQL Enterprise Plus エディションでは、クロスリージョンのレプリカを障害復旧（DR）レプリカとして指定し、フェイルオーバーやスイッチオーバーの操作で切り替える方法もあります。
  diagram: |
    flowchart TD
      X["東京リージョンの障害"] --> S1["Cloud SQL"]
      X --> S2["Bigtable"]
      X --> S3["Spanner"]
      S1 -->|手動| A1["大阪のリードレプリカを<br/>昇格し接続先を変更"]
      S2 -->|手動| A2["アプリ プロファイルを<br/>大阪のクラスタに変更"]
      S3 -->|自動| A3["大阪で処理を継続<br/>操作は不要"]
  references:
    - title: "リージョンの移行や障害復旧のためにレプリカを昇格する"
      url: "https://docs.cloud.google.com/sql/docs/mysql/replication/cross-region-replicas"
    - title: "アプリ プロファイルの概要"
      url: "https://docs.cloud.google.com/bigtable/docs/app-profiles"
    - title: "Spanner のレプリケーション"
      url: "https://docs.cloud.google.com/spanner/docs/replication"

- id: maintain-ops-017
  domain: maintain
  services: [bigquery]
  type: multiple
  question: |
    ある保険会社は、BigQuery の `claims.payments` テーブル（約5 TB）で保険金の支払い記録を管理しています。データセットのタイムトラベル期間は既定の7日間です。次の2つの要件があります。

    - 昨日、誤った UPDATE 文で一部の行の支払額が書き換えられた。UPDATE を実行する直前のデータを取り出して、正しい値に戻したい
    - 監査対応のため、毎月末時点のテーブルの状態を読み取り専用で1年間保持したい。保存コストはできるだけ抑えたい

    それぞれの要件を満たすために、どの方法を使うべきですか？
  choices:
    a: "Cloud カスタマーケアに連絡し、フェイルセーフのデータから UPDATE の実行前の状態を復元してもらう"
    b: "FOR SYSTEM_TIME AS OF で UPDATE の実行前の時刻を指定してテーブルを読み取り、正しい値を取り出す"
    c: "データセットのタイムトラベル期間を365日に延ばし、月末時点の状態はタイムトラベルで参照する"
    d: "毎月末にテーブル スナップショットを作成し、有効期限を1年後に設定する"
    e: "毎月末に CREATE TABLE ... COPY でテーブルのコピーを作成し、1年後に削除する"
  answer: [b, d]
  choiceNotes:
    a: "フェイルセーフは、タイムトラベル期間を過ぎた削除済みのデータを、緊急時にテーブル単位で復元するための仕組みです。昨日の変更はタイムトラベルで自分で参照できるため、依頼する必要はありません。"
    b: "正解です。タイムトラベル期間（ここでは7日間）内であれば、FOR SYSTEM_TIME AS OF で過去の時点のデータを参照できます。取り出した値で元のテーブルを修正します。"
    c: "タイムトラベル期間は最長7日間で、365日には延ばせません。"
    d: "正解です。テーブル スナップショットは読み取り専用で、ベーステーブルとの差分だけが保存料金の対象になります。有効期限を設定すれば、1年後に自動で削除されます。"
    e: "テーブルのコピーは読み取り専用ではなく、テーブル全体の容量が毎回保存料金の対象になるため、スナップショットよりコストがかかります。"
  explanation: |
    BigQuery でデータの誤更新や削除に備える機能を整理します。

    | 機能 | 期間 | 復元の方法 | 用途 |
    | --- | --- | --- | --- |
    | タイムトラベル | 2〜7日（データセットごとに設定、既定は7日） | `FOR SYSTEM_TIME AS OF` で参照する。削除したテーブルはコピーで復元する | 直近の誤操作からの復旧 |
    | フェイルセーフ | タイムトラベル期間の後の7日 | Cloud カスタマーケアに依頼する（テーブル単位） | 削除したテーブルなどの緊急時の復旧 |
    | テーブル スナップショット | 任意（有効期限を設定できる） | スナップショットからテーブルを作成する | 特定の時点の長期保持 |

    ```sql
    -- 誤った UPDATE の前の状態を参照する
    SELECT *
    FROM claims.payments
      FOR SYSTEM_TIME AS OF TIMESTAMP '2026-10-17 09:00:00+09:00';

    -- 月末時点のスナップショットを作成する
    CREATE SNAPSHOT TABLE claims.payments_202609
    CLONE claims.payments
    OPTIONS (expiration_timestamp = TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL 365 DAY));
    ```

    - スナップショットの作成時に `FOR SYSTEM_TIME AS OF` を付けると、タイムトラベル期間内の過去の時点のスナップショットも作成できます。
    - 毎月のスナップショットの作成は、スケジュールされたクエリなどで自動化できます。
    - 物理ストレージの課金モデルでは、タイムトラベル期間を短くすると保存料金を減らせますが、その分だけ復旧できる期間も短くなります。
  references:
    - title: "タイムトラベルとフェイルセーフによるデータ保持"
      url: "https://docs.cloud.google.com/bigquery/docs/time-travel"
    - title: "テーブル スナップショットの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/table-snapshots-intro"

- id: maintain-ops-018
  domain: maintain
  services: [cloud-storage]
  type: single
  question: |
    ある放送局は、番組の素材ファイルを Cloud Storage のバケットに保存しています。このバケットでは、オブジェクトのバージョニングは無効で、削除（復元可能）のポリシーが保持期間7日で有効になっています。3日前に、整理用のスクリプトの不具合で `raw/2026/` 以下の約2万個のオブジェクトが削除されていたことがわかりました。

    削除されたオブジェクトをできるだけ早く元に戻すには、どうすればよいですか？
  choices:
    a: "バケットのオブジェクトのバージョニングを有効にし、`raw/2026/` 以下の最新でないバージョンを最新のバージョンに戻す"
    b: "Cloud カスタマーケアに連絡し、削除されたオブジェクトを Google が保持するバックアップから復元してもらう"
    c: "バケットに保持ポリシーを設定してロックし、`raw/2026/` 以下のオブジェクトがこれ以上削除されないようにする"
    d: "gcloud storage restore コマンドで、`raw/2026/` 以下の削除されたオブジェクトを一括で復元する"
  answer: [d]
  choiceNotes:
    a: "バージョニングは、有効にした後に上書き・削除されたオブジェクトだけを最新でないバージョンとして残します。3日前に削除されたオブジェクトは対象になりません。"
    b: "削除（復元可能）状態のオブジェクトは利用者が自分で復元できるため、サポートに依頼する必要はありません。"
    c: "保持ポリシーは今後の削除を防ぐ設定で、すでに削除されたオブジェクトは元に戻りません。"
    d: "正解です。削除（復元可能）が有効なバケットでは、削除されたオブジェクトが保持期間のあいだ残っており、restore コマンドで復元できます。ワイルドカードを使えば、プレフィックス以下をまとめて復元できます。"
  explanation: |
    Cloud Storage でオブジェクトの誤削除や上書きに備える機能を整理します。

    | 機能 | 内容 | 復元・保護の方法 |
    | --- | --- | --- |
    | 削除（復元可能）（soft delete） | 削除や上書きで失われたオブジェクトを保持期間のあいだ残す。新しいバケットでは既定で有効（7日） | `gcloud storage restore` などで復元する |
    | オブジェクトのバージョニング | 上書き・削除された古い世代を、最新でないバージョンとして残す | 最新でないバージョンを最新のバージョンに戻す |
    | 保持ポリシー・オブジェクトの保持 | 指定した期間、削除や上書きを禁止する | 削除そのものを防ぐ |

    ```bash
    gcloud storage restore "gs://BUCKET/raw/2026/**" --async
    ```

    - `--async` を付けると、一括復元のオペレーションとして非同期に実行されます。削除された時刻や作成された時刻で、復元するオブジェクトを絞り込むこともできます。
    - 削除（復元可能）の保持期間は変更でき、無効にもできます。保持期間中のオブジェクトにも保存料金がかかります。
    - バージョニングを有効にしたバケットでは、ライフサイクル ルールで最新でないバージョンの数や保持日数を制限して、コストを抑えます。
  references:
    - title: "削除（復元可能）"
      url: "https://docs.cloud.google.com/storage/docs/soft-delete"
    - title: "オブジェクトのバージョニング"
      url: "https://docs.cloud.google.com/storage/docs/object-versioning"

- id: maintain-ops-019
  domain: maintain
  services: [cloud-sql]
  type: single
  question: |
    ある決済サービスの企業は、Cloud SQL for PostgreSQL（高可用性構成、自動バックアップとポイントインタイム リカバリが有効、リードレプリカ1台）で取引データを管理しています。本日の日本時間14時32分、運用担当者が誤って WHERE 句のない DELETE 文を `transactions` テーブルに実行してしまいました。原因の調査のため、現在のインスタンスはそのまま残しておく必要があります。14時32分の直前のデータを、データの損失を最小限に抑えて取り出したいと考えています。

    どうすればよいですか？
  choices:
    a: "ポイントインタイム リカバリで14時31分を指定し、インスタンスのクローンを作成する"
    b: "昨夜の自動バックアップを現在のインスタンスに復元し、削除前のデータを取り戻す"
    c: "高可用性構成の手動フェイルオーバーを実行し、スタンバイだったインスタンスからデータを取り出す"
    d: "リードレプリカを昇格してスタンドアロンのインスタンスにし、そこから削除前のデータを取り出す"
  answer: [a]
  choiceNotes:
    a: "正解です。ポイントインタイム リカバリでは、バックアップとトランザクション ログを使って、指定した時刻の状態を新しいインスタンスとして作成します。現在のインスタンスには影響せず、誤操作の直前までのデータを取り出せます。"
    b: "バックアップを復元すると現在のインスタンスのデータが上書きされ、調査のために残すという要件に反します。また、昨夜のバックアップ以降の取引も失われます。"
    c: "スタンバイには変更が同期的に複製されているため、DELETE も反映されています。誤った操作からの復旧には使えません。"
    d: "リードレプリカにも DELETE が反映されているため、削除前のデータは取り出せません。"
  explanation: |
    Cloud SQL のデータを守る仕組みは、それぞれ備えられる障害の種類が異なります。

    | 仕組み | 備えられる障害 | 誤った操作からの復旧 |
    | --- | --- | --- |
    | 高可用性構成 | ゾーンの障害 | できない（変更はスタンバイにも反映される） |
    | リードレプリカ | 読み取り負荷の分散、リージョンの障害（クロスリージョンの場合） | できない（変更はレプリカにも反映される） |
    | 自動バックアップ・オンデマンド バックアップ | データの損失 | バックアップを取得した時点に戻せる |
    | ポイントインタイム リカバリ | 誤った操作によるデータの破損 | ログの保持期間内の任意の時点に戻せる |

    ```bash
    gcloud sql instances clone payments-db payments-db-recovery \
      --point-in-time='2026-10-18T05:31:00Z'
    ```

    - ポイントインタイム リカバリは、元のインスタンスを上書きせず、**新しいインスタンス** として作成します。必要なデータを新しいインスタンスから取り出し、元のインスタンスに戻します。
    - 時刻は UTC で指定します（例の 05:31 UTC は日本時間の14時31分）。
    - バックアップをインスタンスに復元すると、復元先のインスタンスのデータは上書きされます。
  references:
    - title: "ポイントインタイム リカバリ（PITR）を実行する"
      url: "https://docs.cloud.google.com/sql/docs/postgres/backup-recovery/pitr"
    - title: "gcloud sql instances clone"
      url: "https://docs.cloud.google.com/sdk/gcloud/reference/sql/instances/clone"

- id: maintain-ops-020
  domain: maintain
  services: [memorystore]
  type: single
  question: |
    あるチケット販売の企業は、Web アプリケーションのセッション情報を Memorystore for Redis の Standard Tier のインスタンスに保存しています。来月の大型販売の前に、プライマリ ノードに障害が起きてもアプリケーションが自動で再接続し、販売を続けられることを確認したいと考えています。テストはステージング環境の同じ構成のインスタンスで行い、テスト中のデータの損失はできるだけ抑えたいと考えています。

    どうすればよいですか？
  choices:
    a: "gcloud redis instances failover コマンドを、データ保護モードに force-data-loss を指定して実行する"
    b: "gcloud redis instances failover コマンドを、既定のデータ保護モードで実行する"
    c: "インスタンスを削除して同じ名前で作成し直し、アプリケーションが新しいインスタンスに再接続することを確認する"
    d: "データを RDB ファイルとして Cloud Storage にエクスポートし、別のインスタンスにインポートしてから接続先を切り替える"
  answer: [b]
  choiceNotes:
    a: "このモードはデータの損失を防ぐ確認をせずにフェイルオーバーするため、大量のデータが失われる可能性があります。データの損失を抑えるという要件に反します。"
    b: "正解です。Standard Tier では、手動フェイルオーバーでプライマリとレプリカを入れ替え、障害時と同じ切り替えを試せます。既定のモード（limited-data-loss）は、レプリカとの差がシステムで定めた範囲を超えている場合はフェイルオーバーを中止し、データの損失を抑えます。"
    c: "インスタンスを作り直すとデータがすべて失われます。また、フェイルオーバーとは異なる動きのため、障害時の切り替えの確認になりません。"
    d: "エクスポートとインポートは、データの移行やバックアップのための操作です。フェイルオーバーの動きの確認にはなりません。"
  explanation: |
    Memorystore for Redis の可用性の構成を整理します。

    | 構成 | 構成要素 | 障害時の動き |
    | --- | --- | --- |
    | Basic Tier | 単一のノード | レプリカがないため、障害時はデータが失われ、復旧するまで使えない |
    | Standard Tier | プライマリと、別のゾーンのレプリカ | プライマリの障害時に、レプリカへ自動でフェイルオーバーする |
    | Memorystore for Redis Cluster | 複数のシャード（各シャードにプライマリと、必要な数のレプリカ） | レプリカを持つシャードは、レプリカへ自動でフェイルオーバーする。シャードを増やして容量と処理量を拡張できる |

    - Standard Tier では、リードレプリカを追加して読み取りの負荷を分散することもできます。
    - フェイルオーバー中は短時間接続が切れるため、クライアントは再接続と再試行をするように作っておきます。手動フェイルオーバーは、その動作を本番の前に確認するのに役立ちます。
    - レプリカを持つ Redis Cluster では、シャードのプライマリとレプリカが複数のゾーンに分散して配置され、ゾーンの障害に備えられます。
  references:
    - title: "手動フェイルオーバーについて"
      url: "https://docs.cloud.google.com/memorystore/docs/redis/about-manual-failover"
    - title: "手動フェイルオーバーを開始する"
      url: "https://docs.cloud.google.com/memorystore/docs/redis/initiate-manual-failover"
    - title: "Memorystore for Redis Cluster の概要"
      url: "https://docs.cloud.google.com/memorystore/docs/cluster/memorystore-for-redis-cluster-overview"

- id: maintain-ops-021
  domain: maintain
  services: [composer, cloud-storage, migration, cloud-sql]
  type: single
  question: |
    ある物流企業は、東京（asia-northeast1）の Cloud Composer 3 の環境で、数百の DAG を使って配送データのパイプラインを管理しています。東京リージョン全体が使えなくなった場合でも、数時間以内に大阪（asia-northeast2）でワークフローの実行を再開したいと考えています。再開後も、DAG の実行履歴、Airflow の変数と接続、環境に追加した PyPI パッケージを引き継ぐ必要があります。運用の手間はできるだけ抑えたいと考えています。

    どのように準備すべきですか？
  choices:
    a: "環境のバケットの DAG フォルダを Storage Transfer Service で毎日大阪のバケットにコピーし、障害時は大阪に作成した環境に DAG を配置する"
    b: "環境を高い復元性（high resilience）のモードで作成し、Airflow データベースやスケジューラを複数のゾーンに分散させる"
    c: "スケジュールされたスナップショットを有効にして東京以外のロケーションのバケットに保存し、障害時は大阪の環境に最新のスナップショットを読み込む"
    d: "Airflow データベースの Cloud SQL インスタンスに大阪のクロスリージョン リードレプリカを追加し、障害時にレプリカを昇格する"
  answer: [c]
  choiceNotes:
    a: "DAG のファイルは引き継げますが、Airflow データベースにある実行履歴、変数、接続や、PyPI パッケージの設定は引き継げません。"
    b: "高い復元性のモードは、同じリージョン内のゾーンの障害に備える構成です。リージョン全体の障害には対応できません。"
    c: "正解です。環境のスナップショットには、Airflow データベースのバックアップ（DAG の実行履歴、変数、接続など）、環境の設定（PyPI パッケージ、環境変数など）、環境のバケットの DAG やプラグインが含まれます。別のリージョンの環境に読み込めば、まとめて引き継げます。"
    d: "Airflow データベースは Cloud Composer が管理するテナント プロジェクトにあり、利用者がレプリカを追加することはできません。"
  explanation: |
    Cloud Composer の環境の障害復旧には、**環境のスナップショット** を使います。

    1. 東京の環境でスケジュールされたスナップショットを有効にし、東京以外のロケーション（マルチリージョンや大阪など）のバケットに定期的に保存する
    2. 大阪に、復旧用の環境を用意する（あらかじめ作成しておくか、障害時に作成する）
    3. 障害時に、大阪の環境に最新のスナップショットを読み込む

    ```bash
    gcloud composer environments snapshots load ENV_OSAKA \
      --location=asia-northeast2 \
      --snapshot-path=gs://BUCKET/snapshots/SNAPSHOT_FOLDER
    ```

    | スナップショットに含まれるもの | 例 |
    | --- | --- |
    | Airflow データベースのバックアップ | DAG の実行履歴、タスクの状態、変数、接続 |
    | 環境の設定 | PyPI パッケージ、環境変数、Airflow の構成のオーバーライド |
    | 環境のバケットのデータ | DAG、プラグイン、データ フォルダ |

    - 復旧用の環境をあらかじめ作成しておく方法（ウォーム DR）は、環境の作成を待たないため早く復旧できます。障害が起きてから作成する方法（コールド DR）は、待機中の環境の費用がかかりません。
    - スナップショットを取得する間隔が、失われる可能性のある実行履歴の範囲（RPO）になります。
    - 環境のサイズやネットワークの構成はスナップショットから読み込まれないため、大阪の環境で設定しておきます。

    なお、Cloud Composer は2026年4月に Managed Service for Apache Airflow へ名称が変わりました（Cloud Composer 3 は Managed Airflow (Gen 3)）。試験ガイドでは Cloud Composer の名称が使われています。
  diagram: |
    flowchart TD
      E1["東京の Composer 環境"] -->|定期的に保存| S["スナップショット<br/>東京以外のバケット"]
      S -->|障害時に読み込み| E2["大阪の Composer 環境"]
      E2 --> R["ワークフローの実行を再開"]
  references:
    - title: "環境のスナップショットを使用した障害復旧"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/disaster-recovery-with-snapshots"
    - title: "環境のスナップショットを保存して読み込む"
      url: "https://docs.cloud.google.com/composer/docs/composer-3/save-load-snapshots"
    - title: "gcloud composer environments snapshots load"
      url: "https://docs.cloud.google.com/sdk/gcloud/reference/composer/environments/snapshots/load"
