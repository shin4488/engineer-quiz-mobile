- id: analyze-bi-001
  domain: analyze
  services: [bigquery, looker]
  type: single
  question: |
    ある飲料メーカーの財務企画チームは、全国の出荷実績を BigQuery のテーブル（約30億行）で管理しています。チームのメンバーは SQL を書けませんが、Google スプレッドシートの関数やピボット テーブルの操作には慣れています。メンバーが使い慣れたスプレッドシートの操作で、全期間のデータを自分で集計し、グラフを作れるようにしたいと考えています。

    情報管理の方針により、明細データをスプレッドシートやファイルに複製することは避けたいです。また、毎朝最新のデータで集計結果が更新されるようにする必要があります。

    運用の手間を最小限に抑えて要件を満たすには、どうすればよいですか？
  choices:
    a: "コネクテッド シートで BigQuery のテーブルに接続してピボット テーブルとグラフを作成し、毎朝の更新をスケジュールする"
    b: "BigQuery のテーブルを毎朝 CSV で Cloud Storage にエクスポートし、スプレッドシートに読み込んでから集計する"
    c: "Looker Studio で BigQuery に接続したレポートを作成し、表とグラフを財務企画チームに閲覧者として共有する"
    d: "Apps Script で BigQuery のクエリを毎朝実行し、結果の明細行をスプレッドシートに書き込んでから集計する"
  answer: [a]
  choiceNotes:
    a: "正解です。コネクテッド シートでは、データを BigQuery に置いたまま、ピボット テーブル・関数・グラフが BigQuery のクエリとして全行に対して実行されます。更新はスケジュールで自動化できます。"
    b: "明細データをファイルとスプレッドシートに複製するため、方針に反します。30億行はスプレッドシートに収まる量を大きく超えます。"
    c: "Looker Studio でもデータを複製せずに可視化できますが、メンバーが使い慣れたスプレッドシートの関数やピボット テーブルで分析するという要件に合いません。"
    d: "スクリプトの作成と保守が必要になり、明細行をスプレッドシートに複製するため方針にも反します。"
  explanation: |
    **コネクテッド シート** は、Google スプレッドシートから BigQuery のデータを直接分析する機能です。

    - シートに表示されるのはプレビュー（500行）だけで、ピボット テーブル・関数・グラフは BigQuery のクエリとして **全行** に対して実行される
    - データはスプレッドシートに複製されず、BigQuery に残る。集計の処理と料金は BigQuery 側で発生する
    - BigQuery のデータは自動では同期されないため、手動で更新するか **更新のスケジュール** を設定する
    - 利用者には、テーブルを読み取る権限（例：`roles/bigquery.dataViewer`）と、クエリジョブを実行する権限（例：`roles/bigquery.jobUser`）が必要

    BI ツールは利用者と目的で選びます。

    | ツール | 向いている場面 |
    | --- | --- |
    | コネクテッド シート | スプレッドシートに慣れた業務担当者が、SQL を書かずに大量のデータを集計する |
    | Looker Studio | ダッシュボードやレポートを作り、多くの人に共有する |
    | Looker | LookML で指標の定義を一元管理し、統制された BI を組織全体に提供する |

    なお、Looker Studio は2026年4月に Data Studio という名称に変わりました。試験ガイドでは Looker Studio と表記されています。
  references:
    - title: "コネクテッド シートを使用する"
      url: "https://docs.cloud.google.com/bigquery/docs/connected-sheets"

- id: analyze-bi-002
  domain: analyze
  services: [looker, bigquery]
  type: single
  question: |
    あるドラッグストア チェーンでは、営業・商品・店舗運営の各部門が、BigQuery のデータを使って Looker Studio でそれぞれレポートを作っています。各レポートで「粗利」や「既存店売上」を計算フィールドとして別々に定義しているため、経営会議で部門ごとに数字が合わない問題が起きています。

    経営層は次の要件を示しています。

    - 指標の定義を1か所で管理し、すべての部門が同じ定義を使う
    - 定義の変更は Git でバージョン管理し、レビューを経てから本番に反映する
    - 業務担当者が SQL を書かずに、店舗・商品・期間などを自由に組み合わせて掘り下げられる

    これらの要件を満たすには、どうすればよいですか？
  choices:
    a: "Looker を導入して指標とディメンションを LookML のモデルで定義し、利用者には Explore で分析させる"
    b: "Looker Studio で共通のデータソースを作り、計算フィールドで指標を定義して、各部門にそのデータソースを使うよう依頼する"
    c: "指標ごとにスケジュールされたクエリで集計テーブルを作成し、各部門の Looker Studio レポートからそのテーブルを参照させる"
    d: "指標の計算式を入れたコネクテッド シートのテンプレートを作成し、各部門にコピーして使うよう配布する"
  answer: [a]
  choiceNotes:
    a: "正解です。LookML は指標の定義を一元管理するセマンティック レイヤーで、Git と連携してバージョン管理とレビューができます。利用者は Explore で SQL を書かずに自由に掘り下げられます。"
    b: "共通のデータソースで定義をそろえることはできますが、Git によるバージョン管理とレビューの仕組みがありません。各レポートで独自の計算フィールドを追加することも防げません。"
    c: "集計の粒度があらかじめ固定されるため、自由な組み合わせでの掘り下げができません。定義の変更をレビューしてから反映する仕組みもありません。"
    d: "配布したコピーごとに計算式を変更できるため、定義が再びばらばらになります。一元管理とレビューの要件を満たしません。"
  explanation: |
    部門ごとに指標の定義がずれる問題には、**セマンティック レイヤー** で定義を一元管理する Looker が適しています。

    - **LookML**：テーブルの結合、ディメンション、指標（メジャー）の定義をコードとして記述する
    - **Git 連携**：開発モードで変更し、Git でバージョン管理・レビューしてから本番に反映できる
    - **Explore**：利用者は SQL を書かずに、定義済みのディメンションと指標を自由に組み合わせて分析できる。Looker が LookML から SQL を生成して BigQuery で実行する

    | 観点 | Looker Studio の計算フィールド | Looker の LookML |
    | --- | --- | --- |
    | 定義の場所 | データソースやレポートごと | 1つのモデルで一元管理 |
    | 変更管理 | なし | Git でバージョン管理・レビュー |
    | 主な用途 | 部門や個人のレポート作成 | 組織全体で統制された BI |

    Looker Studio のレポートから Looker のモデルに接続できるため、既存のレポート作成の操作を生かしながら、指標の定義だけを Looker にそろえることもできます。

    なお、Looker Studio は2026年4月に Data Studio という名称に変わりました。試験ガイドでは Looker Studio と表記されています。
  references:
    - title: "バージョン管理とデプロイを使用する"
      url: "https://docs.cloud.google.com/looker/docs/version-control-and-deploying-changes"
    - title: "Data Studio レポートで Looker のデータを表示して操作する"
      url: "https://docs.cloud.google.com/looker/docs/studio/view-and-interact-with-looker-data-on-a-report"

- id: analyze-bi-003
  domain: analyze
  services: [bigquery, looker]
  type: single
  question: |
    あるニュースメディア企業は、記事ごとの閲覧数を集計した BigQuery のテーブル（約40 GB）を10分ごとに更新し、Looker Studio のダッシュボードで編集部に公開しています。朝の編集会議の前には数百人が同時にダッシュボードを操作しますが、グラフの表示に毎回数秒かかり、不満が出ています。同じプロジェクトでは、夜間に大量のバッチ処理も実行されています。

    ダッシュボードとテーブルの設計を変えずに、ダッシュボードの応答を1秒未満に近づけたいと考えています。また、高速化のための容量は、ダッシュボードが参照するテーブルだけに使いたいです。どうすればよいですか？
  choices:
    a: "ダッシュボードのクエリを実行するプロジェクトに BI Engine の予約を作成し、集計テーブルを優先テーブルに指定する"
    b: "BigQuery の予約でスロットを追加購入し、ダッシュボードのクエリを実行するプロジェクトに割り当てる"
    c: "Looker Studio のデータの鮮度を12時間に延ばし、ほとんどの表示を Looker Studio のキャッシュから返すようにする"
    d: "集計テーブルを10分ごとに Cloud SQL にエクスポートし、ダッシュボードのデータソースを Cloud SQL に切り替える"
  answer: [a]
  choiceNotes:
    a: "正解です。BI Engine はメモリ上でクエリを高速に処理する機能で、Looker Studio からのクエリをそのまま高速化します。優先テーブルを指定すると、そのテーブルへのクエリだけに容量が使われます。"
    b: "スロットを増やすと待ち時間は減りますが、1秒未満の応答を目的とした機能ではありません。同じプロジェクトのバッチ処理も追加したスロットを使うため、ダッシュボード専用にもなりません。"
    c: "10分ごとに更新されるデータが最大12時間古くなり、編集部が最新の閲覧数を確認できなくなります。"
    d: "エクスポートの処理とデータソースの切り替えが必要になり、ダッシュボードの設計を変えないという要件に反します。"
  explanation: |
    **BI Engine** は、BigQuery のデータをメモリにキャッシュして、ダッシュボードなどの対話的なクエリを高速化する機能です。クエリやダッシュボードを書き換える必要はありません。

    - **予約の単位**：プロジェクトとロケーションごとに容量（GiB）を予約する。ダッシュボードのクエリを **実行するプロジェクト** に作成する
    - **優先テーブル**：高速化の対象を指定したテーブルに限定する。それ以外のテーブルへのクエリは通常のスロットで処理される
    - **料金**：オンデマンド料金では、BI Engine で処理されたステージのスキャン量は0バイトとして課金される

    優先テーブルには次の制約があります。

    | 対象 | 高速化される条件 |
    | --- | --- |
    | 論理ビュー | 優先テーブルに追加できない |
    | 複数テーブルを参照するクエリ | すべてのテーブルが優先テーブルである |
    | マテリアライズド ビュー | ビューとベーステーブルの両方が優先テーブルである |

    スロットの追加は処理能力を増やす対策で、BI ツールの応答を速くする専用の仕組みは BI Engine です。なお、Looker Studio は2026年4月に Data Studio という名称に変わりました。
  references:
    - title: "BI Engine の概要"
      url: "https://docs.cloud.google.com/bigquery/docs/bi-engine-intro"
    - title: "BI Engine の容量を予約する"
      url: "https://docs.cloud.google.com/bigquery/docs/bi-engine-reserve-capacity"
    - title: "BigQuery データソースのパフォーマンスを最適化する"
      url: "https://docs.cloud.google.com/looker/docs/studio/accelerate-bigquery-data-with-bi-engine"

- id: analyze-bi-004
  domain: analyze
  services: [bigquery]
  type: single
  question: |
    ある EC 企業は、注文明細を BigQuery のテーブル（約30 TB、注文日でパーティション分割）に数分ごとに追加しています。既存の行が更新・削除されることはありません。数十のダッシュボードとアナリストのツールが、このテーブルに対して「日別・カテゴリ別の売上合計と注文件数」を求める同じ集計クエリを1日に数千回実行しており、料金と応答時間が問題になっています。

    集計クエリは多くのツールやレポートに埋め込まれているため、書き換えは避けたいと考えています。また、集計結果には常に最新の注文を含める必要があります。どうすればよいですか？
  choices:
    a: "同じ集計を定義した増分マテリアライズド ビューをベーステーブルと同じプロジェクトに作成し、既存のクエリはそのまま使う"
    b: "スケジュールされたクエリで1時間ごとに集計テーブルを作り直し、各ツールのクエリの参照先を集計テーブルに変える"
    c: "集計クエリを論理ビューとして保存し、各ツールのクエリの参照先をそのビューに変える"
    d: "クエリ結果のキャッシュに任せ、同じ集計クエリの2回目以降はキャッシュから結果を返させる"
  answer: [a]
  choiceNotes:
    a: "正解です。スマート チューニングにより、ベーステーブルへのクエリがマテリアライズド ビューを使うように自動で書き換えられます。増分マテリアライズド ビューは前回の更新以降の差分も合わせて読むため、常に最新の結果を返します。"
    b: "各ツールのクエリの書き換えが必要で、集計結果も最大1時間古くなります。どちらの要件にも反します。"
    c: "論理ビューは結果を保存しないため、毎回ベーステーブルを読み取ります。クエリの書き換えも必要です。"
    d: "キャッシュはテーブルのデータが変わると使えなくなります。数分ごとに行が追加されるため、ほとんどのクエリでキャッシュは効きません。"
  explanation: |
    同じ集計を繰り返すクエリには、**マテリアライズド ビュー** で結果を事前に計算しておくのが効果的です。

    - **増分更新**：ベーステーブルの変更分だけを反映してバックグラウンドで更新される
    - **常に最新**：クエリの時点でまだ反映されていない差分は、ベーステーブルから読み取って結果に合わせる
    - **スマート チューニング**：ベーステーブルを参照するクエリでも、マテリアライズド ビューで答えられる場合は自動でビューを使うように書き換える

    スマート チューニングが使われる主な条件は次のとおりです。

    - ビューがベーステーブルまたはクエリを実行するプロジェクトと同じプロジェクトにある
    - クエリが必要とする列と行を、ビューがすべて含んでいる
    - 増分マテリアライズド ビューである（非増分のビューや、論理ビューを参照するビューなどは対象外）

    実際にビューが使われたかは、クエリプランの読み取りステージや、ジョブ情報の `materialized_view_statistics` で確認できます。
  diagram: |
    flowchart TD
      T["ダッシュボード<br/>アナリストのツール"] -->|ベーステーブルへの<br/>集計クエリ| O["BigQuery の<br/>オプティマイザ"]
      O -->|自動で書き換え| MV["増分<br/>マテリアライズド ビュー"]
      O -->|未反映の差分を読む| B["注文明細テーブル"]
      B -.->|バックグラウンドで<br/>増分更新| MV
  references:
    - title: "マテリアライズド ビューの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/materialized-views-intro"
    - title: "マテリアライズド ビューを使用する"
      url: "https://docs.cloud.google.com/bigquery/docs/materialized-views-use"

- id: analyze-bi-005
  domain: analyze
  services: [bigquery]
  type: single
  question: |
    あるオンライン ゲーム会社は、プレイヤーの対戦結果を BigQuery に蓄積し、経営層向けのダッシュボードでギルド別のランキングを表示しています。ダッシュボードのクエリは、対戦結果テーブル（約5 TB）とギルドのテーブルを結合し、`RANK()` のウィンドウ関数で順位を求めています。ダッシュボードは頻繁に開かれ、そのたびに同じ重いクエリが実行されています。

    経営層は、ランキングが最大6時間古くてもかまわないものの、6時間より古いデータが表示されることは許容しません。チームは結果を事前に計算して保存するためにマテリアライズド ビューの作成を試みましたが、ウィンドウ関数がサポートされていないというエラーで失敗しました。

    運用の手間を最小限に抑えて要件を満たすには、どうすればよいですか？
  choices:
    a: "非増分の定義を許可し、max_staleness を6時間にしたマテリアライズド ビューを作成して、ダッシュボードから参照する"
    b: "max_staleness だけを6時間にしたマテリアライズド ビューを作成し、ダッシュボードの元のクエリをスマート チューニングで書き換えさせる"
    c: "スケジュールされたクエリで6時間ごとにランキングをテーブルに書き込み、ダッシュボードからはそのテーブルを参照する"
    d: "ランキングのクエリを論理ビューとして保存し、そのビューを BI Engine の優先テーブルに指定して高速化する"
  answer: [a]
  choiceNotes:
    a: "正解です。allow_non_incremental_definition を true にした非増分マテリアライズド ビューは、ウィンドウ関数を含むクエリも定義でき、max_staleness と組み合わせて使います。最後の更新が max_staleness より古い場合は、ベーステーブルから結果が返されます。"
    b: "allow_non_incremental_definition を指定しないと、ウィンドウ関数を含むビューは作成できません。また、スマート チューニングは非増分マテリアライズド ビューには使われません。"
    c: "スケジュールの管理が必要で、ジョブが失敗したり遅れたりすると、6時間より古いランキングがそのまま表示されます。"
    d: "論理ビューは BI Engine の優先テーブルに指定できません。結果も保存されないため、重いクエリが毎回実行されます。"
  explanation: |
    マテリアライズド ビューには、**増分** と **非増分** の2種類があります。

    | 観点 | 増分マテリアライズド ビュー | 非増分マテリアライズド ビュー |
    | --- | --- | --- |
    | 使える SQL | 集計や結合など、増分で更新できるものに限られる | ウィンドウ（分析）関数、OUTER JOIN、UNION、HAVING なども使える |
    | 必要なオプション | なし | `allow_non_incremental_definition = true` と `max_staleness` |
    | 結果の鮮度 | 常に最新（max_staleness を設定した場合はその範囲内） | 最後の更新が max_staleness 以内ならビューの結果、古ければベーステーブルを読む |
    | スマート チューニング | 対象 | 対象外。ビューを直接参照する |

    非増分のビューでは、自動更新の間隔を max_staleness より短くしておくと、ほとんどのクエリがビューの保存結果で処理されます。

    ```sql
    CREATE MATERIALIZED VIEW game.guild_ranking
    OPTIONS (
      enable_refresh = true,
      refresh_interval_minutes = 240,
      max_staleness = INTERVAL "6:0:0" HOUR TO SECOND,
      allow_non_incremental_definition = true
    )
    AS SELECT ...
    ```

    **データ例**: 上のビューで、0:00 に更新したあと、4:00 の自動更新が遅れて 7:30 に完了した場合

    | クエリの時刻 | 最後の更新 | 経過時間 | 返される結果 |
    | --- | --- | --- | --- |
    | 3:00 | 0:00 | 3時間 | ビューの保存結果（0:00 時点） |
    | 6:30 | 0:00 | 6時間30分 | ベーステーブルから計算（最新） |
    | 7:45 | 7:30 | 15分 | ビューの保存結果（7:30 時点） |

    更新が遅れても、6時間より古いランキングは表示されません。スケジュールされたクエリで書き込んだテーブルでは、同じようにジョブが遅れると、6:30 の時点でも 0:00 のランキングがそのまま表示されます。

    `allow_non_incremental_definition` は作成後に変更できません。max_staleness は増分のビューにも設定でき、ベーステーブルが頻繁に変わる場合に差分を読む処理を省いて、料金と応答時間を抑えられます。
  references:
    - title: "マテリアライズド ビューを作成する"
      url: "https://docs.cloud.google.com/bigquery/docs/materialized-views-create"
    - title: "マテリアライズド ビューの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/materialized-views-intro"

- id: analyze-bi-006
  domain: analyze
  services: [bigquery]
  type: single
  question: |
    ある産業機械メーカーは、顧客の工場に設置した約8,000台の機械から、温度と振動の値を1秒ごとに BigQuery の生データのテーブルに取り込んでいます。機械が停止している間はデータが送られないため、1時間あたりの件数は機械や時間帯によって異なります。

    保守部門のダッシュボードには、次のグラフがあります。

    - 直近7日間の、機械ごとの1時間単位の平均温度と平均振動
    - 過去3年間の、機械ごとの日・週・月単位の平均温度と平均振動

    現在はすべてのグラフが生データのテーブルを直接集計しており、表示が遅く料金もかかっています。正しい平均値を表示しながら、事前に集計するデータの保存量と読み取り量を最小限にするには、どの粒度でどの値を事前に計算すべきですか？
  choices:
    a: "機械ごと・1時間ごとに温度と振動の合計値と件数を事前に計算し、どのグラフの平均も合計値を件数で割って求める"
    b: "機械ごと・1日ごとに温度と振動の平均値を事前に計算し、1時間単位のグラフだけは生データのテーブルから求める"
    c: "機械ごと・1時間ごとに温度と振動の平均値を事前に計算し、日・週・月の平均は1時間ごとの平均値をさらに平均して求める"
    d: "機械ごと・1分ごとに温度と振動の合計値と件数を事前に計算し、どのグラフの平均も合計値を件数で割って求める"
  answer: [a]
  choiceNotes:
    a: "正解です。ダッシュボードで必要な最も細かい粒度は1時間です。合計値と件数は足し合わせられるため、日・週・月の平均も正しく求められます。"
    b: "1時間単位のグラフが生データを読み続けるため、表示の遅さと料金の問題が残ります。"
    c: "1時間あたりの件数が異なるため、平均値をさらに平均しても正しい平均になりません。"
    d: "必要な粒度より細かいため、1時間単位の約60倍の行を保存し、読み取ることになります。"
  explanation: |
    事前に集計するデータの **時間の粒度** は、ダッシュボードで必要な最も細かい単位に合わせます。細かい粒度から粗い粒度へは集計し直せますが、その逆はできません。一方、必要以上に細かくすると保存量と読み取り量が増えます。

    集計する値は、**集計し直せる形** で持つことが重要です。

    | 値 | 粗い粒度への集計 | 正しく集計し直せるか |
    | --- | --- | --- |
    | 合計（SUM） | 合計を足す | できる |
    | 件数（COUNT） | 件数を足す | できる |
    | 平均（AVG） | 平均を平均する | 件数が異なると正しくない |
    | ユニーク数（COUNT DISTINCT） | ユニーク数を足す | できない（HLL++ のスケッチを使う） |

    **データ例**: ある機械が10時台はずっと稼働し、11時台は20分で停止した場合（1秒ごとに1件）

    | 時間帯 | 件数 | 温度の合計 | 平均 |
    | --- | --- | --- | --- |
    | 10時台 | 3,600 | 216,000 | 60.0℃ |
    | 11時台 | 1,200 | 96,000 | 80.0℃ |

    | 2時間の平均の求め方 | 結果 |
    | --- | --- |
    | 平均を平均する：(60.0 + 80.0) ÷ 2 | 70.0℃（誤り） |
    | 合計 ÷ 件数：312,000 ÷ 4,800 | 65.0℃（正しい） |

    平均を平均すると、件数が11時台の3倍ある10時台も、11時台と同じ重みで扱われてしまいます。

    平均は「合計 ÷ 件数」として、表示するときに計算します。

    1時間ごとの集計は、`TIMESTAMP_TRUNC(ts, HOUR)` で時刻を切り捨てて `SUM` と `COUNT` を求める **マテリアライズド ビュー** にすると、生データの追加に合わせて自動で増分更新されます。また、UTC の1時間単位で持っておけば、日本時間のように時差が1時間単位のタイムゾーンの日単位にも集計し直せます。
  references:
    - title: "マテリアライズド ビューの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/materialized-views-intro"
    - title: "スケッチ"
      url: "https://docs.cloud.google.com/bigquery/docs/sketches"

- id: analyze-bi-007
  domain: analyze
  services: [bigquery]
  type: single
  question: |
    ある物流企業は、配送イベントのテーブル（約100億行）と荷主のテーブルを結合して、荷主別の配送実績を毎朝集計しています。先月、新しい受付システムからのデータ取り込みを始めてから、このクエリの実行時間が数倍に延びました。

    クエリ実行グラフを確認すると、JOIN のステージで、ワーカーの最大の計算時間が平均の計算時間を大きく上回っていました。調べたところ、新しいシステムから取り込んだ行の多くは、荷主 ID に既定値の `UNKNOWN` が入っていました。

    クエリの実行時間を短くするには、どうすればよいですか？
  choices:
    a: "荷主 ID が UNKNOWN の行を結合の前に除外するか別に集計し、残りの行だけを荷主のテーブルと結合する"
    b: "クエリに使えるスロットを予約で増やし、JOIN のステージをより多くのワーカーで並列に処理させる"
    c: "結合する2つのテーブルの記述順を入れ替え、行数の少ない荷主のテーブルを先に書く"
    d: "SELECT 句の列を必要なものだけに絞り、配送イベントのテーブルから読み取るバイト数を減らす"
  answer: [a]
  choiceNotes:
    a: "正解です。結合キーが同じ値の行は同じワーカーに集まるため、1つの値に行が集中すると処理が偏ります。偏りの原因となる値を結合の前に取り除けば、処理が分散されます。"
    b: "遅いのは、特定の値に集中した行を処理する一部のワーカーです。スロットを増やしてもこの偏りは解消せず、料金が増えるだけです。"
    c: "テーブルの記述順を変えても、結合キーの値の偏りはなくなりません。"
    d: "読み取り量は減りますが、ボトルネックは JOIN のステージでの計算の偏りのため、根本的な改善になりません。"
  explanation: |
    クエリが遅いときは、**クエリ実行グラフ**（クエリプラン）で、どのステージに時間がかかっているかを確認します。

    | 確認する値 | 読み取れること |
    | --- | --- |
    | 計算時間の平均と最大 | 最大が平均を大きく上回ると、一部のワーカーに処理が偏っている（データの偏り） |
    | ステージの入力行数と出力行数 | 出力が入力より大きく増えると、結合条件の誤りやキーの重複で行が増幅している |
    | 読み取るバイト数 | 不要な列やパーティションを読んでいる |

    **データの偏り** の典型的な原因は、結合や GROUP BY のキーに `NULL` や既定値（`UNKNOWN`、`0` など）が大量に含まれることです。

    - 偏りの原因となる値を、結合の前に除外する
    - 偏った値を含む行は別に集計し、結果を `UNION ALL` でまとめる
    - 結合や集計の前に、WHERE 句や GROUP BY でデータを減らす

    キーの偏りによって、一部のスロットが処理するデータだけが大きくなると、クエリ実行グラフのそのステージに **パーティションのスキュー**（Partition skew）の分析情報（インサイト）が表示されます。
  references:
    - title: "クエリプランとタイムライン"
      url: "https://docs.cloud.google.com/bigquery/docs/query-plan-explanation"
    - title: "クエリのパフォーマンス分析情報を取得する"
      url: "https://docs.cloud.google.com/bigquery/docs/query-insights"

- id: analyze-bi-008
  domain: analyze
  services: [bigquery]
  type: multiple
  question: |
    あるデジタル広告企業は、広告の表示ログを BigQuery のテーブル（約200 TB、約300列）に保存しています。テーブルは DATE 型の `event_date` 列で日単位のパーティション分割がされており、クラスタリングは設定されていません。`event_ts` 列には、表示された時刻が TIMESTAMP 型で入っています。キャンペーンの成果を表示するダッシュボードは、次のクエリでデータを取得しています。

    ```sql
    SELECT *
    FROM ads.impressions
    WHERE event_ts >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 30 DAY)
    ```

    ダッシュボードで使っている列は5列だけです。このクエリがテーブルのほぼ全体をスキャンしており、料金が問題になっています。スキャンするデータ量を減らすには、どの対応を組み合わせるべきですか？
  choices:
    a: "SELECT * をやめ、ダッシュボードで使っている5列だけを SELECT 句に指定する"
    b: "パーティション列の event_date を直近30日間に絞る条件を、定数式で WHERE 句に追加する"
    c: "クエリの最後に LIMIT 10000 を追加し、テーブルから読み取る行数を減らす"
    d: "クエリに ORDER BY event_date DESC を追加し、新しいパーティションから順に読み取らせる"
    e: "クエリを実行する前にドライランを実行し、スキャンするバイト数を確認してから実行する"
  answer: [a, b]
  choiceNotes:
    a: "正解です。BigQuery は列指向のストレージのため、SELECT 句に書いた列だけが読み取られます。300列から5列に絞れば、スキャン量が大きく減ります。"
    b: "正解です。パーティション列に対する条件がないと、パーティションのプルーニングが行われず、すべてのパーティションが読み取られます。event_ts の条件だけではプルーニングされません。"
    c: "クラスタリングされていないテーブルでは、LIMIT を付けても読み取るデータ量は変わりません。LIMIT は結果の行数を制限するだけです。"
    d: "並べ替えを追加しても読み取るデータ量は減りません。並べ替えの処理が増えるだけです。"
    e: "ドライランはスキャン量を見積もるだけで、スキャン量そのものを減らす効果はありません。"
  explanation: |
    オンデマンド料金は **スキャンしたバイト数** で決まります。スキャン量を減らす基本は次の2つです。

    1. **列を絞る**：列指向のストレージのため、SELECT 句に書いた列だけが読み取られる。`SELECT *` を避け、必要な列だけを指定する
    2. **パーティションを絞る**：パーティション列に対する条件を WHERE 句に書くと、該当するパーティションだけが読み取られる（プルーニング）

    ```sql
    SELECT campaign_id, creative_id, device_type, event_date, cost
    FROM ads.impressions
    WHERE event_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
    ```

    プルーニングが効かない典型的な書き方は次のとおりです。

    | 書き方 | 理由 |
    | --- | --- |
    | パーティション列以外の列だけで絞る | どのパーティションを読めばよいか判断できない |
    | サブクエリの結果と比較する | 定数式ではないため、実行前に読み取る範囲を決められない |
    | パーティション列と別の列を組み合わせて計算する | パーティション列が単独で比較されていない |
    | 別の列の条件と `OR` でつなぐ | 他方の条件を満たす行がどのパーティションにもありうる |

    テーブルに **パーティション フィルタを必須にする** 設定をすると、パーティション列の条件がないクエリをエラーにできます。なお、クラスタリングされたテーブルでは、LIMIT によって読み取るブロックが減る場合があります。
  references:
    - title: "パーティション分割テーブルに対してクエリを実行する"
      url: "https://docs.cloud.google.com/bigquery/docs/querying-partitioned-tables"
    - title: "費用の見積もりと管理"
      url: "https://docs.cloud.google.com/bigquery/docs/best-practices-costs"

- id: analyze-bi-009
  domain: analyze
  services: [bigquery]
  type: single
  question: |
    ある通信会社は、スマートフォン アプリの利用セッションを BigQuery のテーブル（約500億行）に保存しています。カスタマー サクセス チームのダッシュボードでは、「前回の利用からの経過時間」の分布を表示するため、次のように同じテーブルを自己結合して、各セッションの直前のセッションを求めています。

    ```sql
    SELECT cur.user_id, cur.session_start,
           MAX(prev.session_start) AS prev_session_start
    FROM app.sessions AS cur
    JOIN app.sessions AS prev
      ON cur.user_id = prev.user_id
     AND prev.session_start < cur.session_start
    GROUP BY cur.user_id, cur.session_start
    ```

    このクエリは非常に遅く、クエリ実行グラフでは JOIN のステージの出力行数が入力より桁違いに多くなっていました。同じ結果をより効率的に求めるには、どうすればよいですか？
  choices:
    a: "ウィンドウ関数の LAG で、user_id ごとに直前のセッションの開始時刻を求める"
    b: "テーブルを user_id でクラスタリングし直してから、同じ自己結合のクエリを実行する"
    c: "自己結合の結合条件を user_id だけにし、時刻の比較は結合後の WHERE 句で行う"
    d: "BigQuery の予約でスロットを増やし、自己結合の処理をより多くのワーカーで並列に実行させる"
  answer: [a]
  choiceNotes:
    a: "正解です。ウィンドウ関数ならテーブルを1回読むだけで、ユーザーごとに並べた直前の行を参照できます。自己結合による行の増幅が起きません。"
    b: "クラスタリングしても、結合でユーザーごとにセッション数の2乗に比例する行が生成される問題は残ります。"
    c: "内部結合では、時刻の条件を ON 句に書いても WHERE 句に書いても結果は同じです。ユーザーごとにセッション数の2乗に比例する行が生成される問題は解消しません。"
    d: "行の増幅という原因が残るため、スロットを増やしても効果は限られ、料金が増えます。"
  explanation: |
    **自己結合** で「直前の行」や「累計」を求めると、ユーザーごとに行数の2乗に比例する組み合わせが生成され、大きなテーブルでは非常に遅くなります。BigQuery のベスト プラクティスでは、自己結合の代わりに **ウィンドウ（分析）関数** を使うよう推奨しています。

    ```sql
    SELECT user_id, session_start,
           LAG(session_start) OVER (
             PARTITION BY user_id ORDER BY session_start
           ) AS prev_session_start
    FROM app.sessions
    ```

    各ユーザーの最初のセッションは直前の行がないため `NULL` になります。自己結合と同じ結果にするには、外側のクエリで除外します。

    **データ例**: ユーザー u1 のセッションが4件ある場合

    | session_start | 自己結合で組み合わされる prev | LAG の結果 |
    | --- | --- | --- |
    | 8:00 | なし | NULL |
    | 12:30 | 8:00 | 8:00 |
    | 19:00 | 8:00、12:30 | 12:30 |
    | 22:15 | 8:00、12:30、19:00 | 19:00 |

    自己結合では JOIN の出力が 1 + 2 + 3 = 6行になり、GROUP BY と MAX で各セッションの直前を選びます。LAG は並べた4行の1つ前を参照するだけです。セッションが1,000件のユーザーでは、JOIN の出力は約50万行（1,000 × 999 ÷ 2）になります。

    大きなテーブルを結合するときの要点は次のとおりです。

    - 結合の前に、WHERE 句や GROUP BY でデータを減らす
    - 自己結合は、ウィンドウ関数や PIVOT 演算子で置き換える
    - 結合の出力行が急に増える場合は、結合条件の誤りやキーの重複を疑い、結合キーごとの行数を確認する（クエリ実行グラフには **高カーディナリティの結合** の分析情報が表示される）
    - ウィンドウ関数で大量の行を並べ替える前に、不要な行を除いておく
  references:
    - title: "クエリの計算を最適化する"
      url: "https://docs.cloud.google.com/bigquery/docs/best-practices-performance-compute"
    - title: "クエリプランとタイムライン"
      url: "https://docs.cloud.google.com/bigquery/docs/query-plan-explanation"

- id: analyze-bi-010
  domain: analyze
  services: [bigquery]
  type: single
  question: |
    ある動画配信サービスは、視聴ログ（1日あたり約20億行）を BigQuery に保存しています。マーケティング部門のダッシュボードでは、利用者が任意の期間と、国・デバイスの任意の組み合わせを選んで、ユニーク視聴者数を表示できるようにしたいと考えています。

    現在は、ダッシュボードを操作するたびに生ログに対して `COUNT(DISTINCT user_id)` を実行しており、90日間を選ぶと応答が遅く、料金も高くなっています。ユニーク視聴者数は約1%の誤差を許容できます。どうすればよいですか？
  choices:
    a: "日・国・デバイスごとに HLL_COUNT.INIT のスケッチを保存し、ダッシュボードでは HLL_COUNT.MERGE で統合する"
    b: "日・国・デバイスごとに APPROX_COUNT_DISTINCT の結果を保存し、ダッシュボードでは選んだ期間と条件に合う値を合計する"
    c: "日・国・デバイスごとに COUNT(DISTINCT user_id) の結果を保存し、ダッシュボードでは選んだ期間と条件に合う値を合計する"
    d: "ダッシュボードのクエリを、生ログに対して APPROX_COUNT_DISTINCT を実行する形に書き換えて集計を速くする"
  answer: [a]
  choiceNotes:
    a: "正解です。HLL++ のスケッチは統合して集計し直せるため、任意の期間と組み合わせのユニーク数を、生ログを読まずに求められます。"
    b: "APPROX_COUNT_DISTINCT の結果は集計し直せません。日ごとのユニーク数を合計すると、複数の日に視聴したユーザーが重複して数えられます。"
    c: "正確なユニーク数でも、合計すると重複して数えられるため、期間や組み合わせ全体のユニーク数になりません。"
    d: "集計の処理は軽くなりますが、操作のたびに90日分の生ログを読み取るため、料金の問題が残ります。"
  explanation: |
    ユニーク数（COUNT DISTINCT）は、日ごとの結果を足しても期間全体のユニーク数になりません。誤差を許容できる場合は、**HyperLogLog++（HLL++）** の関数で、集計し直せる中間結果（**スケッチ**）を保存します。

    **データ例**: 国が JP、デバイスが TV の視聴者が次のとおりだった場合

    | 日付 | 視聴したユーザー | ユニーク数 |
    | --- | --- | --- |
    | 7/1 | u1、u2、u3 | 3 |
    | 7/2 | u2、u3、u4 | 3 |

    日ごとのユニーク数を足すと6人ですが、2日間のユニーク視聴者は u1〜u4 の4人です。両日に視聴した u2 と u3 を2回数えています。7/1 と 7/2 のスケッチを HLL_COUNT.MERGE で統合すれば、2日分のユーザーの和集合のユニーク数（約4人）を求められます。

    | 関数 | 役割 |
    | --- | --- |
    | `HLL_COUNT.INIT` | 値からスケッチを作る。精度は10〜24で指定できる（既定は15） |
    | `HLL_COUNT.MERGE` | 複数のスケッチを統合し、ユニーク数を返す |
    | `HLL_COUNT.MERGE_PARTIAL` | 複数のスケッチを統合し、新しいスケッチを返す |
    | `HLL_COUNT.EXTRACT` | 1つのスケッチからユニーク数を取り出す |

    `APPROX_COUNT_DISTINCT` も近似のユニーク数を求める関数ですが、部分的な集計、集計し直し、精度の指定ができません。1回のクエリで近似値を求めるだけなら `APPROX_COUNT_DISTINCT`、事前に集計して後から組み合わせるならスケッチを使います。

    ```sql
    -- 日・国・デバイスごとのスケッチを作る
    SELECT view_date, country, device,
           HLL_COUNT.INIT(user_id) AS users_sketch
    FROM media.view_logs
    GROUP BY view_date, country, device;

    -- 選んだ期間と条件のユニーク数を求める
    SELECT HLL_COUNT.MERGE(users_sketch) AS unique_viewers
    FROM media.daily_user_sketches
    WHERE view_date BETWEEN '2026-07-01' AND '2026-09-28'
      AND country = 'JP';
    ```
  diagram: |
    flowchart TD
      L["視聴ログ<br/>1日約20億行"] -->|HLL_COUNT.INIT<br/>日・国・デバイスごと| S["日次スケッチの<br/>テーブル"]
      S -->|HLL_COUNT.MERGE<br/>期間と条件で統合| D["ダッシュボード<br/>ユニーク視聴者数"]
  references:
    - title: "スケッチ"
      url: "https://docs.cloud.google.com/bigquery/docs/sketches"
    - title: "HyperLogLog++ 関数"
      url: "https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/hll_functions"

- id: analyze-bi-011
  domain: analyze
  services: [bigquery]
  type: single
  question: |
    ある損害保険会社は、契約と保険金請求のテーブルを結合する複雑なレポート用のクエリを、BigQuery で毎日同じ形で実行しています。最近、クエリの文を変えていないにもかかわらず、何回か実行した後から、いくつかのクエリのスロット使用時間が減っていることに気づきました。

    このプロジェクトでは、マテリアライズド ビューと BI Engine は使っていません。また、テーブルには毎日新しいデータが追加されています。この変化の理由として最も適切なものはどれですか？
  choices:
    a: "履歴ベースの最適化が、以前の実行で得た情報を使い、選択性の高い結合を先に実行するなどの最適化を適用した"
    b: "クエリ結果のキャッシュが使われるようになり、以前の実行結果がそのまま返されるようになった"
    c: "スマート チューニングが、事前に計算された結果を読み取るようにクエリを自動で書き換えた"
    d: "BI Engine が、よく参照されるテーブルを自動的にメモリに読み込んで処理を高速化した"
  answer: [a]
  choiceNotes:
    a: "正解です。履歴ベースの最適化は、同じようなクエリの過去の実行から得た情報を使い、効果が見込める場合にだけ最適化を適用します。現在は既定で有効です。"
    b: "キャッシュは参照するテーブルのデータが変わると使えません。毎日データが追加されるため該当しません。"
    c: "スマート チューニングは、マテリアライズド ビューを使うようにクエリを書き換える機能です。マテリアライズド ビューがないため該当しません。"
    d: "BI Engine は、プロジェクトに BI Engine の予約を作成しない限り使われません。"
  explanation: |
    **履歴ベースの最適化** は、同じようなクエリの過去の実行から得た情報をもとに、次回以降の実行を最適化する BigQuery の機能です。

    - 最適化の例：選択性の高い結合を先に実行する（結合のプッシュダウン）、セミジョインを挿入して処理するデータ量を減らす（セミジョインの削減）
    - 効果が高いと判断できる場合にだけ適用され、効果がなかった最適化は以後使われない
    - 現在は **既定で有効**。無効にしていた場合は、`ALTER PROJECT` や `ALTER ORGANIZATION` で `default_query_optimizer_options = 'adaptive=on'` を設定して有効にする
    - 適用された最適化は、`INFORMATION_SCHEMA.JOBS` の `query_info.optimization_details` で確認できる（適用されていなければ NULL）

    クエリを速くする BigQuery の仕組みを整理しておきましょう。

    | 機能 | 速くなる仕組み | 使われる前提 |
    | --- | --- | --- |
    | 履歴ベースの最適化 | 過去の実行情報で実行計画を改善する | 既定で有効 |
    | クエリ結果のキャッシュ | 同じクエリの結果を再利用する | 参照するテーブルが変わっていない |
    | スマート チューニング | マテリアライズド ビューを使うように書き換える | マテリアライズド ビューがある |
    | BI Engine | メモリ上で処理する | BI Engine の予約がある |
  references:
    - title: "履歴ベースの最適化を使用する"
      url: "https://docs.cloud.google.com/bigquery/docs/history-based-optimizations"

- id: analyze-bi-012
  domain: analyze
  services: [bigquery, looker, iam]
  type: single
  question: |
    あるスーパーマーケット チェーンは、全店舗の売上を BigQuery の1つのテーブルに集約し、Looker Studio のダッシュボードで社内に公開しています。全国は8つの地域に分かれており、各地域のマネージャーには自分の地域の店舗の行だけを見せる必要があります。本部の経営企画部は、すべての地域の行を見られる必要があります。

    ダッシュボードとテーブルはそれぞれ1つのまま運用し、閲覧できる範囲は Google グループで管理したいと考えています。どうすればよいですか？
  choices:
    a: "地域ごとに行アクセス ポリシーを作成して各地域のグループに付与し、データソースの認証情報を閲覧者の認証情報にする"
    b: "地域ごとに行アクセス ポリシーを作成して各地域のグループに付与し、データソースの認証情報はオーナーの認証情報のままにする"
    c: "ダッシュボードに地域のフィルタ コントロールを追加し、各地域のマネージャーに自分の地域を選んで閲覧するよう周知する"
    d: "地域ごとにテーブルとダッシュボードを8つずつ作成し、各地域のグループにだけそれぞれのダッシュボードを共有する"
  answer: [a]
  choiceNotes:
    a: "正解です。閲覧者の認証情報では、クエリが閲覧者自身の ID で実行されるため、その人に付与された行アクセス ポリシーが適用されます。本部には全行を許可するポリシーを付与します。"
    b: "オーナーの認証情報では、すべての閲覧者のクエリがオーナーの ID で実行されます。閲覧者ごとに見える行を分けられません。"
    c: "フィルタ コントロールは表示を絞り込むだけで、アクセス制御ではありません。マネージャーは他の地域を選んで閲覧できます。"
    d: "テーブルとダッシュボードが8つずつになり、1つのまま運用するという要件に反します。変更のたびに8つを修正する手間もかかります。"
  explanation: |
    BI ツールの利用者ごとに見える行を分けるには、BigQuery の **行レベルのセキュリティ** と、BI ツール側の **認証情報の設定** を組み合わせます。

    ```sql
    CREATE ROW ACCESS POLICY kanto_filter
    ON retail.sales
    GRANT TO ('group:kanto-managers@example.com')
    FILTER USING (region = '関東');

    CREATE ROW ACCESS POLICY hq_all
    ON retail.sales
    GRANT TO ('group:hq-planning@example.com')
    FILTER USING (TRUE);
    ```

    - テーブルに行アクセス ポリシーがあると、どのポリシーの付与対象にも含まれないユーザーには行が返されない
    - そのため、全行を見せる相手には `FILTER USING (TRUE)` のポリシーを付与する

    Looker Studio のデータソースの認証情報は次の3種類です。

    | 認証情報 | クエリを実行する ID | 行レベルのセキュリティの効果 |
    | --- | --- | --- |
    | オーナーの認証情報 | データソースのオーナー | 全員にオーナーが見える行が表示される |
    | 閲覧者の認証情報 | 閲覧している各ユーザー | 閲覧者ごとに見える行が分かれる |
    | サービス アカウントの認証情報 | サービス アカウント | 全員にサービス アカウントが見える行が表示される |

    閲覧者の認証情報を使う場合、各閲覧者にはテーブルを読み取る IAM の権限も必要です。なお、Looker Studio は2026年4月に Data Studio という名称に変わりました。
  diagram: |
    flowchart TD
      M1["関東のマネージャー"] --> R["Looker Studio<br/>閲覧者の認証情報"]
      M2["本部 経営企画部"] --> R
      R -->|閲覧者の ID で<br/>クエリを実行| T["売上テーブル<br/>行アクセス ポリシー"]
      T -->|関東の行だけ| M1
      T -->|全地域の行| M2
  references:
    - title: "BigQuery の行レベルのセキュリティの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/row-level-security-intro"
    - title: "データの認証情報"
      url: "https://docs.cloud.google.com/data-studio/data-credentials-article"

- id: analyze-bi-013
  domain: analyze
  services: [bigquery, iam]
  type: multiple
  question: |
    ある病院グループは、患者ごとの診療記録を BigQuery の `clinical` データセットに保存しています。経営企画部は Looker Studio で、診療科別・月別の患者数と平均在院日数を表示するダッシュボードを作ろうとしています。

    情報管理の方針により、経営企画部のメンバーは患者単位の行を参照してはならず、診療科・月ごとに集計した結果だけを参照できるようにする必要があります。また、`clinical` データセットへの直接のアクセス権は付与しないことになっています。

    この要件を満たすには、どの対応を組み合わせるべきですか？
  choices:
    a: "診療科・月ごとの集計結果だけを返すビューを、clinical とは別のデータセットに作成する"
    b: "作成したビューを、clinical データセットの承認済みビューとして登録する"
    c: "経営企画部のグループに、ビューを置いたデータセットの roles/bigquery.dataViewer を付与する"
    d: "経営企画部のグループに、clinical データセットの roles/bigquery.dataViewer を付与する"
    e: "診療記録のテーブルで患者を識別する列にポリシータグを付け、経営企画部にはそれ以外の列を参照させる"
    f: "診療記録のテーブルを毎日経営企画部のプロジェクトにコピーし、コピーしたテーブルに集計のビューを作成する"
  answer: [a, b, c]
  choiceNotes:
    a: "正解です。承認済みビューは、元のデータとは別のデータセットに作成します。同じデータセットに置くと、ビューを見せるための権限で元のテーブルも見えてしまいます。"
    b: "正解です。ビューを承認すると、利用者が元のテーブルへのアクセス権を持っていなくても、ビューを通じて集計結果を参照できます。"
    c: "正解です。利用者がビューを参照するには、ビューを置いたデータセットの読み取り権限が必要です。"
    d: "clinical データセットへの直接のアクセス権を付与することになり、患者単位の行も参照できてしまいます。"
    e: "識別する列を隠しても患者単位の行は参照できるため、集計結果だけを見せるという要件を満たしません。"
    f: "患者単位のデータが経営企画部のプロジェクトに複製され、元の行を参照できてしまいます。"
  explanation: |
    **承認済みビュー** を使うと、元のテーブルへのアクセス権を与えずに、ビューの結果だけを共有できます。

    1. 元のデータとは別のデータセット（例：`reporting`）にビューを作成する
    2. 利用者に、ビューを置いたデータセットの読み取り権限（`roles/bigquery.dataViewer`）を付与する
    3. 元のデータセット（`clinical`）の共有設定で、ビューを **承認済みビュー** として登録する

    利用者がクエリを実行するには、ジョブを実行するプロジェクトでの権限（`roles/bigquery.jobUser` など）も必要です。

    | 方法 | 見せる範囲 | 向いている場面 |
    | --- | --- | --- |
    | 承認済みビュー | ビューの結果（集計結果、一部の列や行） | 元のテーブルへのアクセス権を与えずに、加工した結果だけを共有する |
    | 行アクセス ポリシー | テーブルの一部の行 | 同じテーブルを、利用者ごとに見える行を分けて共有する |
    | ポリシータグ | テーブルの一部の列 | 機密性の高い列だけを隠す |

    多数のビューをまとめて承認したい場合は、データセット単位で承認する **承認済みデータセット** も使えます。なお、Looker Studio は2026年4月に Data Studio という名称に変わりました。
  diagram: |
    flowchart TD
      U["経営企画部のグループ"] -->|reporting の<br/>dataViewer で参照| V["reporting データセット<br/>集計のビュー"]
      V -->|承認済みビューとして<br/>読み取りを許可| T["clinical データセット<br/>診療記録のテーブル"]
      U -.->|直接は<br/>参照できない| T
  references:
    - title: "承認済みビュー"
      url: "https://docs.cloud.google.com/bigquery/docs/authorized-views"
    - title: "承認済みビューを作成する"
      url: "https://docs.cloud.google.com/bigquery/docs/create-authorized-views"

- id: analyze-bi-014
  domain: analyze
  services: [analytics-hub, bigquery, cloud-storage, migration]
  type: single
  question: |
    ある気象データ会社は、全国の観測データと予報データを BigQuery のデータセットで管理し、10分ごとに更新しています。このデータを約50社の法人顧客に提供し、各社が自社の Google Cloud 組織から分析できるようにしたいと考えています。

    要件は次のとおりです。

    - 顧客は常に最新のデータを参照でき、データを複製したり配信したりするパイプラインは作らない
    - 顧客がクエリを実行した料金は、顧客自身が支払う
    - 提供先の顧客を気象データ会社が管理し、契約が終わった顧客のアクセスを止められる

    これらの要件を満たすには、どうすればよいですか？
  choices:
    a: "Analytics Hub で限定公開のデータ エクスチェンジを作成し、データセットをリスティングとして公開して、契約した顧客に購読させる"
    b: "データセットを10分ごとに Cloud Storage にエクスポートし、顧客ごとに用意したバケットの読み取り権限を付与する"
    c: "BigQuery Data Transfer Service のデータセット コピーで、各顧客のプロジェクトにデータセットを定期的に複製する"
    d: "顧客のユーザーに、気象データ会社のプロジェクトの roles/bigquery.dataViewer と roles/bigquery.jobUser を付与する"
  answer: [a]
  choiceNotes:
    a: "正解です。購読すると顧客のプロジェクトにリンクされたデータセットが作成され、データを複製せずに最新のデータを参照できます。クエリの料金は購読者が支払い、提供元は購読者を確認・削除できます。"
    b: "エクスポートのパイプラインが必要になり、データも複製されます。顧客には BigQuery に読み込み直す手間もかかります。"
    c: "顧客ごとにデータが複製され、転送の管理も必要です。複製やパイプラインを作らないという要件に反し、複製の間隔によっては顧客が最新のデータを参照できません。"
    d: "顧客のクエリジョブが気象データ会社のプロジェクトで実行されるため、クエリの料金を気象データ会社が支払うことになります。"
  explanation: |
    **Analytics Hub** は、BigQuery のデータを複製せずに組織の内外と共有するサービスです。2025年4月に **BigQuery sharing** という名称に変わりました。

    | 用語 | 内容 |
    | --- | --- |
    | データ エクスチェンジ | リスティングをまとめて公開する場所。限定公開（許可した相手だけ）や一般公開にできる |
    | リスティング | 共有するデータセットへの参照。説明や問い合わせ先などの情報を付けて公開する |
    | リンクされたデータセット | 購読すると購読者のプロジェクトに作成される読み取り専用のデータセット。提供元のデータを複製せずに参照する |

    - **料金の分担**：提供元（パブリッシャー）はデータの保存料金を、購読者（サブスクライバー）はクエリの料金を支払う。エクスチェンジやリスティングの管理に追加料金はかからない
    - **購読者の管理**：提供元は購読者の一覧を確認し、購読者を削除できる
    - **商用データ**：Cloud Marketplace と連携して、リスティングを有料で販売することもできる
  diagram: |
    flowchart TD
      subgraph P["気象データ会社のプロジェクト"]
        DS["共有するデータセット"] -->|リスティングとして公開| X["データ エクスチェンジ"]
      end
      subgraph C["顧客のプロジェクト"]
        LD["リンクされたデータセット"] --> Q["顧客のクエリ<br/>料金は顧客が負担"]
      end
      X -->|購読| LD
      LD -.->|複製せずに参照| DS
  references:
    - title: "BigQuery sharing の概要"
      url: "https://docs.cloud.google.com/bigquery/docs/analytics-hub-introduction"
    - title: "リスティングを管理する"
      url: "https://docs.cloud.google.com/bigquery/docs/analytics-hub-manage-listings"

- id: analyze-bi-015
  domain: analyze
  services: [analytics-hub, bigquery, monitoring]
  type: single
  question: |
    ある金融情報ベンダーは、株価や企業財務のデータを Analytics Hub のリスティングとして証券会社や資産運用会社に提供しています。契約では、購読者は共有データにクエリを実行し、その分析結果をエクスポートして自社のシステムで使ってよいことになっています。一方、共有されたテーブルそのものを、コピー、エクスポート、スナップショットなどで持ち出すことは禁止されています。

    この契約の条件を、購読者側の設定に頼らずに技術的に強制したいと考えています。どうすればよいですか？
  choices:
    a: "リスティングのデータ エグレス制御で共有データのコピーとエクスポートを制限し、クエリ結果の持ち出しは制限しない"
    b: "リスティングのデータ エグレス制御で、共有データに加えてクエリ結果のコピーとエクスポートも制限する"
    c: "リンクされたデータセットは読み取り専用のため、追加の設定はせずにリスティングをそのまま公開する"
    d: "利用規約に持ち出しの禁止を明記し、購読者によるコピーやエクスポートを Cloud Audit Logs で監視する"
  answer: [a]
  choiceNotes:
    a: "正解です。データ エグレス制御を有効にすると、リンクされたデータセットでは共有データのコピー、クローン、エクスポート、スナップショットができなくなります。共有データだけを制限する設定では、クエリ結果のエクスポートは許可されたままです。"
    b: "クエリ結果のコピーとエクスポートも制限すると、契約で認められている分析結果のエクスポートもできなくなります。"
    c: "リンクされたデータセットは変更できませんが、エグレス制御を設定しなければ、購読者は共有データをコピーやエクスポートで持ち出せます。"
    d: "規約と監視では違反を後から見つけられるだけで、持ち出しを技術的に防げません。"
  explanation: |
    Analytics Hub（BigQuery sharing）の **データ エグレス制御** は、購読者が共有データを持ち出すことを、提供元が制限する機能です。リスティングごとに設定し、購読者のプロジェクトにあるリンクされたデータセットに適用されます。

    | 設定 | 制限される操作 |
    | --- | --- |
    | 共有データのコピーとエクスポートを制限 | 共有テーブルのコピー、クローン、エクスポート、スナップショット（クエリ結果のエクスポートは許可される） |
    | クエリ結果のコピーとエクスポートも制限 | 上記に加えて、共有データに対するクエリ結果のコピーとエクスポート |

    - 制限が有効な場合、該当する API もコンソールの操作も使えない。制限されたデータセットでは BigQuery Data Transfer Service も使えない
    - 組織内のすべてのリスティングで制限を必須にしたい場合は、組織のポリシーのカスタム制約で、制限が有効でないリスティングの作成や更新を拒否できる
    - データ クリーンルームでは、共有データのコピーとエクスポートを防ぐエグレス制御が自動で有効になる
  references:
    - title: "リスティングを管理する"
      url: "https://docs.cloud.google.com/bigquery/docs/analytics-hub-manage-listings"
    - title: "BigQuery sharing の概要"
      url: "https://docs.cloud.google.com/bigquery/docs/analytics-hub-introduction"

- id: analyze-bi-016
  domain: analyze
  services: [analytics-hub, iam, bigquery, migration]
  type: multiple
  question: |
    ある複合企業グループでは、子会社間で BigQuery のデータを共有する機会が増えたため、データ ガバナンス チームが次の共有ルールを定めました。

    - 子会社間のデータ共有は、Analytics Hub のエクスチェンジを通じて行う
    - エクスチェンジにリスティングを公開できるのは、各社のデータ スチュワードだけとする
    - 組織内のすべてのリスティングで、購読者による共有データのコピーとエクスポートを必ず禁止する

    ルールを守らせるための人手による確認を最小限にしたいと考えています。どの対応を組み合わせるべきですか？
  choices:
    a: "組織のポリシーのカスタム制約で、エクスポートの制限が有効でないリスティングの作成と更新を拒否する"
    b: "データ スチュワードのグループにだけ、エクスチェンジに対する roles/analyticshub.publisher を付与する"
    c: "すべての社員に組織レベルで roles/analyticshub.admin を付与し、必要なエクスチェンジを各自で作成させる"
    d: "リスティングが作成されるたびに、データ ガバナンス チームがチェックリストで設定を確認する運用にする"
    e: "共有するデータセットを、BigQuery Data Transfer Service で相手の子会社のプロジェクトに毎日コピーする"
  answer: [a, b]
  choiceNotes:
    a: "正解です。カスタム制約を使うと、ルールに反する設定のリスティングは作成や更新の時点で拒否されます。人手で確認しなくても、すべてのリスティングでエクスポートの制限を強制できます。"
    b: "正解です。リスティングの公開に必要なロールをデータ スチュワードだけに付与すれば、それ以外のユーザーはリスティングを公開できません。"
    c: "全員が管理者になると誰でもエクスチェンジやリスティングを作成・変更でき、公開できる人を限定するルールに反します。"
    d: "人手による確認が必要で、確認漏れも防げません。人手による確認を最小限にするという要件に反します。"
    e: "データの複製になり、Analytics Hub のエクスチェンジを通じて共有するというルールに反します。"
  explanation: |
    データ共有のルールは、文書で定めるだけでなく、**IAM** と **組織のポリシー** で技術的に強制します。

    | ルール | 強制する方法 |
    | --- | --- |
    | 誰が公開できるか | エクスチェンジに対する公開用のロールを、必要な人にだけ付与する |
    | 誰が購読できるか | エクスチェンジやリスティングに対する購読者のロールを、許可した相手にだけ付与する |
    | どんな設定で公開できるか | 組織のポリシーのカスタム制約で、条件に合わないエクスチェンジやリスティングを拒否する |

    Analytics Hub（BigQuery sharing）の主な IAM ロールは次のとおりです。

    - `roles/analyticshub.admin`：エクスチェンジの作成と管理
    - `roles/analyticshub.publisher`：エクスチェンジへのリスティングの公開
    - `roles/analyticshub.subscriber`：リスティングの購読（リンクされたデータセットを作る購読者のプロジェクトでは、データセットの作成権限も必要）
    - `roles/analyticshub.viewer`：エクスチェンジやリスティングの閲覧

    最小権限の原則に従い、管理者のロールは少数の管理者に限定します。
  references:
    - title: "カスタム制約を使用して共有のデータ エクスチェンジとリスティングを管理する"
      url: "https://docs.cloud.google.com/bigquery/docs/analytics-hub-custom-constraints"
    - title: "BigQuery sharing のロールと権限"
      url: "https://docs.cloud.google.com/iam/docs/roles-permissions/analyticshub"

- id: analyze-bi-017
  domain: analyze
  services: [analytics-hub, bigquery, dlp, cloud-storage]
  type: single
  question: |
    ある小売チェーンと食品メーカーは、メーカーが配信した広告が会員の購買にどれだけ結びついたかを測定したいと考えています。小売チェーンは会員の購買データを、メーカーは広告に接触したユーザーのデータを、それぞれ BigQuery に持っています。両社のデータには同じ方法でハッシュ化したメールアドレスが含まれており、これをキーに結合できます。

    要件は次のとおりです。

    - どちらの会社も、相手の行単位のデータを見られない
    - メーカーが得られるのは、一定人数以上の会員を集計した結果だけにする
    - 小売チェーンの購買データを、メーカーがコピーやエクスポートで持ち出せないようにする

    これらの要件を満たすには、どうすればよいですか？
  choices:
    a: "BigQuery のデータ クリーンルームを作成し、小売チェーンが集計しきい値の分析ルールを設定したビューを追加して、メーカーに購読させる"
    b: "小売チェーンが購買データの承認済みビューを作成し、メーカーのユーザーにビューを置いたデータセットの読み取り権限を付与する"
    c: "小売チェーンが購買データを Sensitive Data Protection で仮名化し、仮名化したテーブルをメーカーのプロジェクトにコピーする"
    d: "両社がデータを共有の Cloud Storage バケットに CSV で置き、第三者の分析会社に結合と集計を依頼する"
  answer: [a]
  choiceNotes:
    a: "正解です。集計しきい値の分析ルールを設定したビューは集計クエリでしか参照できず、しきい値に満たない人数の行は結果から除かれます。共有データのコピーやエクスポートを防ぐエグレス制御も自動で有効になります。"
    b: "メーカーが自社のデータと会員単位で結合するには、ビューが行単位のデータを返す必要があります。集計の最小人数を強制する仕組みや、持ち出しの制限もありません。"
    c: "仮名化しても行単位のデータがメーカーのプロジェクトにコピーされるため、持ち出しを防ぐ要件と、行単位のデータを見せない要件に反します。"
    d: "行単位のデータをファイルとして複製し、第三者にも渡すことになります。ファイルの管理も必要になります。"
  explanation: |
    **データ クリーンルーム** は、複数の組織が互いの行単位のデータを見せずに、データを組み合わせて分析するための仕組みです。BigQuery では Analytics Hub（BigQuery sharing）の機能として提供されています。

    | 役割 | 内容 |
    | --- | --- |
    | クリーンルームのオーナー | クリーンルームを作成し、参加者の権限を管理する |
    | データ コントリビューター | テーブル、ビュー、ルーティンをクリーンルームに追加する |
    | サブスクライバー | クリーンルームのデータを購読し、クエリを実行する |

    共有するビューには **分析ルール** を設定して、許可する分析を制限します。

    | 分析ルール | 制限の内容 |
    | --- | --- |
    | 集計しきい値 | 一定数以上のエンティティ（会員など）を集計した行だけを結果に含める |
    | 差分プライバシー | 結果にノイズを加え、プライバシー バジェットを使い切るとクエリを止める |
    | リストの重複 | 結合した結果のうち、両方に存在する行だけを参照できる |
    | 結合の制限 | 結合に使える列などを制限する |

    - 分析ルールはビューにだけ設定できる。テーブルやマテリアライズド ビューをそのまま追加すると、サブスクライバーは行単位のデータを参照できてしまう
    - 共有データのコピーとエクスポートを防ぐエグレス制御は自動で有効になる。クエリ結果の持ち出しを制限する設定もある
    - 分析ルールだけではすべての抜き取りを防げるとは限らないため、事前に承認したクエリだけを実行させる **クエリ テンプレート** も使える
  diagram: |
    flowchart TD
      subgraph R["小売チェーン"]
        T["購買データ"] --> V["ビュー<br/>集計しきい値の分析ルール"]
      end
      V -->|追加| DCR["データ クリーンルーム"]
      DCR -->|購読| L["メーカーの<br/>リンクされたデータセット"]
      M["メーカーの<br/>広告接触データ"] --> Q["集計クエリ"]
      L --> Q
      Q --> O["しきい値以上の<br/>集計結果だけ"]
  references:
    - title: "データ クリーンルームで機密データを共有する"
      url: "https://docs.cloud.google.com/bigquery/docs/data-clean-rooms"
    - title: "分析ルールを使用してデータアクセスを制限する"
      url: "https://docs.cloud.google.com/bigquery/docs/analysis-rules"

- id: analyze-bi-018
  domain: analyze
  services: [looker, bigquery, iam]
  type: single
  question: |
    ある物流会社では、配送の KPI を表示する Looker Studio のレポートを、全社員約2,000人に公開しています。レポートのデータソースは、レポートを作成したアナリストのオーナーの認証情報で BigQuery に接続しています。このアナリストが来月退職するため、その後レポートでデータを表示できなくなることが心配されています。

    セキュリティ チームは次の方針を示しています。

    - 全社員に BigQuery のデータへのアクセス権は付与しない
    - レポートでデータを表示できるかどうかが、特定の個人のアカウントに依存しないようにする
    - 社員は引き続き、レポート上でフィルタや期間を操作して KPI を確認できる

    これらの方針を満たすには、どうすればよいですか？
  choices:
    a: "データソースの認証情報をサービス アカウントの認証情報に切り替え、そのサービス アカウントに必要な BigQuery の権限を付与する"
    b: "データソースの認証情報を閲覧者の認証情報に切り替え、全社員のグループに BigQuery のデータセットの読み取り権限を付与する"
    c: "退職の前にデータソースのオーナーを別のアナリストに変更し、そのアナリストのオーナーの認証情報で運用を続ける"
    d: "レポートを毎朝 PDF で全社員にメール配信するスケジュールを設定し、レポートそのものの共有はやめる"
  answer: [a]
  choiceNotes:
    a: "正解です。サービス アカウントの認証情報では、個人ではなくサービス アカウントの権限でクエリが実行されます。閲覧者に BigQuery の権限は不要で、担当者の異動や退職の影響も受けません。"
    b: "全社員に BigQuery のデータへのアクセス権を付与することになり、セキュリティ チームの方針に反します。"
    c: "特定の個人のアカウントに依存する状態が続き、そのアナリストが異動や退職をすると同じ問題が起きます。"
    d: "PDF では、社員がレポート上でフィルタや期間を操作できなくなります。"
  explanation: |
    Looker Studio のデータソースでは、どの ID の権限で BigQuery にクエリを実行するかを **データの認証情報** で決めます。

    | 認証情報 | クエリを実行する ID | 閲覧者の BigQuery の権限 | 注意点 |
    | --- | --- | --- | --- |
    | オーナーの認証情報 | データソースのオーナー | 不要 | オーナーがアクセス権を失うと、データを表示できなくなる |
    | 閲覧者の認証情報 | 閲覧している各ユーザー | 必要 | 閲覧者ごとに行レベルのセキュリティなどが適用される |
    | サービス アカウントの認証情報 | サービス アカウント | 不要 | BigQuery のデータソースでのみ使える |

    - データ ガバナンスの観点では、閲覧者の認証情報か、サービス アカウントの認証情報を使うことが推奨されている
    - サービス アカウントの認証情報は、Google Workspace または Cloud Identity で管理された組織で使える
    - Looker Studio のサービス エージェント（組織ごとに1つ）に、サービス アカウントに対する `roles/iam.serviceAccountTokenCreator` を付与して、サービス アカウントを使えるようにする
    - サービス アカウントには、参照するテーブルやデータセットに `roles/bigquery.dataViewer` などの必要最小限の権限を付与する

    レポートそのものの共有（閲覧者・編集者）と、データへのアクセス（認証情報）は別の設定です。レポートを共有しても、データを表示できるかどうかはデータソースの認証情報で決まります。なお、Looker Studio は2026年4月に Data Studio という名称に変わりました。
  references:
    - title: "データの認証情報"
      url: "https://docs.cloud.google.com/data-studio/data-credentials-article"
    - title: "Data Studio 用に Google Cloud のサービス アカウントを設定する"
      url: "https://docs.cloud.google.com/data-studio/set-up-a-google-cloud-service-account"
    - title: "Data Studio のデータ ガバナンスの概要"
      url: "https://docs.cloud.google.com/data-studio/data-governance-in-an-overview"
