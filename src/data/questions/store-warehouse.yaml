- id: store-warehouse-001
  domain: store
  services: [bigquery]
  type: single
  question: |
    ある EC 企業は、オンプレミスの基幹データベースから BigQuery へ注文データを移行しています。元のデータベースでは、注文ヘッダー（orders）と注文明細（order_items）が正規化された別々のテーブルになっており、1件の注文に含まれる明細は平均5件ほどです。BigQuery にも同じ2つのテーブルをそのまま作成したところ、数十億行の orders と order_items を結合する分析クエリで、スロットの消費が大きくなっています。

    分析では、注文は必ず明細と一緒に参照されます。また、注文単位の集計（注文件数、送料の合計）と明細単位の集計（商品別の販売数）の両方を、重複を補正する処理なしで書けるようにしたいと考えています。

    Google が推奨する方法に沿ってテーブルを設計し直すには、どうすればよいですか？
  choices:
    a: "orders と order_items を結合し、明細1行ごとに注文ヘッダーの列を複製したフラットなテーブルとして保存する"
    b: "2つのテーブルをそのまま残し、両方のテーブルを結合キーの order_id でクラスタリングして、結合の処理を速くする"
    c: "orders テーブルに、明細を ARRAY<STRUCT> 型の列として持たせ、1件の注文を1行で保存する"
    d: "orders テーブルに、明細の配列を JSON 型の列として持たせ、1件の注文を1行で保存する"
  answer: [c]
  choiceNotes:
    a: "結合は不要になりますが、送料などの注文単位の値が明細の数だけ重複します。注文単位で集計するたびに重複を除く処理が必要になり、要件に反します。"
    b: "クラスタリングで読み取るブロックは減らせますが、大きなテーブル同士の結合は残ります。非正規化による改善にはなりません。"
    c: "正解です。親子関係にあり、いつも一緒に参照されるデータは、ネストされた繰り返しフィールドで非正規化するのが推奨です。結合が不要になり、注文単位の集計は行のまま、明細単位の集計は UNNEST で書けます。"
    d: "明細の構造は決まっているため、固定のスキーマを持つ STRUCT のほうが型の検証が効き、クエリも書きやすくなります。JSON 型は、属性が頻繁に変わる半構造化データに向いています。"
  explanation: |
    BigQuery では、**ネストされた列（STRUCT）と繰り返し列（ARRAY）** を使った非正規化が推奨されています。特に、注文と明細のような親子関係で、いつも一緒に参照されるデータに向いています。

    | 設計 | 結合 | 注文単位の集計 | 向いている場面 |
    | --- | --- | --- | --- |
    | 正規化（別テーブル） | 必要 | そのまま書ける | 子のデータを単独で更新・参照することが多い |
    | フラットな非正規化 | 不要 | 重複の補正が必要 | 1対1に近い関係 |
    | ネスト＋繰り返し | 不要 | そのまま書ける | 親子関係で一緒に参照する |

    明細単位で集計するときは、`UNNEST` で配列を展開します。

    ```sql
    SELECT item.product_id, SUM(item.quantity) AS qty
    FROM sales.orders, UNNEST(items) AS item
    GROUP BY item.product_id
    ```

    **データ例**: 注文2件を orders テーブルに保存した場合（items の要素は (product_id, quantity)）

    | order_id | shipping_fee | items |
    | --- | --- | --- |
    | O1 | 500 | (P1, 2)、(P2, 1) |
    | O2 | 300 | (P1, 1) |

    注文単位の集計は行のまま書け、注文件数は 2、送料の合計は 800 です。`UNNEST(items)` で展開すると、明細ごとに次の3行になります。

    | order_id | shipping_fee | product_id | quantity |
    | --- | --- | --- | --- |
    | O1 | 500 | P1 | 2 |
    | O1 | 500 | P2 | 1 |
    | O2 | 300 | P1 | 1 |

    上の SQL の結果は P1: 3、P2: 1 です。明細1行ごとに注文ヘッダーを複製したフラットなテーブルは、この展開後の形で保存したものです。そのまま集計すると注文件数が 3、送料の合計が 1,300 になるため、重複の補正が必要になります。

    ただし、子の件数が非常に多い（カーディナリティが高い）関係や、子のデータを個別に頻繁に更新する場合は、別テーブルのほうが扱いやすいこともあります。
  references:
    - title: "ネストされたフィールドと繰り返しフィールドを使用する"
      url: "https://docs.cloud.google.com/bigquery/docs/best-practices-performance-nested"
    - title: "テーブル スキーマでネストされた列と繰り返し列を指定する"
      url: "https://docs.cloud.google.com/bigquery/docs/nested-repeated"

- id: store-warehouse-002
  domain: store
  services: [bigquery]
  type: single
  question: |
    ある動画配信企業は、BigQuery で視聴ログを分析しています。視聴イベントのファクト テーブルは数百億行あり、日付でパーティション分割されています。作品マスタ（約10万行）にはタイトル、ジャンル、配信権の状態などの属性があり、編成の変更に合わせて毎日多くの行が更新されます。分析者は Looker から、作品の最新の属性ごとに視聴数を集計しています。

    チームの一部から「結合をなくすため、作品の属性をすべてファクト テーブルに持たせるべきだ」という提案が出ました。属性の更新にかかる処理コストとクエリの性能の両方を考えたとき、最も適切な設計はどれですか？
  choices:
    a: "作品の属性をファクト テーブルの列にコピーし、作品マスタの更新のたびに該当する行を UPDATE 文で書き換える"
    b: "作品マスタは小さなディメンション テーブルとして分けたままにし、ファクト テーブルとは作品 ID で結合するスター スキーマを維持する"
    c: "作品マスタをジャンル、配信権、出演者などの複数のテーブルにさらに正規化し、スノーフレーク スキーマにする"
    d: "作品の属性を STRUCT 型の列としてファクト テーブルの各行に持たせ、作品マスタが更新されたら該当する行を書き換える"
  answer: [b]
  choiceNotes:
    a: "属性が変わるたびに、数百億行のファクト テーブルの多くのパーティションを書き換えることになり、処理コストが大きくなります。"
    b: "正解です。小さく、更新の多いディメンションを別テーブルにしておけば、更新は小さなテーブルだけで済みます。小さなテーブルとの結合は、BigQuery で効率よく処理されます。"
    c: "結合の数が増え、クエリが複雑になります。属性の更新はもともと小さな作品マスタだけで済むため、さらに正規化する利点はありません。"
    d: "ネストした列にしても、属性はファクト テーブルの各行に複製されます。更新のたびに大量の行を書き換える点は、列にコピーする方法と変わりません。"
  explanation: |
    BigQuery では非正規化が基本ですが、**すべてを1つのテーブルにまとめるのが常に最善とは限りません**。正規化の程度は、データの大きさと更新の頻度で判断します。

    - **非正規化が向く**：ファクトと一緒に読み取られ、ほとんど変わらない属性。親子関係の明細（ネストと繰り返し）
    - **別テーブルが向く**：小さく、頻繁に更新されるディメンション。常に最新の属性で集計したい場合
    - **スター スキーマ**：もともと分析に適した形で、BigQuery でもそのまま使えます。大きなテーブルと小さなテーブルの結合では、小さいほうのテーブルを、大きなテーブルを処理する各スロットに送る **ブロードキャスト結合** が使われるため、効率よく処理されます

    非正規化したテーブルでディメンションの属性が変わると、ファクト テーブルの多くの行を DML で書き換える必要があり、その分のスロットを消費します。「結合を減らす利点」と「更新の手間とコスト」を比べて決めます。
  references:
    - title: "ネストされたフィールドと繰り返しフィールドを使用する"
      url: "https://docs.cloud.google.com/bigquery/docs/best-practices-performance-nested"
    - title: "クエリの計算を最適化する"
      url: "https://docs.cloud.google.com/bigquery/docs/best-practices-performance-compute"
    - title: "スキーマとデータ転送の概要"
      url: "https://docs.cloud.google.com/bigquery/docs/migration/schema-data-overview"

- id: store-warehouse-003
  domain: store
  services: [bigquery]
  type: single
  question: |
    ある物流企業は、配送トラックの車載端末から位置と走行状態のデータを集め、BigQuery に取り込んでいます。端末は通信圏外ではデータをためておき、通信が回復してからまとめて送るため、データが発生から数日遅れて届くことがあります。

    現在のテーブルは、取り込み時間で日単位にパーティション分割されています。分析クエリの多くは「イベントの発生時刻（event_timestamp 列）が直近7日間のデータ」を対象にしていますが、スキャン量が想定より大きく、遅れて届いたデータの扱いも分析者によってばらばらです。

    スキャン量を抑え、遅れて届いたデータも発生日どおりに漏れなく集計できるようにするには、どうすればよいですか？
  choices:
    a: "取り込み時間のパーティション分割を日単位から時間単位に変更し、パーティションを細かくする"
    b: "クエリの条件を、_PARTITIONTIME が直近7日間のものに書き換えて、取り込み時間のパーティションで絞り込む"
    c: "端末 ID（整数）で整数範囲のパーティション分割を行ったテーブルを作成し、データを移す"
    d: "event_timestamp 列で日単位にパーティション分割したテーブルを作成し、データを移す"
  answer: [d]
  choiceNotes:
    a: "パーティションを細かくしても、取り込んだ時刻で分かれる点は変わりません。event_timestamp での絞り込みには効きません。"
    b: "取り込み時刻で絞り込むと、数日遅れて届いたデータは発生日とは別のパーティションに入っているため、発生日どおりの集計になりません。"
    c: "クエリは端末 ID ではなく時刻で絞り込んでいるため、パーティションのプルーニングが効きません。"
    d: "正解です。クエリが絞り込む列でパーティション分割すると、プルーニングが効きます。遅れて届いたデータも、発生日のパーティションに格納されます。"
  explanation: |
    パーティション分割の種類は、**クエリが何で絞り込むか** で選びます。

    | 種類 | 分割の基準 | 向いている場面 |
    | --- | --- | --- |
    | 時間単位の列 | DATE、TIMESTAMP、DATETIME 列の値 | 発生日や注文日など、業務上の日時で絞り込む |
    | 取り込み時間 | BigQuery に取り込まれた時刻（`_PARTITIONTIME`） | 取り込んだ時刻で絞り込む。適切な日時の列がない |
    | 整数範囲 | INTEGER 列の値（開始・終了・間隔を指定） | 店舗 ID などの整数で絞り込む |

    - 時間単位の列と取り込み時間では、時間・日・月・年の単位を選べます。
    - 遅れて届くデータがある場合、取り込み時間で分割すると、同じ発生日のデータが複数のパーティションに散らばります。発生時刻の列で分割すれば、届いた時期にかかわらず正しいパーティションに入ります。
    - 既存のテーブルのパーティション分割の設定は後から変更できません。`CREATE TABLE ... PARTITION BY ... AS SELECT` などで新しいテーブルを作成してデータを移します。

    **データ例**: 今日を 10月20日とし、直近7日間（10月14日〜20日）に発生したデータを集計する場合

    | データ | 発生日 | 届いた日 |
    | --- | --- | --- |
    | A | 10月19日 | 10月19日 |
    | B | 10月15日 | 10月18日 |
    | C | 10月12日 | 10月14日 |

    取り込み時間で分割すると届いた日の、event_timestamp 列で分割すると発生日のパーティションに入ります。集計すべきデータは A と B です。

    - 取り込み時間で分割し、event_timestamp で絞り込む：パーティションを絞り込めず、全期間をスキャンします。
    - 取り込み時間で分割し、`_PARTITIONTIME` で絞り込む：スキャンは7日分ですが、発生日が範囲外の C も集計に入ります。
    - event_timestamp 列で分割する：スキャンは7日分で済み、A と B だけを集計します。
  references:
    - title: "パーティション分割テーブルの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/partitioned-tables"

- id: store-warehouse-004
  domain: store
  services: [bigquery]
  type: single
  question: |
    ある教育 SaaS 企業は、全国の学校向けに学習管理サービスを提供しており、学習履歴を BigQuery の1つのテーブルに保存しています。学校は 1〜3000 の整数の学校 ID で識別され、学校ごとのレポートを作るクエリは、必ず1つの学校 ID で絞り込みます。期間での絞り込みは行わず、各学校の全期間のデータを集計します。このほか、全校を横断した集計も月に一度行います。

    学校ごとのクエリのスキャン量を減らし、さらにクエリを実行する前のドライランで、スキャンされるバイト数を正確に見積もれるようにしたいと考えています。どのテーブル設計が最も適切ですか？
  choices:
    a: "学校 ID 列で整数範囲のパーティション分割を行う"
    b: "パーティション分割はせず、学校 ID 列でクラスタリングする"
    c: "学校ごとに school_0001 のような別々のテーブルを作成する"
    d: "取り込み時間で日単位のパーティション分割を行い、学校 ID 列でクラスタリングする"
  answer: [a]
  choiceNotes:
    a: "正解です。整数の列で絞り込むクエリには、整数範囲のパーティション分割が適しています。パーティションのプルーニングはクエリの実行前に行われるため、ドライランで削減後のスキャン量を見積もれます。"
    b: "クラスタリングでもスキャン量は減りますが、ブロックのプルーニングはクエリの実行中に行われるため、ドライランの見積もりには反映されません。"
    c: "スキーマとメタデータを学校の数だけ管理することになり、全校を横断した集計も3000個のテーブルを参照するクエリになります。BigQuery では、テーブルを分けるよりパーティション分割が推奨されます。"
    d: "クエリは期間で絞り込まないため、取り込み時間のパーティションは役に立ちません。クラスタリングの効果もドライランには反映されません。"
  explanation: |
    パーティション分割とクラスタリングはどちらもスキャン量を減らしますが、**プルーニングがいつ行われるか** が違います。

    | 項目 | パーティション分割 | クラスタリング |
    | --- | --- | --- |
    | プルーニングの時点 | クエリの実行前 | クエリの実行中 |
    | ドライランでの見積もり | 削減後の値がわかる | 削減は反映されない |
    | 指定できる列 | 1列 | 最大4列 |
    | 列のカーディナリティ | パーティション数に上限があるため、低〜中程度 | 高くてもよい |

    整数範囲のパーティション分割では、**開始・終了・間隔** を指定します。範囲外の値は `__UNPARTITIONED__`、NULL は `__NULL__` という特別なパーティションに入ります。

    クエリの費用を実行前に確実に把握したい場合や、パーティション単位でデータを管理したい場合はパーティション分割を選びます。カーディナリティの高い列や、複数の列で絞り込む場合は、クラスタリングを組み合わせます。
  references:
    - title: "パーティション分割テーブルの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/partitioned-tables"
    - title: "クラスタ化テーブルの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/clustered-tables"

- id: store-warehouse-005
  domain: store
  services: [bigquery]
  type: single
  question: |
    ある広告配信企業は、広告の表示ログを BigQuery の1つのテーブルに保存しています。テーブルは表示日（event_date 列）で日単位にパーティション分割されており、数年分で数 PB の大きさです。最近、分析者が event_date で絞り込まないクエリを誤って実行し、テーブル全体をスキャンして高額な料金が発生することが何度かありました。

    分析者はコンソール、BI ツール、ノートブックなど様々なツールからクエリを実行しています。どのツールから実行されても、パーティションを絞り込まないクエリは実行されないようにしたいと考えています。運用の手間が最も少ない方法はどれですか？
  choices:
    a: "分析者に、クエリごとに最大課金バイト数（maximum_bytes_billed）を設定するよう周知する"
    b: "テーブルを日付シャードのテーブルに分割し、分析者には必要な日付のテーブルだけを参照させる"
    c: "パーティションの有効期限を設定して古いパーティションを自動で削除し、テーブル全体の大きさを抑える"
    d: "テーブルに require_partition_filter を設定し、パーティション列で絞り込まないクエリを拒否する"
  answer: [d]
  choiceNotes:
    a: "最大課金バイト数はクエリごとの設定で、利用者が設定し忘れると効果がありません。ツールに関係なく防ぐという要件を満たせません。"
    b: "日付シャードは、性能と管理の両面でパーティション分割に劣り、推奨されません。ワイルドカードで全テーブルを参照すれば、全体のスキャンも起こり得ます。"
    c: "分析に必要な過去のデータまで削除されてしまいます。絞り込まないクエリそのものは防げません。"
    d: "正解です。パーティション フィルタの必須化はテーブル単位の設定なので、どのツールから実行されたクエリにも適用されます。既存のテーブルにも後から設定できます。"
  explanation: |
    **パーティション フィルタの必須化**（`require_partition_filter`）を設定すると、パーティションの除外に使える条件がないクエリは、次のようなエラーで拒否されます。

    `Cannot query over table '...' without a filter over column(s) '...' that can be used for partition elimination`

    ```sql
    ALTER TABLE ads.impressions
    SET OPTIONS (require_partition_filter = TRUE);
    ```

    - 条件はパーティション列だけを参照し、パーティションの除外に使えるものである必要があります。パーティション列をそのまま比較する条件（`=`、`BETWEEN`、`IN` など）を書くのが確実です。
    - テーブルの作成時だけでなく、既存のテーブルにも設定できます。

    スキャン量の上限を設ける主な方法は次のとおりです。

    | 方法 | 単位 | 特徴 |
    | --- | --- | --- |
    | パーティション フィルタの必須化 | テーブル | 絞り込みのないクエリを拒否する |
    | 最大課金バイト数 | クエリ | 上限を超えるクエリを課金なしで失敗させる。設定は利用者任せ |
    | カスタム割り当て | プロジェクト・ユーザー | 1日あたりのスキャン量の合計を制限する |
  references:
    - title: "パーティション分割テーブルの管理"
      url: "https://docs.cloud.google.com/bigquery/docs/managing-partitioned-tables"
    - title: "パーティション分割テーブルの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/partitioned-tables"

- id: store-warehouse-006
  domain: store
  services: [bigquery]
  type: single
  question: |
    ある証券会社は、約定データを BigQuery のテーブルに保存しています。テーブルは約定日（trade_date 列、DATE 型）で日単位にパーティション分割されています。クエリの傾向は次のとおりです。

    - ほぼすべてのクエリが、期間と口座 ID（account_id）で絞り込む
    - 一部のクエリは、さらに銘柄コード（symbol）でも絞り込む
    - 銘柄コードだけで絞り込むクエリはほとんどない

    口座 ID は数百万種類、銘柄コードは数千種類あります。スキャン量を最も効果的に減らすには、どのように設計すればよいですか？
  choices:
    a: "パーティション分割はそのままにし、symbol、account_id の順でクラスタリングする"
    b: "パーティション分割はそのままにし、account_id、symbol の順でクラスタリングする"
    c: "パーティション分割はそのままにし、trade_date、account_id の順でクラスタリングする"
    d: "account_id で整数範囲のパーティション分割を行い、trade_date でクラスタリングする"
  answer: [b]
  choiceNotes:
    a: "先頭の symbol で絞り込むクエリが少ないため、ブロックのプルーニングの効果が小さくなります。"
    b: "正解です。クラスタリングは指定した列の順でデータを並べるため、最もよく絞り込む列を先頭に置くと、プルーニングが最も効きます。2番目の symbol は、口座で絞った後の絞り込みに役立ちます。"
    c: "日単位のパーティションの中では trade_date はすべて同じ値なので、先頭のクラスタリング列にしても効果がありません。"
    d: "ほぼすべてのクエリが使う期間の絞り込みに、パーティションが使えなくなります。口座 ID は種類が多く、パーティション数の上限から多くの口座を1つのパーティションにまとめることになるため、口座での絞り込みの効果も限られます。"
  explanation: |
    パーティション分割とクラスタリングを組み合わせると、**まずパーティションで絞り込み、その中をクラスタリング列の順に並べたブロック単位で絞り込む** という2段階になります。

    クラスタリングの要点は次のとおりです。

    - 列は最大4つまで指定でき、トップレベルの繰り返しでない列が対象です。
    - データは指定した列の順で並べられます。**先頭の列で絞り込んだときに最も効果があり**、2番目、3番目と効果は下がります。2番目の列だけで絞り込んでも効果は限られます。
    - 最も頻繁に絞り込みや集計に使う列を先頭に置きます。
    - データが追加されると、BigQuery がバックグラウンドで自動的に再クラスタリングします。

    **データ例**: 1日分のパーティションに、口座 A1〜A4 が銘柄 S1〜S4 をそれぞれ取引した16件の約定があり、4件ずつ4つのブロックに保存される場合

    | ブロック | account_id が先 | symbol が先 |
    | --- | --- | --- |
    | 1 | A1 の4件（S1〜S4） | S1 の4件（A1〜A4） |
    | 2 | A2 の4件（S1〜S4） | S2 の4件（A1〜A4） |
    | 3 | A3 の4件（S1〜S4） | S3 の4件（A1〜A4） |
    | 4 | A4 の4件（S1〜S4） | S4 の4件（A1〜A4） |

    | クエリの条件 | account_id が先 | symbol が先 |
    | --- | --- | --- |
    | 口座 A2 | ブロック2だけ | 4つすべて |
    | 口座 A2 と銘柄 S3 | ブロック2だけ | ブロック3だけ |
    | 銘柄 S3 だけ | 4つすべて | ブロック3だけ |

    ほぼすべてのクエリが口座で絞り込むため、account_id を先頭にすると読み取るブロックが最も少なくなります。実際には1つの口座の約定が複数のブロックにまたがることもあり、その場合は2番目の symbol でさらにブロックを絞り込めます。

    | 列の性質 | 向いている方法 |
    | --- | --- |
    | 日付など、範囲で絞り込む低〜中カーディナリティの列 | パーティション分割 |
    | 口座 ID など、高カーディナリティの列 | クラスタリング |
    | 複数の列の組み合わせで絞り込む | クラスタリング（列の順序に注意） |
  references:
    - title: "クラスタ化テーブルに対してクエリを実行する"
      url: "https://docs.cloud.google.com/bigquery/docs/querying-clustered-tables"
    - title: "クラスタ化テーブルを作成する"
      url: "https://docs.cloud.google.com/bigquery/docs/creating-clustered-tables"

- id: store-warehouse-007
  domain: store
  services: [bigquery]
  type: single
  question: |
    ある鉄道会社は、車両の機器から集めたセンサーの集計データを、日ごとに sensor_YYYYMMDD という名前の別々のテーブルとして BigQuery に保存してきました。5年分で約1,800のテーブルがあり、分析者はワイルドカード テーブル（sensor_*）と _TABLE_SUFFIX を使って期間を指定しています。

    最近、次の問題が目立つようになりました。

    - 長い期間を対象にしたクエリが遅い
    - 列を追加するたびに、すべてのテーブルのスキーマをそろえる作業が必要になる

    Google が推奨するテーブル構成に移行するには、どうすればよいですか？
  choices:
    a: "日付テーブルを月ごとにまとめて、sensor_YYYYMM という月単位のテーブルにし、テーブルの数を減らす"
    b: "すべての日付テーブルを UNION ALL で結合するビューを作成し、分析者にはそのビューを参照させる"
    c: "日付テーブルのデータを、日付の列でパーティション分割した1つのテーブルに移し、以降はそこに追加する"
    d: "日付テーブルの構成はそのままにし、各テーブルを車両 ID でクラスタリングして読み取る量を減らす"
  answer: [c]
  choiceNotes:
    a: "テーブルの数は減りますが、シャーディングであることは変わりません。テーブルごとのスキーマ管理とメタデータのオーバーヘッドは残ります。"
    b: "参照は簡単になりますが、裏側にある多数のテーブルと、それぞれのスキーマを管理する手間は変わりません。"
    c: "正解です。パーティション分割したテーブルでは、スキーマとメタデータが1つにまとまり、日付の列で絞り込むとプルーニングが効きます。列の追加も1回で済みます。"
    d: "各テーブル内の読み取りは減らせますが、テーブルが多いことによるオーバーヘッドとスキーマ管理の問題は解決しません。"
  explanation: |
    日付ごとにテーブルを分ける **日付シャード** は、BigQuery では推奨されません。代わりにパーティション分割テーブルを使います。

    | 項目 | 日付シャード | パーティション分割テーブル |
    | --- | --- | --- |
    | スキーマとメタデータ | テーブルごとに保持 | 1つ |
    | クエリの性能 | 参照するテーブルが多いほど低下 | パーティションのプルーニングで効率よく読む |
    | スキーマの変更 | 全テーブルに適用が必要 | 1回で済む |

    既存のシャードは、ワイルドカード テーブルを使って1つのパーティション分割テーブルにまとめられます。

    ```sql
    CREATE TABLE rail.sensor
    PARTITION BY reading_date
    CLUSTER BY vehicle_id
    AS
    SELECT PARSE_DATE('%Y%m%d', _TABLE_SUFFIX) AS reading_date, *
    FROM `rail.sensor_*`;
    ```

    **データ例**: ワイルドカード テーブル `rail.sensor_*` では、テーブル名の `sensor_` より後の部分（`20261001` など）が `_TABLE_SUFFIX` になり、上の SQL で reading_date の値に変換されます。

    | 元のテーブル | 移行後の reading_date |
    | --- | --- |
    | sensor_20261001 | 2026-10-01 |
    | sensor_20261002 | 2026-10-02 |

    約1,800のテーブルが、1つのテーブルの約1,800のパーティションになります。移行後は、クエリの `_TABLE_SUFFIX` の条件をパーティション列の条件に書き換えます。

    ```sql
    -- 移行前
    WHERE _TABLE_SUFFIX
      BETWEEN '20260101' AND '20260331'
    -- 移行後
    WHERE reading_date
      BETWEEN '2026-01-01' AND '2026-03-31'
    ```

    日付シャードのテーブルを、取り込み時間でパーティション分割したテーブルに変換する方法も用意されています。
  references:
    - title: "パーティション分割テーブルの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/partitioned-tables"

- id: store-warehouse-008
  domain: store
  services: [bigquery]
  type: single
  question: |
    あるスーパーマーケット チェーンは、BigQuery にスター スキーマのデータ ウェアハウスを構築しています。売上のファクト テーブル（sales）と、店舗（stores）・商品（products）・日付（dates）のディメンション テーブルがあります。BI ツールは、ファクト テーブルとすべてのディメンション テーブルを結合したビューを参照しており、ファクト テーブルの列しか使わないレポートでも、毎回すべての結合が実行されています。

    ディメンション テーブルのキーが一意であることと、ファクト テーブルのキーが必ずディメンション テーブルに存在することは、ETL のパイプラインで保証されています。BI ツールのクエリとビューの定義を変えずに、不要な結合を減らしてクエリを速くするには、どうすればよいですか？
  choices:
    a: "すべてのディメンションの属性をファクト テーブルにコピーして非正規化し、ビューを使わずにファクト テーブルを直接参照させる"
    b: "ファクト テーブルを、ディメンション テーブルとの結合に使うキー列でクラスタリングする"
    c: "ディメンション テーブルのキー列に検索インデックスを作成し、結合時のキーの検索を速くする"
    d: "ディメンションのキー列に主キーを、ファクト テーブルの列に外部キーを NOT ENFORCED で定義する"
  answer: [d]
  choiceNotes:
    a: "結合はなくなりますが、BI ツールの参照先が変わり、「クエリとビューを変えない」という要件に反します。ディメンションの更新のたびにファクト テーブルを書き換える必要も生じます。"
    b: "読み取るブロックが減ることはありますが、不要な結合そのものは実行され続けます。"
    c: "検索インデックスは、テキストなどから特定の値を探すクエリ向けの機能です。結合を省略する効果はありません。"
    d: "正解です。BigQuery は主キーと外部キーの制約をクエリの最適化に使い、結果に影響しない結合の省略や、結合の順序の改善を行います。"
  explanation: |
    BigQuery の **主キー・外部キー制約** は、データを検証しない（NOT ENFORCED）代わりに、クエリ オプティマイザが結合の最適化に使います。

    ```sql
    ALTER TABLE dwh.stores ADD PRIMARY KEY (store_id) NOT ENFORCED;

    ALTER TABLE dwh.sales
      ADD CONSTRAINT fk_store FOREIGN KEY (store_id)
      REFERENCES dwh.stores(store_id) NOT ENFORCED;
    ```

    主な最適化は次の3つです。

    - **内部結合の除去**：sales と stores を結合しても sales の列しか使わない場合、外部キーと主キーにより store_id が NULL でない各行は stores のちょうど1行に一致するため、結合を省略して `store_id IS NOT NULL` の条件に置き換えられる
    - **外部結合の除去**：右側の結合キーが一意で、左側の列しか使わない LEFT OUTER JOIN を省略できる
    - **結合の並べ替え**：制約の情報をもとに、より効率のよい結合の順序を選ぶ

    **注意点**：BigQuery は制約を検証しません。重複や存在しないキーがあると、最適化によって **誤った結果** が返ることがあります。制約を定義する場合は、ETL などでデータが制約を満たすことを保証します。
  references:
    - title: "主キーと外部キーを使用する"
      url: "https://docs.cloud.google.com/bigquery/docs/primary-foreign-keys"

- id: store-warehouse-009
  domain: store
  services: [bigquery, bigtable]
  type: single
  question: |
    ある通信事業者のセキュリティ チームは、アプリケーションのログを BigQuery のテーブル（日付でパーティション分割、数十 TB）に保存しています。インシデントの調査では、自由形式の message 列や JSON 型の payload 列に含まれる特定の IP アドレスやエラー ID を探すクエリを頻繁に実行しますが、該当する行はごくわずかです。現在は列全体を読み取るため、結果が出るまでに時間がかかり、スキャン量も大きくなっています。

    データを BigQuery に置いたまま、運用の手間を最小限に抑えて、このような検索を速くするには、どうすればよいですか？
  choices:
    a: "message 列と payload 列に検索インデックスを作成し、クエリでは SEARCH 関数を使う"
    b: "ログを Bigtable にも書き込み、IP アドレスやエラー ID を行キーにしたテーブルで検索する"
    c: "message 列でクラスタリングし、LIKE 演算子による部分一致の検索を速くする"
    d: "message 列のエンベディングを生成してベクトル インデックスを作成し、VECTOR_SEARCH 関数で検索する"
  answer: [a]
  choiceNotes:
    a: "正解です。検索インデックスは、テキストや JSON に含まれる特定の語句を探すクエリで、読み取るデータを大幅に減らします。インデックスの更新は BigQuery が自動で行います。"
    b: "データの二重管理と、Bigtable の行キー設計や運用が必要になります。「BigQuery に置いたまま」「運用の手間を最小限に」という要件に反します。"
    c: "クラスタリングは列の値の並び順でブロックを絞り込む仕組みです。長い文字列の途中に含まれる語句の検索には、ほとんど効きません。"
    d: "ベクトル検索は意味の近さで探す機能で、特定の IP アドレスやエラー ID と完全に一致する行を探す用途には向きません。"
  explanation: |
    **検索インデックス** は、大きなテーブルから特定の語句を含むごく一部の行を探すクエリを速くする機能です。

    ```sql
    CREATE SEARCH INDEX app_logs_index
    ON security.app_logs(message, payload);

    SELECT *
    FROM security.app_logs
    WHERE log_date >= '2026-10-01'
      AND SEARCH(message, 'E7741902');
    ```

    - `STRING` や `JSON` の列のほか、それらを含む `ARRAY` や `STRUCT` の列などを対象にできます。
    - SEARCH 関数のほか、`=`、`IN`、`LIKE`、`STARTS_WITH` を使った条件でもインデックスが使われることがあります。
    - インデックスの作成と更新は BigQuery が自動で管理します。まだインデックスに反映されていないデータがあっても、クエリの結果は正しく返ります。
    - 効果が大きいのは、該当する行がテーブル全体のごく一部の場合です。

    | 機能 | 向いている検索 |
    | --- | --- |
    | 検索インデックス | 特定の語句や値と一致する行を探す |
    | クラスタリング | 列の値の範囲や一致で、まとまったブロックを絞り込む |
    | ベクトル インデックス | 意味が近いデータを探す |
  references:
    - title: "インデックス登録済みデータを検索する"
      url: "https://docs.cloud.google.com/bigquery/docs/search"
    - title: "検索インデックスを管理する"
      url: "https://docs.cloud.google.com/bigquery/docs/search-index"

- id: store-warehouse-010
  domain: store
  services: [bigquery]
  type: single
  question: |
    あるスマート家電メーカーは、エアコン、冷蔵庫、照明など多くの種類の機器から状態のイベントを集め、BigQuery に保存しています。イベントの属性は機器の種類ごとに異なり、ファームウェアの更新に合わせて新しい属性が毎週のように追加されます。

    現在は属性を JSON 形式の文字列として STRING 型の列に保存し、クエリのたびに文字列を解析して必要な属性を取り出しているため、クエリに時間がかかっています。属性が追加されるたびにテーブルのスキーマを変更する作業はしたくありません。

    どのように保存すればよいですか？
  choices:
    a: "すべての属性を STRUCT 型の列にまとめ、新しい属性が追加されたら STRUCT にフィールドを追加する"
    b: "属性を JSON 型の列に保存し、クエリではフィールドを直接指定して必要な属性を取り出す"
    c: "機器の種類ごとに別のテーブルを作成し、それぞれのテーブルで属性を通常の列として定義する"
    d: "属性を ARRAY<STRUCT<key STRING, value STRING>> 型の、キーと値の組の配列として保存する"
  answer: [b]
  choiceNotes:
    a: "STRUCT は固定のスキーマを持つため、属性が追加されるたびにスキーマの変更が必要になり、要件に反します。"
    b: "正解です。JSON 型は、あらかじめスキーマを定義しなくても半構造化データを保存でき、取り込み時に解析された形で格納されます。クエリのたびに文字列を解析する必要がありません。"
    c: "テーブルの数が増えるうえ、属性の追加のたびにスキーマ変更が必要な点は変わりません。機器の種類をまたぐ分析も複雑になります。"
    d: "スキーマの変更は不要になりますが、値がすべて文字列になり、型の情報が失われます。属性を取り出すたびに UNNEST と絞り込みが必要で、クエリも複雑になります。"
  explanation: |
    属性が頻繁に変わる半構造化データには、BigQuery の **JSON 型** が向いています。

    | 保存方法 | スキーマ | クエリ時の処理 | 向いている場面 |
    | --- | --- | --- | --- |
    | STRING に JSON 文字列 | 不要 | 毎回、文字列を解析する | 生のまま保管するだけ |
    | JSON 型 | 不要 | 解析済みのフィールドを直接読む | 属性が頻繁に変わる、種類ごとに違う |
    | STRUCT 型 | 固定 | 通常の列と同じ | 構造が決まっていて、型の検証をしたい |

    JSON 型の列は、ドット記法でフィールドを指定し、必要に応じて型を変換して使います。

    ```sql
    SELECT
      device_id,
      FLOAT64(attributes.target_temp) AS target_temp,
      STRING(attributes.mode) AS mode
    FROM iot.device_events
    WHERE device_type = 'aircon';
    ```

    文字列から JSON 型に変換するには `PARSE_JSON` 関数を使います。読み込みジョブや Storage Write API で、JSON 型の列に直接書き込むこともできます。
  references:
    - title: "GoogleSQL で JSON データを操作する"
      url: "https://docs.cloud.google.com/bigquery/docs/json-data"

- id: store-warehouse-011
  domain: store
  services: [bigquery]
  type: single
  question: |
    ある保険会社は、BigQuery で保険金の請求データを分析しています。顧客ディメンションには住所や、職業に基づくリスク区分などの属性があり、契約者の転居や転職によって変わります。基幹システムからは毎日、属性が変わった顧客の最新の値だけが届きます。

    分析では、次の2つが求められています。

    - 請求が発生した時点の住所とリスク区分で、請求を集計する
    - 現在の住所とリスク区分で、顧客の一覧を出す

    過去の属性を何年分でもさかのぼれるようにするには、顧客ディメンションをどのように管理すればよいですか？
  choices:
    a: "MERGE 文で、変更があった顧客の行の住所とリスク区分を、基幹システムから届いた最新の値に毎日上書きする"
    b: "MERGE 文で最新の値に上書きし、過去の属性はタイムトラベル（FOR SYSTEM_TIME AS OF）で参照する"
    c: "顧客の行に「1つ前の住所」と「1つ前のリスク区分」の列を追加し、変更のたびに直前の値をそこに移す"
    d: "変更のたびに、有効期間（valid_from、valid_to）と現在フラグを持つ行を追加し、古い行の有効期間を終了させる"
  answer: [d]
  choiceNotes:
    a: "SCD タイプ1 の設計です。過去の属性が失われるため、請求が発生した時点の属性で集計できません。"
    b: "タイムトラベルでさかのぼれるのは最大7日間です。何年分もの履歴を参照する用途には使えません。"
    c: "SCD タイプ3 の設計です。1つ前の値しか残らないため、2回以上変わった顧客の過去の属性はわかりません。"
    d: "正解です。SCD タイプ2 の設計です。請求日が有効期間に含まれる行と結合すれば当時の属性で集計でき、フラグで現在の行だけを選ぶこともできます。"
  explanation: |
    属性が時間とともに変わるディメンションを **SCD（緩やかに変化するディメンション）** と呼び、履歴の残し方でタイプが分かれます。

    | タイプ | 変更時の処理 | 履歴 |
    | --- | --- | --- |
    | タイプ1 | 行を上書きする | 残らない |
    | タイプ2 | 新しい行を追加し、古い行の有効期間を終了する | すべて残る |
    | タイプ3 | 「前の値」の列に移す | 1つ前だけ残る |

    タイプ2 のディメンションは、ファクトの日付が有効期間に含まれる行と結合します。

    ```sql
    SELECT c.risk_class, SUM(cl.amount) AS total_amount
    FROM insurance.claims AS cl
    JOIN insurance.customer_dim AS c
      ON cl.customer_id = c.customer_id
     AND cl.claim_date >= c.valid_from
     AND cl.claim_date < c.valid_to
    GROUP BY c.risk_class;
    ```

    **データ例**: 顧客 C001 が転職し、2026-04-01 にリスク区分が B から A に変わった場合

    変更前は、B の行（valid_to が 9999-12-31、現在フラグが TRUE）の1行だけです。変更後は次の2行になります。

    | リスク区分 | valid_from | valid_to | 現在フラグ |
    | --- | --- | --- | --- |
    | B | 2023-05-10 | 2026-04-01 | FALSE |
    | A | 2026-04-01 | 9999-12-31 | TRUE |

    | 請求 | claim_date | amount | 結合される行 |
    | --- | --- | --- | --- |
    | CL1 | 2025-11-20 | 30万円 | B の行 |
    | CL2 | 2026-06-15 | 50万円 | A の行 |

    C001 の請求だけで見ると、上の SQL では B に 30万円、A に 50万円が集計されます。現在の一覧は、現在フラグが TRUE の A の行を使います。行を上書き（タイプ1）していた場合は、CL1 も A として集計されてしまいます。

    BigQuery では、毎日の変更データをもとに、古い行の有効期間を終了する更新と新しい行の追加を、MERGE 文（または複数ステートメントのトランザクション）で行います。タイムトラベルは誤操作からの復旧などに使う短期間の機能で、長期の履歴管理には使えません。
  diagram: |
    flowchart TD
      S["基幹システム<br/>変更された顧客"] --> M["毎日の MERGE"]
      M -->|古い行| O["valid_to を設定<br/>現在フラグを外す"]
      M -->|新しい行| N["valid_from を設定<br/>現在フラグを付ける"]
      O --> D["顧客ディメンション<br/>SCD タイプ2"]
      N --> D
      F["請求ファクト"] -->|請求日が有効期間内| D
  references:
    - title: "GoogleSQL のデータ操作言語（DML）ステートメント"
      url: "https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/dml-syntax"
    - title: "タイムトラベルを使用して履歴データにアクセスする"
      url: "https://docs.cloud.google.com/bigquery/docs/time-travel"

- id: store-warehouse-012
  domain: store
  services: [biglake, bigquery, cloud-storage, iam]
  type: multiple
  question: |
    ある製薬企業は、治験データを Parquet 形式で Cloud Storage のデータレイクに保存しています。データは BigQuery と、Dataproc 上の Apache Spark の両方から分析されています。現在は BigQuery の外部テーブルを使っており、利用者にはバケットの読み取り権限を付与しています。

    コンプライアンス部門から、次の対応を求められました。

    - 研究者には、自分が担当する治験施設の行だけを見せる
    - 被験者の識別子の列は、許可された担当者以外には見せない
    - BigQuery と Spark のどちらから読み取っても同じ制御を適用し、データの複製は作らない

    どの対応を組み合わせるべきですか？
  choices:
    a: "BigLake テーブルを作成して行アクセス ポリシーとポリシータグを設定し、Spark からは BigQuery Storage API 経由で読み取る"
    b: "治験施設ごとにバケットのフォルダを分け、IAM Conditions を使って研究者ごとに担当施設のフォルダの読み取りを許可する"
    c: "利用者のバケットへの直接の権限を外し、バケットには接続のサービス アカウントだけがアクセスできるようにする"
    d: "Parquet のデータを BigQuery のネイティブ テーブルに読み込み、ネイティブ テーブルに行と列のアクセス制御を設定する"
    e: "外部テーブルのままにし、Spark のジョブでは被験者の識別子の列を読み取らないようにコードを修正する"
  answer: [a, c]
  choiceNotes:
    a: "正解です。BigLake テーブルはアクセスの委任によって、行レベル・列レベルのセキュリティを適用できます。Storage API を使うコネクタからの読み取りにも、同じポリシーが適用されます。"
    b: "フォルダ単位の制御では、識別子の列だけを隠すことはできません。BigQuery と Spark で同じ制御をそろえることも難しくなります。"
    c: "正解です。バケットへの直接の権限が残っていると、ファイルを直接読み取ってテーブルの制御を回避できてしまいます。データへのアクセスは、接続のサービス アカウントに限定します。"
    d: "データの複製を作ることになり、要件に反します。Spark は Cloud Storage の元のファイルを読み続けるため、制御も統一されません。"
    e: "制御が Spark のコードに依存し、行の制御もできません。バケットへの権限が残るため、ファイルを直接読めば制御を回避できます。"
  explanation: |
    **BigLake テーブル** は、Cloud Storage などの外部のデータに対して、BigQuery と同じきめ細かいアクセス制御を適用できるテーブルです。この制御には **アクセスの委任** を使います。

    - 利用者に付与するのは **テーブルへの権限だけ** です。
    - Cloud Storage のデータは、Cloud リソース接続に紐づくサービス アカウントが代わりに読み取ります。
    - そのため、行アクセス ポリシー、列のポリシータグ、データ マスキングをテーブル単位で適用できます。
    - Spark などのエンジンも BigQuery Storage API を通じて読み取れば、同じポリシーが適用されます。

    | 項目 | 外部テーブル（BigLake 以外） | BigLake テーブル |
    | --- | --- | --- |
    | 利用者に必要な権限 | テーブルと、Cloud Storage のデータ | テーブルだけ |
    | 行・列レベルのセキュリティ | 使えない | 使える |
    | メタデータのキャッシュ | 使えない | 使える |

    利用者にバケットへの直接の権限が残っていると、この仕組みを迂回できます。BigLake に移行するときは、権限の整理も合わせて行います。
  diagram: |
    flowchart TD
      R["研究者"] -->|テーブルの権限だけ| BQ["BigQuery"]
      SP["Spark on Dataproc"] -->|Storage API| BQ
      BQ --> T["BigLake テーブル<br/>行・列のポリシー"]
      T --> C["Cloud リソース接続<br/>サービス アカウント"]
      C -->|読み取り| G["Cloud Storage<br/>Parquet"]
      R -.->|直接の権限なし| G
  references:
    - title: "BigLake 外部テーブルの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/biglake-intro"
    - title: "列レベルのアクセス制御の概要"
      url: "https://docs.cloud.google.com/bigquery/docs/column-level-security-intro"

- id: store-warehouse-013
  domain: store
  services: [biglake, bigquery, cloud-storage]
  type: multiple
  question: |
    ある旅行予約サイトは、Web サイトのクリックストリームを Parquet 形式で Cloud Storage に保存しています。ファイルは gs://example-clicks/events/dt=YYYY-MM-DD/hour=HH/ のように日付と時刻ごとのフォルダに分かれ、合計で数十万個あります。新しいファイルは1時間ごとのバッチ処理で追加されます。

    BigQuery では gs://example-clicks/events/* を参照する BigLake テーブルを定義していますが、dt で1日分に絞り込んだクエリでも、多くのファイルが読み取られ、結果が出るまでに時間がかかっています。ダッシュボードには、数時間前までのデータが反映されていれば十分です。

    クエリの性能を改善するには、どの対応を組み合わせるべきですか？
  choices:
    a: "テーブル定義で Hive パーティショニングを有効にし、dt と hour をパーティション キーとして認識させる"
    b: "Parquet ファイルをヘッダー行付きの CSV 形式に変換し、スキーマの自動検出で読み取らせる"
    c: "並列に読み取れるように、1時間ごとのファイルをさらに細かく分割し、1ファイルあたりの大きさを小さくする"
    d: "メタデータのキャッシュを有効にし、max_staleness を4時間にして自動で更新させる"
    e: "日付ごとに別々の BigLake テーブルを作成し、クエリでは必要な日付のテーブルだけを参照する"
  answer: [a, d]
  choiceNotes:
    a: "正解です。key=value 形式のフォルダ構成をパーティションとして認識させると、dt や hour の条件で不要なファイルを読み飛ばせます。"
    b: "CSV は列指向の形式ではなく、必要な列だけを読み取れないため、Parquet より性能が下がります。"
    c: "小さなファイルが増えると、ファイルの一覧と読み取りのオーバーヘッドがかえって大きくなります。"
    d: "正解です。メタデータのキャッシュを使うと、クエリのたびに Cloud Storage のファイルを一覧する必要がなくなり、ファイルの多いテーブルで特に効果があります。数時間の遅れは許されるため、自動更新で要件を満たせます。"
    e: "日付ごとのテーブルは日付シャードと同じ問題を抱え、期間をまたぐ分析も複雑になります。"
  explanation: |
    Cloud Storage 上のデータレイクを BigQuery から効率よく読むための、代表的な2つの設定です。

    **1. Hive パーティショニング**

    - `dt=2026-10-01/hour=09/` のような key=value 形式のフォルダを、パーティション キーとして認識させます。
    - パーティション キーで絞り込むと、条件に合わないフォルダのファイルを読み飛ばします。
    - パーティション キーでの絞り込みを必須にする設定（`require_hive_partition_filter`）もあります。

    **2. BigLake テーブルのメタデータのキャッシュ**

    - ファイルの一覧などのメタデータを BigQuery 側に保持し、クエリのたびに Cloud Storage を一覧する処理を省きます。
    - `max_staleness` は30分〜7日の範囲で指定します。キャッシュがこの期間より古いと、Cloud Storage から直接メタデータを読み取ります。
    - 更新方法は、自動（`AUTOMATIC`）か、`BQ.REFRESH_EXTERNAL_METADATA_CACHE` プロシージャを呼ぶ手動（`MANUAL`）を選べます。ETL の完了に合わせて更新したい場合は手動を使います。

    ```sql
    CREATE OR REPLACE EXTERNAL TABLE travel.clicks
    WITH CONNECTION `my-project.us.lake-conn`
    WITH PARTITION COLUMNS
    OPTIONS (
      format = 'PARQUET',
      uris = ['gs://example-clicks/events/*'],
      hive_partition_uri_prefix = 'gs://example-clicks/events',
      max_staleness = INTERVAL 4 HOUR,
      metadata_cache_mode = 'AUTOMATIC'
    );
    ```
  diagram: |
    flowchart TD
      G["Cloud Storage<br/>数十万個のファイル"] -.->|自動で更新| C["メタデータのキャッシュ<br/>ファイル名とパーティション"]
      Q["dt で1日分に<br/>絞り込むクエリ"] -->|一覧はキャッシュから| C
      C -->|Hive パーティションの<br/>dt で絞り込み| F["1日分のファイルだけを<br/>読み取る"]
  references:
    - title: "外部パーティション分割データを使用する"
      url: "https://docs.cloud.google.com/bigquery/docs/hive-partitioned-queries"
    - title: "外部テーブルのメタデータ キャッシュ"
      url: "https://docs.cloud.google.com/bigquery/docs/metadata-caching-external-tables"

- id: store-warehouse-014
  domain: store
  services: [bigquery, biglake, bigquery-ml, cloud-storage]
  type: single
  question: |
    ある自動車部品メーカーは、製造ラインの外観検査で撮影した数百万枚の画像を Cloud Storage に保存しています。品質管理チームは、BigQuery にある生産実績のデータと画像を組み合わせて、次のように分析したいと考えています。

    - 撮影日時やファイルサイズなどの画像のメタデータを、SQL で検索したい
    - BigQuery ML に取り込んだ既存の画像分類モデルで、不良品の判定を SQL から実行したい
    - 各工場の担当者には、自分の工場の画像だけを扱わせたい。バケットへの直接の権限は与えない

    画像を移動・複製せずに要件を満たすには、どうすればよいですか？
  choices:
    a: "画像を BYTES 型の列として BigQuery のネイティブ テーブルに読み込み、ML.PREDICT で推論する。工場ごとに承認済みビューを作成する"
    b: "画像のバケットに対してオブジェクト テーブルを作成して ML.PREDICT で推論し、行アクセス ポリシーで工場ごとに制限する"
    c: "画像のバケットを参照する BigLake テーブルを Parquet 形式で作成し、ML.PREDICT で推論する。列のポリシータグで工場ごとに制限する"
    d: "Cloud Run functions で画像のメタデータを BigQuery のテーブルに書き込み、推論は工場ごとに Vertex AI のバッチ推論で実行する"
  answer: [b]
  choiceNotes:
    a: "数百万枚の画像を BigQuery に複製することになり、「移動・複製しない」という要件に反します。"
    b: "正解です。オブジェクト テーブルを使うと、Cloud Storage の非構造化データを、メタデータの列を持つ読み取り専用のテーブルとして扱えます。アクセスの委任により利用者にはテーブルの権限だけを与え、行アクセス ポリシーで見せる画像を制限できます。"
    c: "Parquet 形式の BigLake テーブルは構造化データ向けで、画像ファイルを読み取ることはできません。ポリシータグも列単位の制御なので、画像ごとの制限には使えません。"
    d: "メタデータの同期と推論を別々の仕組みで作り込むことになり、SQL から推論するという要件も満たしません。"
  explanation: |
    **オブジェクト テーブル** は、画像、音声、PDF などの非構造化データを BigQuery から扱うための、読み取り専用のテーブルです。

    - 1つのオブジェクトが1行になり、`uri`、`content_type`、`size`、`updated` などのメタデータが列として見えます。
    - オブジェクトの内容は `data` 疑似列で参照でき、`ML.DECODE_IMAGE` 関数で画像を変換して BigQuery ML の推論に渡せます。リモート関数やリモートモデルで分析することもできます。
    - 推論の結果は、BigQuery の構造化データとそのまま結合できます。
    - BigLake と同じく接続によるアクセスの委任を使うため、行アクセス ポリシーで、利用者ごとに見えるオブジェクトを絞り込めます（例：工場ごとのフォルダの URI で絞り込む）。

    ```sql
    CREATE EXTERNAL TABLE qc.inspection_images
    WITH CONNECTION `my-project.us.lake-conn`
    OPTIONS (
      object_metadata = 'SIMPLE',
      uris = ['gs://example-inspection/*']
    );
    ```

    | テーブル | 対象のデータ |
    | --- | --- |
    | BigLake テーブル | Parquet、ORC、Avro、CSV などの構造化・半構造化データ |
    | オブジェクト テーブル | 画像、音声、文書などの非構造化データ |
  references:
    - title: "オブジェクト テーブルの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/object-table-introduction"

- id: store-warehouse-015
  domain: store
  services: [bigquery, biglake, cloud-storage, dataproc]
  type: single
  question: |
    あるフィンテック企業は、レイクハウスの構築を進めています。データは自社の Cloud Storage バケットにオープンなテーブル形式の Apache Iceberg で保存し、Dataproc 上の Spark などのエンジンからも同じデータを読み取れるようにする方針です。一方、BigQuery では次の処理を行う必要があります。

    - 決済システムの変更データを、MERGE 文で頻繁にテーブルへ反映する
    - Storage Write API で、大量のイベントをストリーミングで書き込む
    - 小さなファイルの統合などのストレージの保守を、自前のジョブなしで行う

    どの構成が最も適切ですか？
  choices:
    a: "Spark で作成した Iceberg テーブルを、BigQuery では Apache Iceberg 用の BigLake 外部テーブルとして参照し、MERGE 文で更新する"
    b: "データは BigQuery のネイティブ テーブルに保存し、Spark 向けに毎日 Parquet 形式で Cloud Storage へエクスポートする"
    c: "BigQuery が管理する Apache Iceberg テーブルを自社のバケットに作成し、Spark からは Iceberg のメタデータを通じて読み取る"
    d: "Spark で Iceberg テーブルを管理し、小さなファイルの統合と古いスナップショットの削除を行うジョブを Cloud Composer で定期実行する"
  answer: [c]
  choiceNotes:
    a: "Iceberg の外部テーブルは、BigQuery からは読み取り専用です。MERGE 文などの DML でデータを変更することはできません。"
    b: "データが2か所に重複し、Spark から見るデータは最大1日遅れます。1つのデータをオープンな形式で共有するという方針に反します。"
    c: "正解です。このテーブルは、データを自社のバケットに Iceberg 形式で保存しながら、DML、Storage Write API によるストリーミング、ストレージの自動最適化を利用できます。Spark などのエンジンからは、Iceberg のテーブルとして読み取れます。"
    d: "ストレージの保守を自前のジョブで行うことになり、要件に反します。BigQuery からは読み取りしかできないため、MERGE やストリーミングの書き込みもできません。"
  explanation: |
    BigQuery で Apache Iceberg を扱う方法は、**誰がテーブルを管理し、どこから書き込むか** で選びます。

    | 項目 | ネイティブ テーブル | BigQuery が管理する Iceberg テーブル | Iceberg の外部テーブル |
    | --- | --- | --- | --- |
    | データの保存先 | BigQuery のストレージ | 自社のバケット（Parquet と Iceberg メタデータ） | 自社のバケット |
    | BigQuery からの DML・ストリーミング | できる | できる | できない（読み取り専用） |
    | ストレージの最適化 | BigQuery | BigQuery が自動で行う | 利用者が行う |
    | 他のエンジンからの読み取り | Storage API 経由 | Iceberg として直接 | Iceberg として直接 |

    BigQuery が管理する Iceberg テーブルの主な特徴は次のとおりです。

    - ファイルサイズの調整、自動クラスタリング、不要ファイルの削除、メタデータの最適化を自動で行います。
    - 直接書き込めるのは BigQuery だけです。Spark や Dataflow からは、Storage Write API を使うコネクタ経由で書き込みます。

    この機能は名称が何度か変わっており、BigQuery tables for Apache Iceberg、BigLake tables for Apache Iceberg in BigQuery、Apache Iceberg managed tables などと表記されます。
  diagram: |
    flowchart TD
      CDC["決済システムの<br/>変更データ"] -->|MERGE| BQ["BigQuery"]
      EV["イベント"] -->|Storage Write API| BQ
      BQ --> T["Iceberg テーブル<br/>BigQuery が管理"]
      T --> G["自社の Cloud Storage<br/>Parquet と Iceberg メタデータ"]
      SP["Spark on Dataproc"] -->|Iceberg として読み取り| G
  references:
    - title: "Apache Iceberg マネージド テーブル"
      url: "https://docs.cloud.google.com/bigquery/docs/iceberg-tables"

- id: store-warehouse-016
  domain: store
  services: [biglake, dataproc, bigquery, cloud-storage]
  type: single
  question: |
    あるゲーム会社のデータ サイエンス チームは、Dataproc 上の Apache Spark で Apache Iceberg のテーブルを作成・更新し、データを Cloud Storage に保存しています。テーブルは毎週のように新しく作られ、既存のテーブルも毎日更新されます。分析チームは、これらのテーブルを BigQuery から SQL で参照したいと考えています。

    データは複製せず、テーブルが追加・更新されるたびに BigQuery 側で手作業をしなくて済むようにしたいと考えています。また、メタストアのサーバーを自分たちで運用したくありません。どうすればよいですか？
  choices:
    a: "新しいテーブルが作られるたびに、最新のメタデータ ファイルを指定した Iceberg の外部テーブルを BigQuery で作成し直す"
    b: "Spark のジョブの最後に、Iceberg テーブルのデータを BigQuery のネイティブ テーブルに読み込むステップを追加する"
    c: "Compute Engine 上に Hive メタストアを構築して Spark のカタログとし、BigQuery にはテーブルごとに外部テーブルを定義する"
    d: "Spark の Iceberg カタログに BigLake metastore を使い、BigQuery から同じテーブルを直接参照する"
  answer: [d]
  choiceNotes:
    a: "テーブルの作成や更新のたびに手作業が必要になり、要件に反します。メタデータ ファイルを指定したテーブルは、新しいスナップショットに合わせて定義を更新する必要があります。"
    b: "データが BigQuery に複製されるため、要件に反します。読み込みの処理とその監視も必要になります。"
    c: "メタストアのサーバーを自分たちで運用することになり、テーブルごとの定義の作業も残ります。"
    d: "正解です。BigLake metastore はサーバーレスの共有メタストアで、Spark などのオープンソースのエンジンと BigQuery が、同じ Iceberg のテーブル定義を参照できます。"
  explanation: |
    **BigLake metastore** は、複数のエンジンが同じテーブルのメタデータを共有するための、サーバーレスのメタストアです。Iceberg のテーブル情報を1か所で管理します。

    - Spark では、BigLake metastore の Iceberg REST カタログなどを、Iceberg のカタログとして設定します。
    - Spark などのオープンソースのエンジンで作成・更新したテーブルを、BigQuery からテーブルごとの定義なしでクエリできます。
    - メタストアのサーバーの構築、拡張、パッチ適用は不要です。

    Iceberg を扱う構成は、**主にどのエンジンが書き込むか** で選びます。

    | 主に書き込むエンジン | 構成 |
    | --- | --- |
    | Spark などのオープンソースのエンジン | BigLake metastore で管理する Iceberg テーブル（BigQuery からは読み取る） |
    | BigQuery（DML、ストリーミング） | BigQuery が管理する Iceberg テーブル |

    なお、BigLake は2026年4月に Lakehouse for Apache Iceberg という名称に変わり、BigLake metastore は Lakehouse runtime catalog と呼ばれるようになりました。API、クライアント ライブラリ、IAM の名前には BigLake が残っています。試験ガイドでは BigLake の名称が使われています。
  diagram: |
    flowchart TD
      SP["Spark on Dataproc<br/>テーブルを作成・更新"] --> M["BigLake metastore<br/>共有の Iceberg カタログ"]
      BQ["BigQuery<br/>SQL で参照"] --> M
      M -->|テーブルの場所| G["Cloud Storage<br/>Iceberg のデータ"]
  references:
    - title: "BigLake metastore の Iceberg REST カタログを使用する"
      url: "https://docs.cloud.google.com/biglake/docs/blms-rest-catalog"

- id: store-warehouse-017
  domain: store
  services: [dataplex, biglake, cloud-storage, dlp]
  type: single
  question: |
    ある食品・飲料メーカーでは、多くの部署が Cloud Storage のバケットに CSV、JSON、Parquet のファイルや、商品パンフレットの PDF を置いています。データアナリストには、どこにどのようなデータがあるのかがわかりません。また、新しいデータを BigQuery から分析するには、データエンジニアがファイルを調べて外部テーブルを1つずつ定義する必要があります。

    ファイルのスキーマとパーティションを人が調べなくても、BigQuery からクエリできるテーブルが作成・更新され、カタログで検索できるようにしたいと考えています。利用者にはバケットへの直接の権限を与えず、自作のコードも増やしたくありません。どうすればよいですか？
  choices:
    a: "オブジェクトの作成時に起動する Cloud Run functions で、スキーマを自動検出して外部テーブルを作成する処理を実装する"
    b: "Dataplex Universal Catalog の自動検出をバケットに設定し、接続を指定してテーブルを作成・更新させる"
    c: "BigQuery Data Transfer Service で、バケットのファイルを毎日 BigQuery のネイティブ テーブルに読み込む"
    d: "Sensitive Data Protection の検出サービスをバケットに設定し、作成されたデータ プロファイルをもとにテーブルを定義する"
  answer: [b]
  choiceNotes:
    a: "動作はしますが、スキーマの推定、パーティションの扱い、エラー処理などを自作のコードで保守することになり、要件に反します。"
    b: "正解です。自動検出は、バケットのファイルから構造化・半構造化データの BigLake テーブルと、非構造化データのオブジェクト テーブルを作成・更新し、カタログにも登録します。接続を使うため、利用者にバケットの権限は不要です。"
    c: "データを BigQuery に複製するうえ、データごとに転送の設定が必要です。PDF などの非構造化データも扱えません。"
    d: "Sensitive Data Protection の検出は、機密データの種類と場所を把握するための機能です。クエリできるテーブルを作成するものではありません。"
  explanation: |
    Dataplex Universal Catalog の **自動検出（ディスカバリー スキャン）** を使うと、Cloud Storage のデータレイクを手作業なしで BigQuery から使えるようにできます。

    - バケットやパスの中のファイルを読み、同じ形式のファイルをまとめてテーブルにします。スキーマとパーティションの定義も自動で収集します。
    - 構造化・半構造化データ：接続を指定すると BigLake テーブル、指定しないと通常の外部テーブルが作成されます。
    - 非構造化データ：同じ種類のファイルのまとまりが、オブジェクト テーブルとして登録されます。
    - 作成されたテーブルはカタログにも登録されるため、利用者は検索して見つけられます。
    - スキャンは定期的に実行でき、ファイルの追加やスキーマの変化がテーブルに反映されます。

    なお、Dataplex Universal Catalog は2026年4月に Knowledge Catalog に名称が変わりました。API や IAM の名前は変わっていません。
  diagram: |
    flowchart TD
      G["Cloud Storage<br/>CSV・JSON・Parquet・PDF"] --> S["自動検出<br/>ディスカバリー スキャン"]
      S -->|構造化・半構造化| B["BigLake テーブル"]
      S -->|非構造化| O["オブジェクト テーブル"]
      S --> C["カタログ"]
      A["データアナリスト"] -->|検索| C
      A -->|SQL| B
  references:
    - title: "Cloud Storage のデータを検出してカタログに登録する"
      url: "https://docs.cloud.google.com/bigquery/docs/automatic-discovery"

- id: store-warehouse-018
  domain: store
  services: [dataplex, bigquery, cloud-storage]
  type: single
  question: |
    ある大手小売グループには、EC、店舗、物流の3つの事業部門があり、各部門のデータ チームが自部門の Google Cloud プロジェクトで BigQuery のデータセットと Cloud Storage のバケットを管理しています。グループでは、各部門が自分たちのデータに責任を持ち、他部門が使えるデータ プロダクトとして公開する、データメッシュの考え方に移行する方針です。

    中央のデータ ガバナンス チームは、データを1か所に集めずに全部門のデータを横断して検索できるようにし、メタデータの付与やデータ品質のチェックを全社共通のルールで行いたいと考えています。どの設計が最も適切ですか？
  choices:
    a: "各部門のデータを中央のプロジェクトの BigQuery に毎日コピーし、中央のデータ チームがスキーマとデータ品質を一元的に管理する"
    b: "各部門がそれぞれ独自のカタログ ツールとデータ品質のチェック方法を選び、部門ごとにメタデータを管理する"
    c: "データは各部門のプロジェクトに置いたまま、Dataplex Universal Catalog で全部門のメタデータと品質ルールを管理する"
    d: "全部門で1つの Google Cloud プロジェクトを共有し、部門ごとにデータセット名の接頭辞を決めて、アクセスはデータセット単位で管理する"
  answer: [c]
  choiceNotes:
    a: "データを1か所に集める中央集権型の構成で、データメッシュの方針に反します。コピーによる重複と遅れが生じ、中央のチームがボトルネックになります。"
    b: "所有は分散できますが、全社共通のルールによるガバナンスがなく、部門を横断した検索もできません。"
    c: "正解です。データの所有と管理は各部門のプロジェクトに任せたまま、部門を横断した検索、メタデータの付与、データ品質のチェックを、カタログを中心に全社共通のルールで行えます。"
    d: "1つのプロジェクトに集めると、部門ごとの費用や権限の独立性が損なわれます。各部門が自分のプロジェクトで管理するというデータメッシュの考え方に合いません。"
  explanation: |
    **データメッシュ** は、データを中央に集めるのではなく、データを最もよく理解している各ドメインのチームが所有し、データ プロダクトとして提供する考え方です。

    | 原則 | 内容 |
    | --- | --- |
    | ドメインによる所有 | 各事業部門がデータの所有と品質に責任を持つ |
    | プロダクトとしてのデータ | 他のチームが見つけやすく、信頼して使える形で公開する |
    | セルフサービスのデータ基盤 | 各ドメインが共通の基盤を自分で使える |
    | 連携型（フェデレーテッド）のガバナンス | 全社共通のルールを、各ドメインが自律的に守る |

    Google Cloud では、**プロジェクトをドメインごとに分け**、ガバナンスの共通基盤として **Dataplex Universal Catalog** を使う構成が基本です。

    | 要件 | Dataplex Universal Catalog の機能 |
    | --- | --- |
    | 部門を横断した検索 | BigQuery などのメタデータが自動で取り込まれ、利用者は権限のある範囲で、プロジェクトをまたいで検索できる |
    | 共通のメタデータ | アスペクト タイプで項目と形式を決めて各部門のデータに付け、ビジネス用語集で用語をそろえる |
    | データ品質 | データ品質スキャンで、共通の基準に沿ったルールを各部門のデータに適用する |
    | データの流れの把握 | データリネージで、部門をまたぐデータの流れをたどる |

    データの保存と費用、アクセス権の付与は各ドメインのプロジェクトに残したまま、カタログとルールだけを全社で共有する点が、中央集権型のデータ ウェアハウスとの違いです。

    なお、Dataplex Universal Catalog は2026年4月に Knowledge Catalog に名称が変わりました。
  diagram: |
    flowchart TD
      P1["EC 部門のプロジェクト<br/>データセット・バケット"] -->|メタデータ| DP["Dataplex Universal Catalog<br/>検索・アスペクト・品質ルール"]
      P2["店舗部門のプロジェクト"] -->|メタデータ| DP
      P3["物流部門のプロジェクト"] -->|メタデータ| DP
      U["他部門の利用者"] -->|検索| DP
      U -->|権限を得てクエリ| P1
  references:
    - title: "データメッシュのアーキテクチャと機能"
      url: "https://docs.cloud.google.com/architecture/data-mesh"
    - title: "Dataplex Universal Catalog の概要"
      url: "https://docs.cloud.google.com/dataplex/docs/introduction"
    - title: "自動データ品質の概要"
      url: "https://docs.cloud.google.com/dataplex/docs/auto-data-quality-overview"

- id: store-warehouse-019
  domain: store
  services: [bigquery, iam]
  type: single
  question: |
    ある銀行では、決済、融資、リスク管理の3つのチームが、それぞれ自分たちのデータを BigQuery で管理し、他のチームが使うデータ プロダクトとして公開しています。次の要件があります。

    - データの保存にかかる費用は、データを所有するチームに請求する
    - データ プロダクトを使うクエリの費用は、クエリを実行した利用側のチームに請求する
    - 各チームが、自分のデータへのアクセスを他のチームと独立して管理できる
    - データ プロダクトは複製せず、常に最新のデータを参照させる

    プロジェクトとデータセットをどのように構成すればよいですか？
  choices:
    a: "1つの共通プロジェクトにチームごとのデータセットを作成し、すべてのチームがその共通プロジェクトでクエリを実行する"
    b: "チームごとにプロジェクトを分け、利用側のチームのプロジェクトに、データ プロダクトのテーブルを毎日コピーする"
    c: "1つの共通プロジェクトの1つのデータセットに全チームのテーブルを置き、テーブル名の接頭辞でチームを区別する"
    d: "チームごとのプロジェクトにデータセットを置き、利用側は自分のプロジェクトからクエリを実行する"
  answer: [d]
  choiceNotes:
    a: "クエリの費用がすべて共通プロジェクトに請求され、チームごとに分けられません。権限の管理も1か所に集中します。"
    b: "データが複製され、利用側は最大1日古いデータを参照することになります。コピーの保存費用も利用側にかかります。"
    c: "費用をチームごとに分けられず、テーブルごとの権限の管理も煩雑になります。"
    d: "正解です。保存の費用はデータセットのあるプロジェクトに、クエリの費用はクエリを実行したプロジェクトに請求されます。利用側にはデータセットの閲覧権限を付与すれば、複製せずに最新のデータを参照できます。"
  explanation: |
    分散したチームでデータを分けるときは、BigQuery の **費用と権限がどの単位で決まるか** を押さえておきます。

    | 項目 | 決まり方 |
    | --- | --- |
    | 保存の費用 | データセットがあるプロジェクトに請求される |
    | クエリの費用 | クエリのジョブを実行したプロジェクトに請求される |
    | 権限 | 組織、フォルダ、プロジェクト、データセット、テーブルなどの単位で付与できる |

    データメッシュでよく使われる構成は次のとおりです。

    - **データを所有するチームのプロジェクト**：データ プロダクトのデータセットを置く。公開用のデータセットと作業用のデータセットを分けると、公開範囲を管理しやすい
    - **利用側のプロジェクト**：自分のプロジェクトでクエリを実行し、データ プロダクトのデータセットには `roles/bigquery.dataViewer` などの閲覧権限を付与してもらう
    - **中央のガバナンス**：カタログや共通のルールを管理する

    組織の外部や多数の利用者に公開する場合は、BigQuery sharing（旧 Analytics Hub）のリスティングとして公開する方法もあります。
  references:
    - title: "データメッシュのアーキテクチャと機能"
      url: "https://docs.cloud.google.com/architecture/data-mesh"
    - title: "IAM でリソースへのアクセスを制御する"
      url: "https://docs.cloud.google.com/bigquery/docs/control-access-to-resources-iam"

- id: store-warehouse-020
  domain: store
  services: [dataplex, bigquery]
  type: multiple
  question: |
    ある病院グループのデータ ガバナンス チームは、BigQuery にある数千のテーブルのメタデータを整備しようとしています。次の2つを実現したいと考えています。

    - すべてのテーブルに、データの所有者、管理部署、保存期間の区分を、決まった項目と形式で付ける
    - 「在院日数」「再入院率」などの業務用語の定義を一元管理し、その用語に当たる列から定義を参照できるようにする

    Dataplex Universal Catalog を使って実現するには、どの機能を組み合わせるべきですか？
  choices:
    a: "Data Catalog のタグ テンプレートを作成し、各テーブルにタグを付ける"
    b: "所有者などの項目を定義したアスペクト タイプを作成し、各テーブルのエントリにアスペクトとして付ける"
    c: "業務用語ごとにポリシータグを作成し、該当する列にポリシータグを付ける"
    d: "ビジネス用語集に業務用語と定義を登録し、用語を該当する列にリンクする"
    e: "テーブルの説明欄とラベルに、所有者や用語の定義を自由な形式で書き込む"
  answer: [b, d]
  choiceNotes:
    a: "Data Catalog は非推奨で、メタデータの管理は Dataplex Universal Catalog に移行されています。新しく採用する方法としては適切ではありません。"
    b: "正解です。アスペクト タイプはメタデータのテンプレートで、項目とその型を定義できます。BigQuery のテーブルのエントリにも、アスペクトとして追加できます。"
    c: "ポリシータグは列レベルのアクセス制御のための仕組みで、業務用語の定義を管理するものではありません。"
    d: "正解です。ビジネス用語集では業務用語と定義を一元管理でき、用語を特定の列にリンクすると、カタログで定義を参照できます。"
    e: "自由な形式では項目や形式をそろえられず、決まった形式で付けるという要件を満たせません。"
  explanation: |
    Dataplex Universal Catalog のメタデータ管理は、次の要素で構成されます。

    | 要素 | 役割 |
    | --- | --- |
    | エントリ | テーブルなどのデータ資産を表すメタデータ |
    | エントリ グループ | エントリをまとめて、権限や場所を管理する単位 |
    | エントリ タイプ | エントリの種類。必須のアスペクトを決めて標準をそろえられる |
    | アスペクト タイプ | メタデータの項目を定義するテンプレート |
    | アスペクト | アスペクト タイプに沿ってエントリに付けるメタデータ |

    - BigQuery のテーブルなどは、システムが自動でエントリを作成し、同期します。自動で付く必須のアスペクトは変更できませんが、任意のアスペクトを追加して業務上のメタデータを付けられます。
    - **ビジネス用語集** では、用語と定義を管理し、用語どうし（同義語、関連語）や、用語と列を結び付けられます。

    以前の Data Catalog のタグ テンプレートとタグは、アスペクト タイプとアスペクトに置き換わっています。また、Dataplex Universal Catalog は2026年4月に Knowledge Catalog に名称が変わりました。API や IAM の名前は変わっていません。
  references:
    - title: "Dataplex Universal Catalog のメタデータ管理について"
      url: "https://docs.cloud.google.com/dataplex/docs/catalog-overview"
    - title: "ビジネス用語集を管理する"
      url: "https://docs.cloud.google.com/dataplex/docs/create-glossary"

- id: store-warehouse-021
  domain: store
  services: [dataplex, bigquery, dataform, monitoring]
  type: single
  question: |
    ある人材サービス企業は、BigQuery で求人と応募のデータを分析しています。Cloud Storage からの読み込みジョブ、スケジュールされたクエリ、Dataform のワークフローによって、多くの中間テーブルとレポート用のテーブルが作られています。

    来月、元データのテーブルの一部の列の型が変わることになりました。影響を受ける下流のテーブルと、それを作っている処理をすべて洗い出したいと考えています。また今後も、レポートの数値がどのテーブルから来ているのかを継続的にたどれるようにしたいと考えています。自作の仕組みを作らずに実現するには、どうすればよいですか？
  choices:
    a: "INFORMATION_SCHEMA.JOBS のクエリ文を定期的に解析し、参照元のテーブルと書き込み先のテーブルの対応表を作成する"
    b: "Data Lineage API を有効にし、BigQuery のジョブから記録されるリネージのグラフで上流と下流をたどる"
    c: "Cloud Audit Logs のデータアクセス ログを BigQuery にエクスポートし、ログからテーブル間の依存関係を集計する"
    d: "各テーブルでデータ プロファイル スキャンを実行し、列の値の分布が似ているテーブルどうしを依存関係として扱う"
  answer: [b]
  choiceNotes:
    a: "依存関係は把握できますが、SQL の解析と対応表の保守を自作することになり、要件に反します。"
    b: "正解です。Data Lineage API を有効にすると、読み込み、コピー、クエリなどの BigQuery のジョブからリネージが自動で記録されます。グラフで上流と下流をたどり、影響の範囲を確認できます。"
    c: "ログからの集計も自作の仕組みになり、要件に反します。"
    d: "データ プロファイルは列の統計情報を得る機能で、テーブル間の依存関係はわかりません。"
  explanation: |
    **データリネージ** は、データがどこから来て、どの処理を経て、どこへ流れたかを記録する機能です。

    - Data Lineage API を有効にすると、BigQuery の次のジョブからリネージが自動で記録されます。
      - コピー ジョブ、Cloud Storage からの読み込みジョブ、DDL（`CREATE TABLE AS SELECT` など）によるテーブルの作成
      - `INSERT SELECT`、`MERGE`、`UPDATE`、`DELETE` などの DML による既存テーブルの変更
    - スケジュールされたクエリや Dataform も BigQuery のジョブとして実行されるため、同じように記録されます。
    - 自動で記録されないシステムからは、API でリネージを登録できます。OpenLineage 形式のイベントも受け付けます。

    主な使い方は次の2つです。

    | 使い方 | 内容 |
    | --- | --- |
    | 影響の分析 | 元データの変更が、下流のどのテーブルやレポートに影響するかを調べる |
    | 原因の調査 | レポートの値がおかしいとき、上流のどのテーブルや処理が原因かをたどる |
  diagram: |
    flowchart TD
      G["Cloud Storage"] -->|読み込みジョブ| R["元データのテーブル"]
      R -->|スケジュールされたクエリ| M["中間テーブル"]
      M -->|Dataform| P["レポート用テーブル"]
      R -.->|自動で記録| L["Data Lineage API"]
      M -.-> L
      P -.-> L
      L --> V["リネージ グラフで<br/>影響範囲を確認"]
  references:
    - title: "データリネージについて"
      url: "https://docs.cloud.google.com/dataplex/docs/about-data-lineage"

- id: store-warehouse-022
  domain: store
  services: [bigquery, cloud-sql, datastream, migration]
  type: multiple
  question: |
    ある家具チェーンは、受注システムのデータベースに Cloud SQL for PostgreSQL を使い、過去の販売実績や顧客のデータは BigQuery に蓄積しています。商品企画チームは月に数回、受注システムにある最新の注文や配送予定の状況と、BigQuery にある過去の販売実績を組み合わせて分析したいと考えています。

    要件は次のとおりです。

    - 分析には、分析を実行した時点の最新の受注データを使う
    - 分析の頻度が低いため、受注データを BigQuery に継続的に複製する仕組みを新たに構築・運用することは避ける
    - 分析は BigQuery の SQL で行う

    どの対応を組み合わせるべきですか？
  choices:
    a: "BigQuery で、受注システムの Cloud SQL インスタンスに接続するための接続リソースを作成する"
    b: "EXTERNAL_QUERY 関数で受注システムに SQL を送り、その結果を BigQuery の販売実績のテーブルと結合する"
    c: "Datastream で受注システムの変更を BigQuery に継続的に複製し、複製したテーブルと販売実績のテーブルを結合する"
    d: "毎晩、受注システムのテーブルを CSV で Cloud Storage にエクスポートし、BigQuery の外部テーブルとして参照する"
    e: "Database Migration Service で受注システムのデータベースを BigQuery に移行し、移行したテーブルを分析に使う"
  answer: [a, b]
  choiceNotes:
    a: "正解です。連携クエリを使うには、Cloud SQL のインスタンス、データベース、ユーザーの情報を登録した接続リソースを BigQuery に作成します。クエリでは、この接続を指定して Cloud SQL にアクセスします。"
    b: "正解です。EXTERNAL_QUERY は、指定した SQL を Cloud SQL 側で実行し、結果を一時的なテーブルとして BigQuery に返します。データを複製せずに、実行した時点の最新のデータを BigQuery のテーブルと1つのクエリで結合できます。"
    c: "数分以内の遅れで分析できますが、継続的な複製の仕組みを構築・運用することになり、要件に反します。"
    d: "前日の夜の時点のデータしか使えず、最新のデータで分析するという要件を満たしません。エクスポートの処理も新たに運用する必要があります。"
    e: "Database Migration Service の移行先は Cloud SQL や AlloyDB などのデータベースで、BigQuery は移行先にできません。受注システム自体を移行したいわけでもありません。"
  explanation: |
    **連携クエリ（federated query）** を使うと、データを BigQuery に複製せずに、Cloud SQL、AlloyDB、Spanner のデータを BigQuery の SQL から参照できます。

    ```sql
    SELECT h.product_id, h.sales_last_year, o.open_orders
    FROM furniture.sales_history AS h
    JOIN EXTERNAL_QUERY(
      "my-project.asia-northeast1.orders-conn",
      "SELECT product_id, COUNT(*) AS open_orders FROM orders WHERE status = 'OPEN' GROUP BY product_id"
    ) AS o
    ON h.product_id = o.product_id;
    ```

    - 外部のクエリはデータベース側で実行されるため、受注システムに負荷がかかります。重いクエリを実行する場合は、リードレプリカを対象にすることも検討します。
    - 連携クエリは読み取り専用です。結果は一時的なテーブルとして返され、BigQuery のテーブルと結合できます。
    - BigQuery のストレージにあるテーブルを読むより、クエリは遅くなりがちです。

    | 方法 | データの鮮度 | 運用 | 向いている場面 |
    | --- | --- | --- | --- |
    | 連携クエリ | クエリを実行した時点 | 接続リソースの作成と管理 | 頻度の低い分析、少量のデータの参照 |
    | Datastream による複製 | 数分以内の遅れ | ストリームの運用 | 頻繁な分析、大量のデータの集計 |
    | 定期的なエクスポート | エクスポートした時点 | エクスポートの処理の運用 | 鮮度を問わない集計 |
  diagram: |
    flowchart TD
      U["商品企画チーム"] -->|BigQuery の SQL| BQ["BigQuery<br/>過去の販売実績"]
      BQ -->|EXTERNAL_QUERY| C["接続リソース"]
      C --> DB["Cloud SQL<br/>受注システム"]
      DB -.->|実行時点の結果| BQ
  references:
    - title: "連携クエリの概要"
      url: "https://docs.cloud.google.com/bigquery/docs/federated-queries-intro"
    - title: "Cloud SQL 連携クエリ"
      url: "https://docs.cloud.google.com/bigquery/docs/cloud-sql-federated-queries"
